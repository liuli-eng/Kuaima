<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快马日结 - 举报处理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
    <style>
        .stat-card-icon {
            background: linear-gradient(135deg, #FFF0EB 0%, #FFE8DC 100%);
            color: var(--primary);
        }
        .stat-card-icon.blue {
            background: linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 100%);
            color: var(--secondary);
        }
        .stat-card-icon.green {
            background: linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 100%);
            color: var(--success);
        }
        .stat-card-icon.red {
            background: linear-gradient(135deg, #FEF2F2 0%, #FEE2E2 100%);
            color: var(--danger);
        }
        .detail-section {
            margin-bottom: 20px;
        }
        .detail-section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .evidence-photos {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .evidence-thumb {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            background: linear-gradient(135deg, #FFE8DC 0%, #FFF0EB 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .evidence-thumb:hover {
            transform: scale(1.05);
        }
        .detail-info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .detail-info-item {
            display: flex;
            gap: 8px;
            font-size: 13px;
        }
        .detail-info-label {
            color: var(--text-secondary);
            min-width: 80px;
        }
        .detail-info-value {
            color: var(--text-primary);
            font-weight: 500;
        }
        .report-content-box {
            background: var(--bg-page);
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            color: var(--text-primary);
            line-height: 1.6;
        }
        .action-btn-group {
            display: flex;
            gap: 10px;
        }
        .tag-pending {
            background: #FEF3C7;
            color: var(--warning);
        }
        .tag-processed {
            background: #D1FAE5;
            color: var(--success);
        }
        .tag-rejected {
            background: #FEE2E2;
            color: var(--danger);
        }
        .tag-type-violation {
            background: #FEF2F2;
            color: var(--danger);
        }
        .tag-type-dispute {
            background: #EFF6FF;
            color: var(--secondary);
        }
        .tag-type-fake {
            background: #FFFBEB;
            color: var(--warning);
        }
    </style>
</head>
<body class="admin-layout">
    <div class="admin-sidebar"></div>
    <div class="admin-main">
        <div class="admin-topbar"></div>
        <div class="admin-content">
            <div class="page-header">
                <h1 class="page-title">举报处理</h1>
                <p class="page-desc">违规举报、纠纷处理、申诉管理</p>
            </div>

            <div class="stat-cards">
                <div class="stat-card">
                    <div class="stat-card-header">
                        <span class="stat-card-title">待处理</span>
                        <div class="stat-card-icon red">
                            <i class="fas fa-hourglass-half"></i>
                        </div>
                    </div>
                    <div class="stat-card-value">45</div>
                    <div class="stat-card-change up" style="color:var(--danger);">
                        <i class="fas fa-exclamation-circle"></i>
                        <span>需优先处理</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-card-header">
                        <span class="stat-card-title">本月举报</span>
                        <div class="stat-card-icon">
                            <i class="fas fa-flag"></i>
                        </div>
                    </div>
                    <div class="stat-card-value">156</div>
                    <div class="stat-card-change up">
                        <i class="fas fa-arrow-up"></i>
                        <span>较上月 +18.2%</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-card-header">
                        <span class="stat-card-title">已处理</span>
                        <div class="stat-card-icon green">
                            <i class="fas fa-check-circle"></i>
                        </div>
                    </div>
                    <div class="stat-card-value">128</div>
                    <div class="stat-card-change up">
                        <i class="fas fa-arrow-up"></i>
                        <span>较上月 +12.5%</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-card-header">
                        <span class="stat-card-title">处理率</span>
                        <div class="stat-card-icon blue">
                            <i class="fas fa-chart-line"></i>
                        </div>
                    </div>
                    <div class="stat-card-value">82.1%</div>
                    <div class="stat-card-change up">
                        <i class="fas fa-arrow-up"></i>
                        <span>较上月 +3.2%</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="filter-bar">
                    <div class="filter-item">
                        <span>举报类型</span>
                        <select class="form-input form-select" style="width:130px;">
                            <option value="">全部</option>
                            <option>违规</option>
                            <option>纠纷</option>
                            <option>虚假信息</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <span>处理状态</span>
                        <select class="form-input form-select" style="width:130px;">
                            <option value="">全部</option>
                            <option>待处理</option>
                            <option>处理中</option>
                            <option>已处理</option>
                            <option>已驳回</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <span>举报时间</span>
                        <input type="date" class="form-input" style="width:150px;">
                        <span>至</span>
                        <input type="date" class="form-input" style="width:150px;">
                    </div>
                    <div style="flex:1;"></div>
                    <button class="btn btn-primary btn-sm" onclick="applyFilter()">
                        <i class="fas fa-search"></i> 查询
                    </button>
                    <button class="btn btn-outline btn-sm" onclick="resetFilter()">
                        <i class="fas fa-undo"></i> 重置
                    </button>
                </div>
            </div>

            <div class="card" style="margin-top: 16px;">
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>举报ID</th>
                                <th>举报人</th>
                                <th>被举报人</th>
                                <th>举报类型</th>
                                <th>关联订单</th>
                                <th>举报时间</th>
                                <th>处理状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="reportTableBody">
                        </tbody>
                    </table>
                </div>
                <div class="pagination">
                    <div class="pagination-info">共 156 条举报记录</div>
                    <div class="pagination-controls">
                        <button class="page-btn" disabled><i class="fas fa-chevron-left" style="font-size:10px;"></i></button>
                        <button class="page-btn active">1</button>
                        <button class="page-btn">2</button>
                        <button class="page-btn">3</button>
                        <button class="page-btn">4</button>
                        <button class="page-btn">5</button>
                        <span style="color:var(--text-muted); padding:0 4px;">...</span>
                        <button class="page-btn">12</button>
                        <button class="page-btn"><i class="fas fa-chevron-right" style="font-size:10px;"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="detailModal" style="display:none;">
        <div class="modal" style="max-width:680px;">
            <div class="modal-header">
                <span class="modal-title">举报详情</span>
                <div class="modal-close" onclick="closeModal('detailModal')">
                    <i class="fas fa-times"></i>
                </div>
            </div>
            <div class="modal-body" id="detailModalBody">
            </div>
            <div class="modal-footer" id="detailModalFooter">
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="actionModal" style="display:none;">
        <div class="modal" style="max-width:420px;">
            <div class="modal-header">
                <span class="modal-title">处理操作</span>
                <div class="modal-close" onclick="closeModal('actionModal')">
                    <i class="fas fa-times"></i>
                </div>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">处理结果</label>
                    <select class="form-input form-select">
                        <option>警告</option>
                        <option>封禁账号</option>
                        <option>驳回举报</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">处理备注</label>
                    <textarea class="form-input form-textarea" placeholder="请输入处理原因..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('actionModal')">取消</button>
                <button class="btn btn-primary" onclick="submitAction()">确认提交</button>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
    <script>
        initPageLayout();

        const reportsData = [
            {
                id: 'RP20240315001',
                reporter: '张建国',
                reporterAvatar: '张',
                reporterColor: '#FF6B35',
                reported: '深圳富士康科技集团',
                reportedAvatar: '富',
                reportedColor: '#2563EB',
                type: '违规',
                orderId: 'KM20240315001',
                time: '2024-03-15 18:30',
                status: 'pending',
                content: '雇主在招工描述中承诺工作地点位于厂区内，但实际安排在距离厂区3公里外的临时仓库，存在欺骗行为。且工作环境恶劣，与描述严重不符。',
                photos: 3
            },
            {
                id: 'RP20240315002',
                reporter: '李美丽',
                reporterAvatar: '李',
                reporterColor: '#2563EB',
                reported: '王老板',
                reportedAvatar: '王',
                reportedColor: '#10B981',
                type: '纠纷',
                orderId: 'KM20240315002',
                time: '2024-03-15 17:45',
                status: 'pending',
                content: '订单完成后，雇主以各种理由克扣工资，原本约定220元/天，实际只愿意支付150元。多次沟通无果，请求平台介入协调。',
                photos: 2
            },
            {
                id: 'RP20240314003',
                reporter: '王小刚',
                reporterAvatar: '王',
                reporterColor: '#10B981',
                reported: '赵某',
                reportedAvatar: '赵',
                reportedColor: '#F59E0B',
                type: '虚假信息',
                orderId: 'KM20240314003',
                time: '2024-03-14 16:20',
                status: 'processing',
                content: '对方自称是比亚迪电子厂招工负责人，收取了200元押金后失联，怀疑是虚假招工信息，请求平台核实并协助追回押金。',
                photos: 4
            },
            {
                id: 'RP20240314004',
                reporter: '陈大海',
                reporterAvatar: '陈',
                reporterColor: '#8B5CF6',
                reported: '顺丰速运有限公司',
                reportedAvatar: '顺',
                reportedColor: '#06B6D4',
                type: '违规',
                orderId: 'KM20240314004',
                time: '2024-03-14 14:10',
                status: 'processed',
                content: '反映快递公司强制要求员工超时工作，且不支付加班费。工作时间从早上7点到晚上10点，严重违反劳动法规定。',
                photos: 1
            },
            {
                id: 'RP20240313005',
                reporter: '刘芳',
                reporterAvatar: '刘',
                reporterColor: '#F59E0B',
                reported: '李某',
                reportedAvatar: '李',
                reportedColor: '#EF4444',
                type: '纠纷',
                orderId: 'KM20240313005',
                time: '2024-03-13 19:00',
                status: 'processed',
                content: '工作过程中与现场负责人发生口角，被要求立即离开且不结算当日工资。要求雇主支付当日工资共计260元。',
                photos: 2
            },
            {
                id: 'RP20240313006',
                reporter: '赵小红',
                reporterAvatar: '赵',
                reporterColor: '#EC4899',
                reported: '肯德基餐饮管理',
                reportedAvatar: '肯',
                reportedColor: '#F59E0B',
                type: '违规',
                orderId: 'KM20240313006',
                time: '2024-03-13 15:30',
                status: 'rejected',
                content: '举报雇主未与零工签订任何书面合同，且存在收取工作服押金的行为，违反相关规定。',
                photos: 0
            },
            {
                id: 'RP20240312007',
                reporter: '周志华',
                reporterAvatar: '周',
                reporterColor: '#06B6D4',
                reported: '张某',
                reportedAvatar: '张',
                reportedColor: '#FF6B35',
                type: '虚假信息',
                orderId: 'KM20240312007',
                time: '2024-03-12 11:20',
                status: 'pending',
                content: '招工信息中的工资待遇与实际严重不符， advertised 280-350元/天，实际只有180元/天，且工作内容与描述完全不同。',
                photos: 3
            },
            {
                id: 'RP20240312008',
                reporter: '吴志强',
                reporterAvatar: '吴',
                reporterColor: '#64748B',
                reported: '格力电器制造',
                reportedAvatar: '格',
                reportedColor: '#10B981',
                type: '纠纷',
                orderId: 'KM20240312008',
                time: '2024-03-12 09:45',
                status: 'processing',
                content: '结算时被扣除了所谓的"管理费"50元，但此前并未告知有此项费用。要求退还被扣除的费用。',
                photos: 1
            }
        ];

        const statusMap = {
            pending: { text: '待处理', class: 'warning' },
            processing: { text: '处理中', class: 'info' },
            processed: { text: '已处理', class: 'success' },
            rejected: { text: '已驳回', class: 'danger' }
        };

        const typeTagMap = {
            '违规': 'tag-type-violation',
            '纠纷': 'tag-type-dispute',
            '虚假信息': 'tag-type-fake'
        };

        function renderTable() {
            const tbody = document.getElementById('reportTableBody');
            tbody.innerHTML = reportsData.map(r => {
                const s = statusMap[r.status];
                const typeTag = typeTagMap[r.type] || 'tag';
                return `
                    <tr>
                        <td style="font-family:monospace; color:var(--primary);">${r.id}</td>
                        <td>
                            <div style="display:flex;align-items:center;gap:8px;">
                                <span class="mini-avatar" style="background:linear-gradient(135deg, ${r.reporterColor}, ${r.reporterColor}cc); width:28px; height:28px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:#fff;">${r.reporterAvatar}</span>
                                <span>${r.reporter}</span>
                            </div>
                        </td>
                        <td>
                            <div style="display:flex;align-items:center;gap:8px;">
                                <span class="mini-avatar" style="background:linear-gradient(135deg, ${r.reportedColor}, ${r.reportedColor}cc); width:28px; height:28px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:#fff;">${r.reportedAvatar}</span>
                                <span>${r.reported}</span>
                            </div>
                        </td>
                        <td><span class="tag ${typeTag}">${r.type}</span></td>
                        <td style="font-family:monospace;">${r.orderId}</td>
                        <td>${r.time}</td>
                        <td><span class="status-badge ${s.class}">${s.text}</span></td>
                        <td>
                            <div style="display:flex;gap:6px;">
                                <a class="card-action" onclick="showDetail('${r.id}')">查看</a>
                                <a class="card-action" onclick="showAction('${r.id}')">处理</a>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function showDetail(id) {
            const r = reportsData.find(x => x.id === id);
            if (!r) return;
            const s = statusMap[r.status];
            const typeTag = typeTagMap[r.type] || 'tag';

            const photosHTML = r.photos > 0
                ? Array.from({length: r.photos}, (_, i) =>
                    `<div class="evidence-thumb" onclick="alert('查看大图')"><i class="fas fa-image"></i></div>`
                ).join('')
                : '<span style="color:var(--text-muted); font-size:13px;">暂无证据图片</span>';

            document.getElementById('detailModalBody').innerHTML = `
                <div class="detail-section">
                    <div class="detail-section-title"><i class="fas fa-info-circle" style="color:var(--primary);"></i> 基本信息</div>
                    <div class="detail-info-grid">
                        <div class="detail-info-item">
                            <span class="detail-info-label">举报ID：</span>
                            <span class="detail-info-value" style="font-family:monospace; color:var(--primary);">${r.id}</span>
                        </div>
                        <div class="detail-info-item">
                            <span class="detail-info-label">举报类型：</span>
                            <span class="tag ${typeTag}">${r.type}</span>
                        </div>
                        <div class="detail-info-item">
                            <span class="detail-info-label">举报人：</span>
                            <span class="detail-info-value">${r.reporter}</span>
                        </div>
                        <div class="detail-info-item">
                            <span class="detail-info-label">被举报人：</span>
                            <span class="detail-info-value">${r.reported}</span>
                        </div>
                        <div class="detail-info-item">
                            <span class="detail-info-label">关联订单：</span>
                            <span class="detail-info-value" style="font-family:monospace;">${r.orderId}</span>
                        </div>
                        <div class="detail-info-item">
                            <span class="detail-info-label">举报时间：</span>
                            <span class="detail-info-value">${r.time}</span>
                        </div>
                        <div class="detail-info-item">
                            <span class="detail-info-label">处理状态：</span>
                            <span class="status-badge ${s.class}">${s.text}</span>
                        </div>
                    </div>
                </div>
                <div class="detail-section">
                    <div class="detail-section-title"><i class="fas fa-comment-alt" style="color:var(--primary);"></i> 举报内容</div>
                    <div class="report-content-box">${r.content}</div>
                </div>
                <div class="detail-section">
                    <div class="detail-section-title"><i class="fas fa-photo-video" style="color:var(--primary);"></i> 证据材料 <span style="font-weight:normal;color:var(--text-muted);font-size:12px;">（${r.photos}张）</span></div>
                    <div class="evidence-photos">${photosHTML}</div>
                </div>
            `;

            document.getElementById('detailModalFooter').innerHTML = `
                <button class="btn btn-outline" onclick="closeModal('detailModal')">关闭</button>
                <button class="btn btn-primary" onclick="closeModal('detailModal'); showAction('${r.id}')">继续处理</button>
            `;

            document.getElementById('detailModal').style.display = 'flex';
        }

        function showAction(id) {
            document.getElementById('actionModal').style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function submitAction() {
            alert('操作已提交成功！');
            closeModal('actionModal');
        }

        function applyFilter() {
            alert('筛选条件已应用');
        }

        function resetFilter() {
            document.querySelectorAll('.filter-item select, .filter-item input').forEach(el => {
                if (el.tagName === 'SELECT') el.selectedIndex = 0;
                else el.value = '';
            });
        }

        renderTable();
    </script>
</body>
</html>
