<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快马日结 - 规则管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
    <style>
        .rule-tabs {
            display: flex;
            gap: 4px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .rule-tab {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .rule-tab:hover { color: var(--primary); }
        .rule-tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .rule-tab .tab-icon {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #fff;
        }
        .rule-tab .count-badge {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 11px;
            background: var(--bg-page);
            color: var(--text-muted);
            margin-left: 4px;
        }
        .rule-tab.active .count-badge {
            background: var(--primary-light);
            color: var(--primary);
        }
        .rule-tab-content { display: none; }
        .rule-tab-content.active { display: block; }

        .category-icon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #fff;
        }
        .cat-notice { background: linear-gradient(135deg, #3B82F6, #2563EB); }
        .cat-credit { background: linear-gradient(135deg, #10B981, #059669); }
        .cat-fee { background: linear-gradient(135deg, #F59E0B, #D97706); }
        .cat-trade { background: linear-gradient(135deg, #8B5CF6, #6D28D9); }
        .cat-private { background: linear-gradient(135deg, #EF4444, #DC2626); }

        .rule-name {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .rule-name-text {
            font-weight: 500;
            font-size: 14px;
            color: var(--text-primary);
        }
        .rule-name-meta {
            font-size: 12px;
            color: var(--text-muted);
            font-family: monospace;
        }
        .rule-version {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 500;
        }
        .version-draft { background: #FEF3C7; color: #D97706; }
        .version-published { background: #ECFDF5; color: #059669; }
        .version-archived { background: #F3F4F6; color: #6B7280; }

        .action-btns {
            display: flex;
            gap: 6px;
        }
        .action-btns .btn { padding: 4px 10px; font-size: 12px; }

        .quick-stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .quick-stat {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--border);
            transition: all 0.2s;
            cursor: pointer;
        }
        .quick-stat:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(255,107,53,0.1);
        }
        .quick-stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
        }
        .quick-stat-info .value {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.2;
        }
        .quick-stat-info .label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #fff;
            border-radius: 12px;
            width: 500px;
            max-width: calc(100% - 32px);
            max-height: 80vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 { margin: 0; font-size: 16px; }
        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }
        .modal-footer {
            padding: 14px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .preview-content {
            background: var(--bg-page);
            border-radius: 8px;
            padding: 16px;
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-secondary);
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .preview-meta {
            display: flex;
            gap: 16px;
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--text-muted);
        }
    </style>
</head>
<body class="admin-layout">
    <div class="admin-sidebar"></div>
    <div class="admin-main">
        <div class="admin-topbar"></div>
        <div class="admin-content">
                <div class="page-header">
                    <h1 class="page-title">规则管理</h1>
                    <p class="page-desc">平台规则公示、信用分、收费、交易、飞单管理规则</p>
                </div>

                <div class="rule-tabs">
                    <div class="rule-tab active" data-tab="notice" onclick="switchTab('notice')">
                        <span class="tab-icon cat-notice"><i class="fas fa-bullhorn"></i></span>
                        规则公示 <span class="count-badge">8</span>
                    </div>
                    <div class="rule-tab" data-tab="credit" onclick="switchTab('credit')">
                        <span class="tab-icon cat-credit"><i class="fas fa-star"></i></span>
                        信用分规则 <span class="count-badge">6</span>
                    </div>
                    <div class="rule-tab" data-tab="fee" onclick="switchTab('fee')">
                        <span class="tab-icon cat-fee"><i class="fas fa-coins"></i></span>
                        收费规则 <span class="count-badge">5</span>
                    </div>
                    <div class="rule-tab" data-tab="trade" onclick="switchTab('trade')">
                        <span class="tab-icon cat-trade"><i class="fas fa-exchange-alt"></i></span>
                        交易规则 <span class="count-badge">7</span>
                    </div>
                    <div class="rule-tab" data-tab="private" onclick="switchTab('private')">
                        <span class="tab-icon cat-private"><i class="fas fa-ban"></i></span>
                        飞单认定与处理 <span class="count-badge">4</span>
                    </div>
                </div>

                <div class="card">
                    <div class="filter-bar">
                        <div class="filter-item">
                            <span>状态</span>
                            <select id="statusFilter">
                                <option value="">全部</option>
                                <option value="published">已发布</option>
                                <option value="draft">草稿</option>
                                <option value="archived">已归档</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <div class="search-box" style="width:200px;">
                                <i class="fas fa-search"></i>
                                <input type="text" id="keywordSearch" placeholder="规则名称搜索" style="width:200px; padding:7px 12px 7px 36px;">
                            </div>
                        </div>
                        <button class="btn btn-primary btn-sm" onclick="filterRules()"><i class="fas fa-search"></i> 查询</button>
                        <button class="btn btn-outline btn-sm" onclick="resetFilter()"><i class="fas fa-rotate-left"></i> 重置</button>
                        <div style="flex:1;"></div>
                        <button class="btn btn-primary btn-sm" onclick="addRule()"><i class="fas fa-plus"></i> 新增规则</button>
                    </div>

                    <div id="ruleListContainer"></div>
                </div>
            </div>
        </div>

    <div class="modal-overlay" id="viewModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3><i class="fas fa-eye" style="color:var(--primary);"></i> 规则详情</h3>
                <button class="modal-close" onclick="closeView()" style="background:none;border:none;font-size:18px;color:var(--text-muted);cursor:pointer;"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="viewModalBody"></div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeView()">关闭</button>
                <button class="btn btn-primary" onclick="editFromView()"><i class="fas fa-edit"></i> 编辑</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="deleteModal">
        <div class="modal-box" style="width:400px;">
            <div class="modal-header">
                <h3 style="color:var(--danger);"><i class="fas fa-exclamation-triangle"></i> 确认删除</h3>
            </div>
            <div class="modal-body">
                <p id="deleteMessage" style="font-size:14px; line-height:1.6; color:var(--text-primary);"></p>
                <p style="font-size:12px; color:var(--text-muted); margin-top:10px;">删除后不可恢复，请谨慎操作。</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeDelete()">取消</button>
                <button class="btn btn-danger" onclick="confirmDelete()">确认删除</button>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
    <script>
        initPageLayout();

        let currentTab = 'notice';
        let currentViewRule = null;
        let pendingDeleteId = null;

        const ruleData = {
            notice: [
                { id: 'R001', name: '平台服务协议', category: '规则公示', version: 'v3.2', status: 'published', updateTime: '2024-08-01 10:30', content: '本协议是快马日结平台与所有用户（包括零工和雇主）之间达成的服务协议。\n\n一、服务内容\n本平台为零工提供招工信息发布、在线报名、订单管理、工资结算等服务；为雇主提供招工发布、零工筛选、订单确认等服务。\n\n二、账号规则\n1. 所有用户需完成实名认证后方可使用平台功能\n2. 禁止将账号转借他人使用\n3. 用户应对账号下的一切行为负责\n\n三、订单规则\n1. 雇主发布招工信息需真实准确\n2. 零工报名后不得随意取消\n3. 双方确认订单后需按约履行\n\n四、结算规则\n1. 订单完成后T+3工作日结算\n2. 如遇节假日结算顺延\n3. 结算金额以实际工时为准\n\n五、争议处理\n1. 双方协商解决\n2. 平台介入调解\n3. 保留相关凭证可申诉' },
                { id: 'R002', name: '隐私政策', category: '规则公示', version: 'v2.5', status: 'published', updateTime: '2024-07-15 14:20', content: '快马日结平台重视用户隐私保护。本隐私政策说明我们如何收集、使用、存储和保护您的个人信息。\n\n一、信息收集\n1. 注册信息：姓名、手机号、身份证号\n2. 使用信息：定位、设备信息、操作日志\n3. 交易信息：订单记录、结算信息\n\n二、信息使用\n1. 提供服务和优化产品\n2. 进行身份验证和风控\n3. 改进用户体验\n\n三、信息保护\n1. 采用加密传输和存储\n2. 严格的数据访问权限\n3. 定期安全审计' },
                { id: 'R003', name: '用户行为规范', category: '规则公示', version: 'v2.1', status: 'published', updateTime: '2024-06-20 09:15', content: '所有快马日结平台用户需遵守以下行为规范：\n\n一、真实身份\n- 必须使用真实身份信息注册\n- 不得冒用他人账号\n\n二、文明沟通\n- 禁止发布违法违规内容\n- 禁止骚扰、辱骂他人\n- 保护平台正常交流环境\n\n三、诚信交易\n- 不得发布虚假招工信息\n- 不得恶意取消订单\n- 按时完成工作和结算\n\n四、违规处罚\n- 警告、限制功能\n- 封号、列入黑名单\n- 追究法律责任' },
                { id: 'R004', name: '零工报名规则', category: '规则公示', version: 'v1.8', status: 'published', updateTime: '2024-05-10 16:40', content: '零工报名需遵守以下规则：\n\n1. 报名前需完成实名认证\n2. 仔细阅读招工信息，确认自身符合要求\n3. 报名后如无法参加，需提前24小时取消\n4. 无故爽约将扣除信用分\n5. 多次爽约将被限制报名权限' },
                { id: 'R005', name: '雇主发布招工规则', category: '规则公示', version: 'v1.5', status: 'published', updateTime: '2024-04-22 11:00', content: '雇主发布招工信息需遵守：\n\n1. 企业需完成认证\n2. 招工信息需真实准确\n3. 明确标注工资标准、工作时间、工作地点\n4. 不得发布违法违规招工信息\n5. 按时确认订单和结算工资' },
                { id: 'R006', name: '结算规则说明', category: '规则公示', version: 'v2.0', status: 'published', updateTime: '2024-03-18 15:30', content: '工资结算规则：\n\n1. 订单完成并经雇主确认后结算\n2. 结算周期：T+3工作日\n3. 结算方式：银行转账\n4. 最低结算金额：10元\n5. 如遇节假日结算顺延\n6. 对结算金额有异议可在7天内申诉' },
                { id: 'R007', name: '投诉与申诉流程', category: '规则公示', version: 'v1.3', status: 'draft', updateTime: '2024-08-10 08:45', content: '投诉与申诉流程：\n\n1. 提交投诉/申诉\n- 在订单详情页点击投诉\n- 选择投诉类型\n- 上传相关凭证\n\n2. 平台审核\n- 客服在24小时内受理\n- 核实相关证据\n- 给出处理结果\n\n3. 结果执行\n- 退款/补偿\n- 警告/处罚\n- 支持再次申诉' },
                { id: 'R008', name: '平台免责声明', category: '规则公示', version: 'v1.0', status: 'archived', updateTime: '2024-02-01 10:00', content: '平台免责声明内容...' }
            ],
            credit: [
                { id: 'C001', name: '信用分总则', category: '信用分规则', version: 'v2.0', status: 'published', updateTime: '2024-08-05 10:00', content: '信用分总则\n\n一、目的\n建立诚信交易环境，保障双方权益\n\n二、评分标准\n基础分：100分，根据行为加减分\n\n三、等级划分\n优秀：95分以上\n良好：85-94分\n普通：70-84分\n较差：60-69分\n不良：60分以下\n\n四、影响范围\n信用分影响报名权限、接单优先级、费率等' },
                { id: 'C002', name: '零工信用分规则', category: '信用分规则', version: 'v1.8', status: 'published', updateTime: '2024-07-20 14:30', content: '零工信用分加减分项：\n\n加分项：\n1. 完成订单 +2分/单\n2. 获得雇主好评 +1分/次\n3. 连续完成10单 +5分\n\n减分项：\n1. 无故爽约 -5分/次\n2. 被雇主投诉 -3分/次\n3. 迟到/早退 -2分/次\n4. 服务态度差 -2分/次\n5. 信用分低于60分将被限制' },
                { id: 'C003', name: '雇主信用分规则', category: '信用分规则', version: 'v1.6', status: 'published', updateTime: '2024-06-15 09:20', content: '雇主信用分加减分项：\n\n加分项：\n1. 按时结算 +3分/次\n2. 获得零工好评 +1分/次\n\n减分项：\n1. 超时结算 -5分/次\n2. 拖欠工资 -10分/次\n3. 虚假招工 -10分/次\n4. 被投诉 -3分/次\n5. 信用分低将被限制招工权限' },
                { id: 'C004', name: '信用分恢复机制', category: '信用分规则', version: 'v1.2', status: 'published', updateTime: '2024-05-08 16:00', content: '信用分恢复方式：\n\n1. 自然恢复：每月恢复2分（无违规）\n2. 活跃恢复：每月完成5单以上恢复3分\n3. 好评恢复：获得雇主好评额外恢复\n4. 恢复上限：每月最多恢复5分' },
                { id: 'C005', name: '信用分等级权益', category: '信用分规则', version: 'v1.0', status: 'draft', updateTime: '2024-08-12 11:15', content: '不同信用分等级享受不同权益：\n\n优秀(95+)：优先接单、低费率、专属客服\n良好(85-94)：正常接单、标准费率\n普通(70-84)：限制接单数量、较高费率\n较差(60-69)：需提升信用后恢复\n不良(60-)：冻结账号' },
                { id: 'C006', name: '信用分申诉机制', category: '信用分规则', version: 'v1.0', status: 'archived', updateTime: '2024-03-10 09:00', content: '信用分申诉流程...' }
            ],
            fee: [
                { id: 'F001', name: '平台服务费规则', category: '收费规则', version: 'v2.2', status: 'published', updateTime: '2024-08-01 09:00', content: '平台服务费标准：\n\n一、费率标准\n零工端：不收取任何服务费\n雇主端：按订单金额的5%收取\n\n二、费率调整\n信用分优秀的雇主可享受3%优惠\n新注册雇主前3个月费率为3%\n\n三、最低收费\n单笔订单最低服务费1元\n\n四、结算时间\n服务费在工资结算时自动扣除' },
                { id: 'F002', name: '提现手续费规则', category: '收费规则', version: 'v1.5', status: 'published', updateTime: '2024-07-10 14:00', content: '提现手续费标准：\n\n1. 每月前3次提现免手续费\n2. 第4次及以后按0.5%收取\n3. 单笔最低手续费0.1元\n4. 单笔最高手续费5元\n5. 提现到账时间：T+1工作日' },
                { id: 'F003', name: '认证费用规则', category: '收费规则', version: 'v1.0', status: 'published', updateTime: '2024-06-01 10:00', content: '认证费用：\n\n1. 零工实名认证：免费\n2. 雇主企业认证：免费\n3. 加急认证：50元/次\n4. 重新认证：免费（限3次）' },
                { id: 'F004', name: '增值服务收费', category: '收费规则', version: 'v1.2', status: 'published', updateTime: '2024-05-15 11:00', content: '增值服务：\n\n1. 招工置顶：10元/天\n2. 定向推送：20元/次\n3. 数据分析报告：50元/月\n4. 专属客服：100元/月' },
                { id: 'F005', name: '退款规则', category: '收费规则', version: 'v1.0', status: 'draft', updateTime: '2024-08-15 16:30', content: '退款规则：\n\n1. 未完成的订单可申请退款\n2. 已完成订单不支持退款\n3. 服务费退还需审核\n4. 退款到账时间：T+7工作日' }
            ],
            trade: [
                { id: 'T001', name: '订单发布规则', category: '交易规则', version: 'v2.0', status: 'published', updateTime: '2024-08-08 10:00', content: '订单发布规则：\n\n1. 雇主需完成企业认证\n2. 招工信息需包含：工种、人数、工资、时间、地点\n3. 发布后需经平台审核（2小时内）\n4. 审核通过后对外展示\n5. 有效期最长30天' },

                { id: 'P003', name: '飞单处罚规则', category: '飞单认定与处理规则', version: 'v1.6', status: 'published', updateTime: '2024-08-05 11:00', content: '飞单处罚标准：\n\n零工端：\n1. 首次违规：警告+扣10信用分\n2. 二次违规：扣20信用分+冻结7天\n3. 三次违规：永久封号\n\n雇主端：\n1. 首次违规：警告+扣10信用分\n2. 二次违规：扣20信用分+冻结14天\n3. 三次违规：永久封号+列入黑名单\n\n赔偿：\n- 飞单金额的20%作为违约金\n- 赔偿平台服务费损失\n- 赔偿对方损失' },

            ]
        };

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.rule-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            renderList();
        }

        function renderList() {
            const statusFilter = document.getElementById('statusFilter').value;
            const keyword = document.getElementById('keywordSearch').value.trim().toLowerCase();
            const list = ruleData[currentTab] || [];

            let filtered = list;
            if (statusFilter) filtered = filtered.filter(r => r.status === statusFilter);
            if (keyword) filtered = filtered.filter(r => r.name.toLowerCase().includes(keyword) || r.id.toLowerCase().includes(keyword));

            const container = document.getElementById('ruleListContainer');
            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);">暂无数据</div>`;
                return;
            }

            const typeMeta = getTypeMeta(currentTab);

            container.innerHTML = `
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>规则ID</th>
                                <th>规则名称</th>
                                <th>分类</th>
                                <th>版本</th>
                                <th>状态</th>
                                <th>更新时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${filtered.map(r => `
                                <tr>
                                    <td style="font-family:monospace; color:var(--primary); font-size:12px;">${r.id}</td>
                                    <td>
                                        <div class="rule-name">
                                            <span class="category-icon ${typeMeta.iconClass}"><i class="fas ${typeMeta.icon}"></i></span>
                                            <span class="rule-name-text">${r.name}</span>
                                        </div>
                                    </td>
                                    <td>${r.category}</td>
                                    <td><span style="font-family:monospace; color:var(--text-secondary); font-size:12px;">${r.version}</span></td>
                                    <td>${getStatusLabel(r.status)}</td>
                                    <td style="font-size:13px;">${r.updateTime}</td>
                                    <td>
                                        <div class="action-btns">
                                            <button class="btn btn-outline btn-sm" onclick="viewRule('${r.id}')"><i class="fas fa-eye"></i> 查看</button>
                                            <button class="btn btn-outline btn-sm" onclick="editRule('${r.id}')"><i class="fas fa-edit"></i> 编辑</button>
                                            ${r.status === 'published' 
                                                ? `<button class="btn btn-outline btn-sm" style="color:var(--warning);" onclick="toggleStatus('${r.id}','draft')"><i class="fas fa-eye-slash"></i> 下线</button>`
                                                : r.status === 'draft'
                                                ? `<button class="btn btn-outline btn-sm" style="color:var(--success);" onclick="toggleStatus('${r.id}','published')"><i class="fas fa-arrow-up"></i> 发布</button>`
                                                : `<button class="btn btn-outline btn-sm" style="color:var(--primary);" onclick="toggleStatus('${r.id}','published')"><i class="fas fa-rotate-right"></i> 恢复</button>`
                                            }
                                            <button class="btn btn-danger btn-sm" onclick="deleteRule('${r.id}')"><i class="fas fa-trash"></i> 删除</button>
                                        </div>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function getTypeMeta(tab) {
            const map = {
                notice: { icon: 'fa-bullhorn', iconClass: 'cat-notice' },
                credit: { icon: 'fa-star', iconClass: 'cat-credit' },
                fee: { icon: 'fa-coins', iconClass: 'cat-fee' },
                trade: { icon: 'fa-exchange-alt', iconClass: 'cat-trade' },
                private: { icon: 'fa-ban', iconClass: 'cat-private' }
            };
            return map[tab] || map.notice;
        }

        function getStatusLabel(status) {
            const map = {
                published: '<span class="status-badge success">已发布</span>',
                draft: '<span class="status-badge warning">草稿</span>',
                archived: '<span class="status-badge default">已归档</span>'
            };
            return map[status] || map.draft;
        }

        function filterRules() { renderList(); }
        function resetFilter() {
            document.getElementById('statusFilter').value = '';
            document.getElementById('keywordSearch').value = '';
            renderList();
        }

        function viewRule(id) {
            const list = ruleData[currentTab];
            const rule = list.find(r => r.id === id);
            if (!rule) return;
            currentViewRule = rule;
            const typeMeta = getTypeMeta(currentTab);

            document.getElementById('viewModalBody').innerHTML = `
                <div class="preview-meta">
                    <span><i class="fas fa-tag" style="color:var(--primary);"></i> ${rule.category}</span>
                    <span><i class="fas fa-code-branch" style="color:var(--primary);"></i> ${rule.version}</span>
                    <span><i class="fas fa-clock"></i> ${rule.updateTime}</span>
                    ${getStatusLabel(rule.status)}
                </div>
                <div class="preview-content">${rule.content}</div>
            `;
            document.getElementById('viewModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeView() {
            document.getElementById('viewModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        function editFromView() {
            if (currentViewRule) {
                window.location.href = `rules-edit.html?tab=${currentTab}&id=${currentViewRule.id}`;
            }
        }

        function editRule(id) {
            window.location.href = `rules-edit.html?tab=${currentTab}&id=${id}`;
        }

        function addRule() {
            window.location.href = `rules-edit.html?tab=${currentTab}`;
        }

        function toggleStatus(id, targetStatus) {
            const list = ruleData[currentTab];
            const rule = list.find(r => r.id === id);
            if (!rule) return;

            const action = targetStatus === 'published' ? '发布' : targetStatus === 'draft' ? '下线' : '恢复';
            if (!confirm(`确定要${action}规则「${rule.name}」吗？`)) return;

            rule.status = targetStatus;
            rule.updateTime = new Date().toLocaleString('zh-CN');
            renderList();
        }

        function deleteRule(id) {
            const list = ruleData[currentTab];
            const rule = list.find(r => r.id === id);
            if (!rule) return;
            pendingDeleteId = id;
            document.getElementById('deleteMessage').textContent = `确定要删除规则「${rule.name}」吗？`;
            document.getElementById('deleteModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeDelete() {
            document.getElementById('deleteModal').classList.remove('active');
            document.body.style.overflow = '';
            pendingDeleteId = null;
        }

        function confirmDelete() {
            if (!pendingDeleteId) return;
            const list = ruleData[currentTab];
            const idx = list.findIndex(r => r.id === pendingDeleteId);
            if (idx > -1) {
                list.splice(idx, 1);
            }
            closeDelete();
            renderList();
        }

        renderList();
    </script>
</body>
</html>
