<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>确认付款 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame { width: 390px; height: 844px; background: #f5f5f5; overflow: hidden; position: relative; border-radius: 44px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a; }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }
        .nav-bar { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #fff; }
        .nav-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #333; cursor: pointer; }
        .nav-title { font-size: 17px; font-weight: 600; color: #333; }
        .nav-right { width: 32px; }
        
        .content-area { position: absolute; top: 97px; left: 0; right: 0; bottom: 0; overflow-y: auto; padding-bottom: 20px; }
        
        /* 付款金额卡片 */
        .amount-card {
            background: linear-gradient(135deg, #FFE4B5 0%, #FFD700 100%);
            margin: 12px 16px; border-radius: 16px; padding: 20px; text-align: center;
        }
        .amount-label { font-size: 13px; color: #666; }
        .amount-value { font-size: 36px; font-weight: 700; margin-top: 8px; color: #333; }
        .amount-desc { font-size: 12px; color: #888; margin-top: 6px; }
        
        /* 付款账号 */
        .section-card { background: white; margin: 12px 16px; border-radius: 16px; padding: 16px; }
        .section-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 14px; }
        
        .account-type-list { display: flex; flex-direction: column; gap: 10px; }
        .account-type-item {
            display: flex; align-items: center; padding: 14px;
            border: 1.5px solid #eee; border-radius: 12px; cursor: pointer;
            transition: all 0.2s;
        }
        .account-type-item.active { border-color: #FF6B35; background: #FFF8F5; }
        .account-type-icon {
            width: 44px; height: 44px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; margin-right: 12px; flex-shrink: 0;
        }
        .account-type-item .account-type-icon.wechat { background: #E8F8E8; color: #09BB07; }
        .account-type-item .account-type-icon.alipay { background: #E6F0FF; color: #1677FF; }
        .account-type-item .account-type-icon.bank { background: #FFF5E6; color: #FF8C00; }
        .account-type-info { flex: 1; }
        .account-type-name { font-size: 15px; font-weight: 500; color: #333; }
        .account-type-desc { font-size: 12px; color: #999; margin-top: 2px; }
        .account-type-check {
            width: 20px; height: 20px; border-radius: 50%;
            border: 2px solid #ddd; display: flex; align-items: center;
            justify-content: center; flex-shrink: 0;
        }
        .account-type-item.active .account-type-check {
            border-color: #FF6B35; background: #FF6B35;
        }
        .account-type-item.active .account-type-check::after {
            content: ''; width: 8px; height: 8px; background: white; border-radius: 50%;
        }
        
        /* 表单 */
        .form-item { margin-bottom: 16px; }
        .form-label { font-size: 13px; color: #666; margin-bottom: 8px; display: block; }
        .form-label .required { color: #FF4D4F; margin-left: 2px; }
        .form-input {
            width: 100%; height: 44px; border: 1px solid #e0e0e0; border-radius: 10px;
            padding: 0 14px; font-size: 14px; color: #333; background: #FAFAFA;
            box-sizing: border-box; outline: none; transition: border-color 0.2s;
        }
        .form-input:focus { border-color: #FF6B35; background: white; }
        .form-input::placeholder { color: #bbb; }
        
        /* 银行选择器 */
        .bank-select {
            width: 100%; height: 44px; border: 1px solid #e0e0e0; border-radius: 10px;
            padding: 0 14px; font-size: 14px; color: #333; background: #FAFAFA;
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer;
        }
        .bank-select.placeholder { color: #bbb; }
        .bank-select i.chevron { font-size: 12px; color: #999; }
        
        /* 银行弹窗 */
        .bank-modal {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 200;
            display: none; align-items: flex-end;
        }
        .bank-modal.show { display: flex; }
        .bank-modal-content {
            background: white; width: 100%; border-radius: 20px 20px 0 0;
            max-height: 70%; display: flex; flex-direction: column;
        }
        .bank-modal-header {
            padding: 16px; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid #f0f0f0;
        }
        .bank-modal-title { font-size: 16px; font-weight: 600; color: #333; }
        .bank-modal-close { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #999; }
        .bank-search { padding: 12px 16px; border-bottom: 1px solid #f5f5f5; }
        .bank-search-input {
            width: 100%; height: 36px; background: #F5F5F5; border-radius: 18px;
            padding: 0 16px; font-size: 14px; outline: none; border: none;
        }
        .bank-list { flex: 1; overflow-y: auto; }
        .bank-item { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid #f5f5f5; cursor: pointer; }
        .bank-item:last-child { border-bottom: none; }
        .bank-item-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: white; margin-right: 12px; }
        .bank-item-info { flex: 1; }
        .bank-item-name { font-size: 14px; color: #333; }
        .bank-item-selected { color: #FF6B35; font-weight: 500; }
        
        /* 提示 */
        .tip-box {
            background: #FFF8F5; border-radius: 10px; padding: 12px;
            margin-top: 16px; display: flex; gap: 8px;
        }
        .tip-icon { color: #FF6B35; font-size: 14px; flex-shrink: 0; margin-top: 1px; }
        .tip-text { font-size: 12px; color: #999; line-height: 1.6; }
        
        /* 订单摘要 */
        .order-summary { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .summary-tag {
            background: #FFF8F5; color: #FF6B35; font-size: 12px;
            padding: 4px 10px; border-radius: 10px;
        }
        
        /* 底部按钮 */
        .bottom-bar {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: #fff; border-top: 1px solid #f0f0f0;
            padding: 12px 16px;
        }
        .confirm-btn {
            width: 100%; height: 48px; background: linear-gradient(135deg, #FF6B35, #FF8C5A);
            color: white; border: none; border-radius: 24px;
            font-size: 16px; font-weight: 600; cursor: pointer;
        }
        .confirm-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* 成功弹窗 */
        .success-modal {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 300;
            display: none; justify-content: center; align-items: center;
        }
        .success-modal.show { display: flex; }
        .success-content { background: white; border-radius: 20px; padding: 30px 24px; width: 280px; text-align: center; }
        .success-icon { width: 64px; height: 64px; background: #E8F8E8; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
        .success-icon i { font-size: 32px; color: #52C41A; }
        .success-title { font-size: 18px; font-weight: 600; color: #333; }
        .success-desc { font-size: 14px; color: #666; margin-top: 8px; line-height: 1.5; }
        .success-btn { background: linear-gradient(135deg, #FF6B35, #FF8C5A); color: white; padding: 12px 40px; border-radius: 20px; font-size: 15px; font-weight: 600; cursor: pointer; border: none; margin-top: 24px; }
        
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
    </style>

            <!-- 服务费收款账户 -->

            <!-- 付款账号 -->

    <script>
        var bankList = [
            { name: '中国工商银行', color: '#C7000B', short: 'ICBC' },
            { name: '中国建设银行', color: '#0066B3', short: 'CCB' },
            { name: '中国农业银行', color: '#009966', short: 'ABC' },
            { name: '中国银行', color: '#C7000B', short: 'BOC' },
            { name: '交通银行', color: '#003366', short: 'BCM' },
            { name: '招商银行', color: '#CC0000', short: 'CMB' },
            { name: '中国邮政储蓄银行', color: '#006B3C', short: 'PSBC' },
            { name: '兴业银行', color: '#006699', short: 'CIB' },
            { name: '浦发银行', color: '#003366', short: 'SPDB' },
            { name: '中信银行', color: '#E60012', short: 'CITIC' },
            { name: '光大银行', color: '#5B2C8C', short: 'CEB' },
            { name: '民生银行', color: '#0052A5', short: 'CMBC' },
            { name: '平安银行', color: '#00447C', short: 'PAB' },
            { name: '华夏银行', color: '#D60E1F', short: 'HXB' },
            { name: '广发银行', color: '#005EB8', short: 'CGB' },
            { name: '北京银行', color: '#C8161D', short: 'BOB' },
            { name: '上海银行', color: '#004098', short: 'BOS' },
            { name: '宁波银行', color: '#006699', short: 'NB' },
            { name: '江苏银行', color: '#006A8E', short: 'JSB' },
            { name: '南京银行', color: '#7B1FA2', short: 'NJB' }
        ];

        var selectedAccountType = null;
        var selectedBank = null;
        var settleData = { amount: 0, count: 0, orderIds: [] };

        function init() {
            var params = new URLSearchParams(window.location.search);
            settleData.amount = parseFloat(params.get('amount') || '0');
            settleData.count = parseInt(params.get('count') || '0');
            settleData.orderIds = (params.get('ids') || '').split(',').filter(function(id) { return id; });

            var serviceFee = settleData.amount * 0.1;
            var finalAmount = settleData.amount + serviceFee;

            document.getElementById('settle-amount').textContent = '¥' + finalAmount.toFixed(2);
            document.getElementById('settle-desc').textContent = '共' + settleData.count + '笔订单 · 待付款';

            // 费用明细
            document.getElementById('detail-order-amount').textContent = '¥' + settleData.amount.toFixed(2);
            document.getElementById('detail-service-fee').textContent = '¥' + serviceFee.toFixed(2);
            document.getElementById('detail-final-amount').textContent = '¥' + finalAmount.toFixed(2);

            // 渲染订单标签
            var summary = document.getElementById('order-summary');
            var tags = '';
            for (var i = 0; i < Math.min(settleData.count, 5); i++) {
                tags += '<span class="summary-tag">订单' + (i + 1) + '</span>';
            }
            if (settleData.count > 5) {
                tags += '<span class="summary-tag">等' + settleData.count + '笔</span>';
            }
            summary.innerHTML = tags;

            // 更新实际支付金额
            settleData.finalAmount = finalAmount;
        }

        function selectAccountType(type) {
            selectedAccountType = type;
            document.querySelectorAll('.account-type-item').forEach(function(item) {
                item.classList.toggle('active', item.dataset.type === type);
            });
            var accountForm = document.getElementById('account-form');
            accountForm.style.display = 'block';
            document.getElementById('wechat-form').style.display = type === 'wechat' ? 'block' : 'none';
            document.getElementById('alipay-form').style.display = type === 'alipay' ? 'block' : 'none';
            document.getElementById('bank-form').style.display = type === 'bank' ? 'block' : 'none';
            updateConfirmBtn();
        }

        function openBankModal() { renderBankList(''); document.getElementById('bank-modal').classList.add('show'); }
        function closeBankModal(event) {
            if (event && event.target && event.target.id !== 'bank-modal' && event.type === 'click') return;
            document.getElementById('bank-modal').classList.remove('show');
        }
        function renderBankList(keyword) {
            var list = document.getElementById('bank-list');
            var filtered = keyword ? bankList.filter(function(b) {
                return b.name.indexOf(keyword) >= 0 || b.short.toLowerCase().indexOf(keyword.toLowerCase()) >= 0;
            }) : bankList;
            list.innerHTML = filtered.map(function(bank) {
                var isSelected = selectedBank && selectedBank.name === bank.name;
                return '<div class="bank-item" onclick="selectBank(\'' + bank.name + '\')">' +
                    '<div class="bank-item-icon" style="background:' + bank.color + ';">' + bank.short.substring(0, 2) + '</div>' +
                    '<div class="bank-item-info"><div class="bank-item-name' + (isSelected ? ' bank-item-selected' : '') + '">' + bank.name + '</div></div>' +
                    (isSelected ? '<i class="fas fa-check" style="color:#FF6B35;"></i>' : '') +
                '</div>';
            }).join('');
        }
        function filterBanks() { var keyword = document.getElementById('bank-search').value.trim(); renderBankList(keyword); }
        function selectBank(bankName) {
            selectedBank = bankList.find(function(b) { return b.name === bankName; });
            var display = document.getElementById('bank-display');
            display.textContent = bankName;
            display.classList.remove('placeholder');
            document.getElementById('bank-modal').classList.remove('show');
            updateConfirmBtn();
        }

        function updateConfirmBtn() {
            var btn = document.getElementById('confirm-btn');
            if (!selectedAccountType) { btn.disabled = true; btn.textContent = '确认付款'; return; }
            var valid = false;
            if (selectedAccountType === 'wechat') {
                valid = document.getElementById('wechat-account').value.trim() && document.getElementById('wechat-name').value.trim();
            } else if (selectedAccountType === 'alipay') {
                valid = document.getElementById('alipay-account').value.trim() && document.getElementById('alipay-name').value.trim();
            } else if (selectedAccountType === 'bank') {
                var cardNo = document.getElementById('bank-card-no').value.trim();
                var name = document.getElementById('bank-name').value.trim();
                valid = selectedBank && cardNo && name && /^\d{16,19}$/.test(cardNo);
            }
            btn.disabled = !valid;
            btn.textContent = valid ? '确认付款 ¥' + settleData.finalAmount.toFixed(2) : '确认付款';
        }

        function submitSettle() {
            if (!selectedAccountType) return;
            var amount = settleData.finalAmount;
            document.getElementById('success-desc').textContent = '付款金额 ¥' + amount.toFixed(2) + ' 已成功支付';
            document.getElementById('success-modal').classList.add('show');
        }

        function closeSuccessModal() {
            document.getElementById('success-modal').classList.remove('show');
            window.location.href = 'settlement.html';
        }

        function goBack() { window.history.back(); }

        // 初始化
        init();
    </script>
</body>
</html>
