<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置干活地点 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame {
            width: 390px; height: 844px; background: #FFF8E6; overflow: hidden;
            position: relative; border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
        }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: transparent; }
        
        .page-bg { background: #fff; height: calc(100% - 47px); position: relative; display: flex; flex-direction: column; overflow: hidden; }
        
        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: white;
            flex-shrink: 0;
        }
        .nav-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: #333; font-size: 20px; cursor: pointer; }
        .nav-title { font-size: 17px; font-weight: 700; color: #333; }
        .nav-placeholder { width: 32px; }
        
        .map-container {
            position: relative;
            height: 260px;
            background: linear-gradient(180deg, #E8F4FD 0%, #F0EDE4 100%);
            overflow: hidden;
            flex-shrink: 0;
        }
        .map-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(200,200,200,0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(200,200,200,0.3) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .map-road { position: absolute; background: #ddd; border-radius: 4px; }
        .map-road-h { height: 14px; top: 60px; left: 0; right: 0; }
        .map-road-h2 { height: 10px; top: 160px; left: 0; right: 0; }
        .map-road-v { width: 14px; top: 0; bottom: 0; left: 100px; }
        .map-road-v2 { width: 10px; top: 0; bottom: 0; right: 80px; }
        .map-building { position: absolute; border-radius: 4px; }
        .b1 { width: 50px; height: 40px; background: #B8D4E3; top: 80px; left: 30px; }
        .b2 { width: 45px; height: 55px; background: #C5DDB0; top: 180px; left: 40px; }
        .b3 { width: 60px; height: 35px; background: #E8D5B7; top: 90px; right: 40px; }
        .b4 { width: 40px; height: 50px; background: #D4C5DD; top: 180px; right: 100px; }
        .b5 { width: 35px; height: 30px; background: #F5D7B5; top: 25px; left: 180px; }
        .b6 { width: 55px; height: 45px; background: #B8D4E3; top: 30px; right: 20px; }
        
        .map-pin {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -100%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .pin-outer {
            width: 36px; height: 36px;
            background: #FF6B35;
            border: 3px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.4);
        }
        .pin-pulse {
            position: absolute;
            width: 60px; height: 60px;
            background: rgba(255, 107, 53, 0.2);
            border-radius: 50%;
            animation: pulse 2s infinite;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }
        
        .map-controls {
            position: absolute;
            right: 12px;
            bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .map-ctrl-btn {
            width: 36px; height: 36px;
            background: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            color: #333;
            font-size: 14px;
        }
        .locate-btn {
            position: absolute;
            right: 12px;
            top: 12px;
            width: 36px; height: 36px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            color: #FF6B35;
            font-size: 14px;
        }
        
        .search-bar {
            position: absolute;
            left: 12px;
            right: 60px;
            top: 12px;
            height: 36px;
            background: white;
            border-radius: 18px;
            display: flex;
            align-items: center;
            padding: 0 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .search-bar i { color: #999; font-size: 14px; margin-right: 8px; }
        .search-bar input { flex: 1; border: none; outline: none; font-size: 13px; background: transparent; }
        .search-bar input::placeholder { color: #bbb; }
        
        .location-info {
            background: white;
            margin: -16px 12px 12px;
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            position: relative;
            z-index: 20;
        }
        .location-title-row {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }
        .location-title {
            font-size: 15px;
            font-weight: 700;
            color: #333;
            flex: 1;
        }
        .location-tag {
            font-size: 11px;
            color: #FF6B35;
            background: #FFF0E8;
            padding: 2px 8px;
            border-radius: 4px;
            margin-right: 6px;
        }
        .location-distance {
            font-size: 11px;
            color: #999;
        }
        .location-address {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }
        
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px 8px;
        }
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }
        .section-action {
            font-size: 13px;
            color: #FF6B35;
            cursor: pointer;
        }
        
        .address-list { padding: 0 12px; }
        .address-item {
            display: flex;
            align-items: flex-start;
            padding: 12px;
            background: white;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .address-item:hover { background: #FFF8E6; }
        .address-item.selected {
            background: #FFF8E6;
            border: 1px solid #FF6B35;
        }
        .address-icon {
            width: 36px; height: 36px;
            background: #F5F5F5;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FF6B35;
            font-size: 16px;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .address-info { flex: 1; min-width: 0; }
        .address-name {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .address-detail {
            font-size: 12px;
            color: #999;
            line-height: 1.4;
        }
        .address-tags {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .addr-tag {
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 3px;
            background: #F0F0F0;
            color: #666;
        }
        .addr-tag.hot { background: #FF6B35; color: white; }
        
        .add-address-btn {
            margin: 12px;
            height: 44px;
            border: 1.5px dashed #ddd;
            border-radius: 10px;
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 14px;
            color: #999;
            cursor: pointer;
            transition: all 0.2s;
        }
        .add-address-btn:hover { border-color: #FF6B35; color: #FF6B35; background: #FFF8E6; }
        .add-address-btn i { font-size: 14px; }
        
        .scroll-area { padding-bottom: 12px; }
        
        .bottom-bar {
            background: white;
            padding: 12px 16px;
            border-top: 1px solid #f0f0f0;
            flex-shrink: 0;
            padding-bottom: 20px;
        }
        .submit-btn {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, #FF6B35, #FF8C5A);
            color: white;
            border-radius: 9999px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.3);
        }
        .submit-btn:active { transform: scale(0.98); }
        
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; z-index: 10; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>
        <div class="status-bar">
            <span>19:53</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>
        
        <div class="page-bg">
            <div class="nav-bar">
                <div class="nav-back" onclick="closePage()"><i class="fas fa-chevron-left"></i></div>
                <div class="nav-title">设置干活地点</div>
                <div class="nav-placeholder"></div>
            </div>
            
            <div class="map-container">
                <div class="map-bg"></div>
                <div class="map-road map-road-h"></div>
                <div class="map-road map-road-h2"></div>
                <div class="map-road map-road-v"></div>
                <div class="map-road map-road-v2"></div>
                <div class="map-building b1"></div>
                <div class="map-building b2"></div>
                <div class="map-building b3"></div>
                <div class="map-building b4"></div>
                <div class="map-building b5"></div>
                <div class="map-building b6"></div>
                
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="搜索地址或地点">
                </div>
                
                <div class="locate-btn" onclick="locateMe()">
                    <i class="fas fa-crosshairs"></i>
                </div>
                
                <div class="map-pin">
                    <div class="pin-pulse"></div>
                    <div class="pin-outer"><i class="fas fa-map-marker-alt"></i></div>
                </div>
                
                <div class="map-controls">
                    <div class="map-ctrl-btn" onclick="zoomIn()"><i class="fas fa-plus"></i></div>
                    <div class="map-ctrl-btn" onclick="zoomOut()"><i class="fas fa-minus"></i></div>
                </div>
            </div>
            
            <div class="scroll-area" style="flex:1; overflow-y:auto; min-height:0;">
                <div class="location-info" id="locationInfo">
                    <div class="location-title-row">
                        <div class="location-title">深圳市龙华区观澜电子厂</div>
                        <div class="location-tag">当前位置</div>
                        <div class="location-distance">距离您 1.2km</div>
                    </div>
                    <div class="location-address">深圳市龙华区观澜街道大富社区桂月路316号</div>
                </div>
                
                <div class="section-header">
                    <div class="section-title">常用地点</div>
                    <div class="section-action" onclick="alert('管理地址')">管理</div>
                </div>
                
                <div class="address-list" id="addressList">
                    <div class="address-item selected" onclick="selectAddress(this, 0)">
                        <div class="address-icon"><i class="fas fa-industry"></i></div>
                        <div class="address-info">
                            <div class="address-name">
                                观澜电子厂
                                <span class="addr-tag hot">最近</span>
                            </div>
                            <div class="address-detail">龙华区观澜街道桂月路316号</div>
                            <div class="address-tags" style="margin-top:4px;">
                                <span class="addr-tag">电子厂</span>
                                <span class="addr-tag">有空调</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="address-item" onclick="selectAddress(this, 1)">
                        <div class="address-icon"><i class="fas fa-warehouse"></i></div>
                        <div class="address-info">
                            <div class="address-name">
                                龙华物流园
                            </div>
                            <div class="address-detail">龙华区民治街道华旺路88号</div>
                            <div class="address-tags" style="margin-top:4px;">
                                <span class="addr-tag">物流</span>
                                <span class="addr-tag">仓库</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="address-item" onclick="selectAddress(this, 2)">
                        <div class="address-icon"><i class="fas fa-hotel"></i></div>
                        <div class="address-info">
                            <div class="address-name">
                                宝安美食广场
                                <span class="addr-tag">收藏</span>
                            </div>
                            <div class="address-detail">宝安区福永街道兴围社区美食街18号</div>
                            <div class="address-tags" style="margin-top:4px;">
                                <span class="addr-tag">餐饮</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="add-address-btn" onclick="addNewAddress()">
                    <i class="fas fa-plus"></i>
                    <span>新增工作地点</span>
                </div>
            </div>
            
            <div class="bottom-bar">
                <button class="submit-btn" onclick="saveLocation()">确定使用此地点</button>
            </div>
        </div>
        
        <div class="page-indicator"></div>
    </div>

    <script>
        let selectedAddressIndex = 0;
        const addresses = [
            { name: '观澜电子厂', addr: '龙华区观澜街道桂月路316号', tag: '电子厂' },
            { name: '龙华物流园', addr: '龙华区民治街道华旺路88号', tag: '物流' },
            { name: '宝安美食广场', addr: '宝安区福永街道兴围社区美食街18号', tag: '餐饮' }
        ];
        
        function closePage() {
            window.history.back();
        }
        
        function locateMe() {
            alert('正在获取当前位置...');
        }
        
        function zoomIn() {
            alert('放大地图');
        }
        
        function zoomOut() {
            alert('缩小地图');
        }
        
        function selectAddress(el, index) {
            document.querySelectorAll('.address-item').forEach(item => item.classList.remove('selected'));
            el.classList.add('selected');
            selectedAddressIndex = index;
            
            const addr = addresses[index];
            document.getElementById('locationInfo').innerHTML = `
                <div class="location-title-row">
                    <div class="location-title">${addr.name}</div>
                    <div class="location-tag">已选地点</div>
                    <div class="location-distance">距离您 ${(Math.random()*3+0.5).toFixed(1)}km</div>
                </div>
                <div class="location-address">${addr.addr}</div>
            `;
        }
        
        function addNewAddress() {
            alert('新增工作地点\n\n可输入新的地址或在地图上选择位置');
        }
        
        function saveLocation() {
            const addr = addresses[selectedAddressIndex];
            const data = {
                name: addr.name,
                address: addr.addr,
                tag: addr.tag,
                display: `${addr.name} ${addr.addr}`
            };
            sessionStorage.setItem('workLocation', JSON.stringify(data));
            window.history.back();
        }
    </script>
</body>
</html>
