<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>性别年龄 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame {
            width: 390px; height: 844px; background: #FFF8E6; overflow: hidden;
            position: relative; border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
        }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: transparent; }
        
        .page-bg { background: #fff; height: calc(100% - 47px); position: relative; display: flex; flex-direction: column; overflow: hidden; }
        
        .modal-header { text-align: center; padding: 18px 16px 0; position: relative; flex-shrink: 0; }
        .modal-title { font-size: 18px; font-weight: 700; color: #333; }
        .modal-close { position: absolute; right: 16px; top: 14px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #999; cursor: pointer; }
        
        .modal-content { flex: 1; overflow-y: auto; padding: 24px 16px; min-height: 0; }
        .modal-content::-webkit-scrollbar { display: none; }
        
        .section-title {
            font-size: 14px;
            color: #999;
            margin-bottom: 14px;
        }
        
        .gender-group {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }
        .gender-item {
            flex: 1;
            height: 48px;
            border-radius: 10px;
            border: 1.5px solid #eee;
            background: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
        }
        .gender-item.selected {
            background: #FFF8E6;
            border-color: #FF6B35;
            color: #FF6B35;
            font-weight: 600;
        }
        
        .age-display {
            text-align: center;
            margin-bottom: 24px;
        }
        .age-range-text {
            font-size: 20px;
            font-weight: 700;
            color: #333;
        }
        .age-range-text .unit {
            font-size: 14px;
            font-weight: 400;
            color: #666;
        }
        
        .slider-container {
            position: relative;
            padding: 0 12px;
        }
        .slider-track {
            position: relative;
            height: 4px;
            background: #e8e8e8;
            border-radius: 2px;
            margin: 16px 0 20px;
        }
        .slider-fill {
            position: absolute;
            height: 100%;
            background: #FF6B35;
            border-radius: 2px;
            left: var(--fill-left, 0%);
            right: var(--fill-right, 0%);
        }
        .slider-handle {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 28px;
            height: 28px;
            background: white;
            border: 2px solid #FF6B35;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #FF6B35;
            box-shadow: 0 2px 8px rgba(255, 107, 53, 0.3);
        }
        .slider-handle.left { left: var(--left-pos, 0%); }
        .slider-handle.right { left: var(--right-pos, 100%); }
        
        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #999;
            padding: 0 4px;
        }
        
        .bottom-bar {
            background: white;
            padding: 12px 16px;
            border-top: 1px solid #f0f0f0;
            flex-shrink: 0;
            padding-bottom: 20px;
        }
        .submit-btn {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, #FF6B35, #FF8C5A);
            color: white;
            border-radius: 9999px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.3);
        }
        .submit-btn:active { transform: scale(0.98); }
        
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; z-index: 10; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>
        <div class="status-bar">
            <span>19:53</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>
        
        <div class="page-bg">
            <div class="modal-header">
                <div class="modal-title">性别年龄</div>
                <div class="modal-close" onclick="closePage()"><i class="fas fa-times"></i></div>
            </div>
            
            <div class="modal-content">
                <div class="section-title">性别要求</div>
                <div class="gender-group">
                    <div class="gender-item selected" data-value="不限" onclick="selectGender(this)">不限</div>
                    <div class="gender-item" data-value="男性优选" onclick="selectGender(this)">男性优选</div>
                    <div class="gender-item" data-value="女性优选" onclick="selectGender(this)">女性优选</div>
                </div>
                
                <div class="section-title">年龄要求</div>
                <div class="age-display">
                    <span class="age-range-text">
                        <span id="ageMin">18</span>岁~<span id="ageMax" style="color:#999;">不限</span>
                    </span>
                </div>
                
                <div class="slider-container">
                    <div class="slider-track">
                        <div class="slider-fill" id="sliderFill"></div>
                        <div class="slider-handle left" id="leftHandle" data-handle="min">
                            <i class="fas fa-grip-lines"></i>
                        </div>
                        <div class="slider-handle right" id="rightHandle" data-handle="max">
                            <i class="fas fa-grip-lines"></i>
                        </div>
                    </div>
                    <div class="slider-labels">
                        <span>18</span>
                        <span>20</span>
                        <span>30</span>
                        <span>40</span>
                        <span>50</span>
                        <span>不限</span>
                    </div>
                </div>
            </div>
            
            <div class="bottom-bar">
                <button class="submit-btn" onclick="saveAndClose()">确定</button>
            </div>
        </div>
        
        <div class="page-indicator"></div>
    </div>

    <script>
        const MAX_AGE = 60;
        let minAge = 18;
        let maxAge = 60;
        let selectedGender = '不限';
        
        function closePage() {
            window.history.back();
        }
        
        function selectGender(el) {
            document.querySelectorAll('.gender-item').forEach(item => item.classList.remove('selected'));
            el.classList.add('selected');
            selectedGender = el.dataset.value;
        }
        
        function updateSliderUI() {
            const leftPct = ((minAge - 18) / (MAX_AGE - 18)) * 100;
            const rightPct = ((maxAge - 18) / (MAX_AGE - 18)) * 100;
            
            const leftHandle = document.getElementById('leftHandle');
            const rightHandle = document.getElementById('rightHandle');
            const fill = document.getElementById('sliderFill');
            
            leftHandle.style.setProperty('--left-pos', leftPct + '%');
            rightHandle.style.setProperty('--right-pos', (100 - rightPct) + '%');
            fill.style.setProperty('--fill-left', leftPct + '%');
            fill.style.setProperty('--fill-right', (100 - rightPct) + '%');
            
            document.getElementById('ageMin').textContent = minAge;
            document.getElementById('ageMax').textContent = maxAge >= MAX_AGE ? '不限' : maxAge;
        }
        
        function setupSlider(handleId, isMin) {
            const handle = document.getElementById(handleId);
            handle.addEventListener('mousedown', function(e) {
                e.preventDefault();
                const track = document.querySelector('.slider-track');
                const trackRect = track.getBoundingClientRect();
                const sliderWidth = trackRect.width;
                
                function onMove(ev) {
                    let x = ev.clientX - trackRect.left;
                    let pct = Math.max(0, Math.min(1, x / sliderWidth));
                    let age = Math.round(18 + pct * (MAX_AGE - 18));
                    age = Math.max(18, Math.min(MAX_AGE, age));
                    
                    if (isMin) {
                        minAge = Math.min(age, maxAge - 1);
                    } else {
                        maxAge = Math.max(age, minAge + 1);
                    }
                    updateSliderUI();
                }
                
                function onUp() {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                }
                
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });
            
            handle.addEventListener('touchstart', function(e) {
                e.preventDefault();
                const track = document.querySelector('.slider-track');
                const trackRect = track.getBoundingClientRect();
                const sliderWidth = trackRect.width;
                
                function onMove(ev) {
                    let x = ev.touches[0].clientX - trackRect.left;
                    let pct = Math.max(0, Math.min(1, x / sliderWidth));
                    let age = Math.round(18 + pct * (MAX_AGE - 18));
                    age = Math.max(18, Math.min(MAX_AGE, age));
                    
                    if (isMin) {
                        minAge = Math.min(age, maxAge - 1);
                    } else {
                        maxAge = Math.max(age, minAge + 1);
                    }
                    updateSliderUI();
                }
                
                function onEnd() {
                    document.removeEventListener('touchmove', onMove);
                    document.removeEventListener('touchend', onEnd);
                }
                
                document.addEventListener('touchmove', onMove);
                document.addEventListener('touchend', onEnd);
            });
        }
        
        function saveAndClose() {
            const display = `${selectedGender}、${minAge}岁~${maxAge >= MAX_AGE ? '不限' : maxAge}岁`;
            const data = {
                gender: selectedGender,
                ageMin: minAge,
                ageMax: maxAge >= MAX_AGE ? '不限' : maxAge,
                display: display
            };
            sessionStorage.setItem('genderAge', JSON.stringify(data));
            window.history.back();
        }
        
        updateSliderUI();
        setupSlider('leftHandle', true);
        setupSlider('rightHandle', false);
    </script>
</body>
</html>
