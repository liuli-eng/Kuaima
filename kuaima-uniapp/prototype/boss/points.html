<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>积分购买 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame {
            width: 390px; height: 844px; background: #FFF8E6; overflow: hidden;
            position: relative; border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
        }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: transparent; }
        .nav-bar { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #FFF8E6; }
        .nav-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #333; cursor: pointer; }
        .nav-title { font-size: 17px; font-weight: 600; color: #333; }
        .nav-right { display: flex; align-items: center; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); border-radius: 9999px; padding: 3px 6px; gap: 2px; }
        .nav-btn { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #555; font-size: 10px; }
        .nav-divider { width: 1px; height: 10px; background: #ddd; }
        .content { padding: 16px; height: calc(100% - 97px); overflow-y: auto; }
        .content::-webkit-scrollbar { display: none; }
        
        .points-card {
            background: linear-gradient(135deg, #FFD700, #FF8C00);
            border-radius: 16px;
            padding: 24px;
            color: white;
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(255, 140, 0, 0.3);
        }
        .points-label { font-size: 13px; opacity: 0.9; }
        .points-value { font-size: 36px; font-weight: 700; margin-top: 8px; }
        .points-desc { font-size: 12px; opacity: 0.85; margin-top: 6px; }
        
        .section-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 12px; }
        
        .package-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .package-item {
            background: white;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            position: relative;
        }
        .package-item:active { transform: scale(0.98); }
        .package-item.hot::after {
            content: '热门';
            position: absolute;
            top: 8px;
            right: 8px;
            background: #FF6B35;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 8px;
        }
        .package-points { font-size: 24px; font-weight: 700; color: #FF8C00; }
        .package-unit { font-size: 12px; color: #999; margin-top: 2px; }
        .package-price { font-size: 18px; font-weight: 600; color: #333; margin-top: 10px; }
        .package-tag { font-size: 11px; color: #666; margin-top: 4px; }
        
        .rules-card { background: white; border-radius: 12px; padding: 16px; margin-top: 20px; }
        .rules-title { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 10px; }
        .rules-item { font-size: 12px; color: #666; line-height: 1.8; }
        
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; z-index: 10; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>
        <div class="status-bar">
            <span>19:53</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>
        <div class="nav-bar">
            <div class="nav-back" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
            </div>
            <div class="nav-title">积分购买</div>
            <div class="nav-right">
                <div class="nav-btn"><i class="fas fa-ellipsis"></i></div>
                <div class="nav-divider"></div>
                <div class="nav-btn"><i class="fas fa-minus"></i></div>
                <div class="nav-divider"></div>
                <div class="nav-btn"><i class="fas fa-circle"></i></div>
            </div>
        </div>
        <div class="content">
            <div class="points-card">
                <div class="points-label">我的积分</div>
                <div class="points-value">0</div>
                <div class="points-desc">积分可用于发布订单、提升曝光</div>
            </div>
            
            <div class="section-title">选择积分包</div>
            <div class="package-grid">
                <div class="package-item" onclick="buy(1000, 10)">
                    <div class="package-points">1000</div>
                    <div class="package-unit">积分</div>
                    <div class="package-price">¥10</div>
                    <div class="package-tag">适用所有订单</div>
                </div>
                <div class="package-item hot" onclick="buy(5000, 45)">
                    <div class="package-points">5000</div>
                    <div class="package-unit">积分</div>
                    <div class="package-price">¥45</div>
                    <div class="package-tag">省5元 更划算</div>
                </div>
                <div class="package-item" onclick="buy(10000, 80)">
                    <div class="package-points">10000</div>
                    <div class="package-unit">积分</div>
                    <div class="package-price">¥80</div>
                    <div class="package-tag">省20元</div>
                </div>
                <div class="package-item" onclick="buy(20000, 150)">
                    <div class="package-points">20000</div>
                    <div class="package-unit">积分</div>
                    <div class="package-price">¥150</div>
                    <div class="package-tag">省50元</div>
                </div>
            </div>
            
            <div class="rules-card">
                <div class="rules-title"><i class="fas fa-info-circle text-orange-400 mr-1"></i>积分使用规则</div>
                <div class="rules-item">1. 积分可用于发布日结订单、提升订单曝光</div>
                <div class="rules-item">2. 100积分 = ¥1，积分不可兑换现金</div>
                <div class="rules-item">3. 积分有效期12个月，过期自动清零</div>
                <div class="rules-item">4. 购买后立即到账，可在订单中使用</div>
            </div>
        </div>
        <div class="page-indicator"></div>
    </div>

    <script>
        function goBack() { window.history.back(); }
        function buy(points, price) {
            alert('购买 ' + points + ' 积分\n金额：¥' + price);
        }
        function navigateTo(page) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "follow-qrcode", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "intent-personal", "intent-job", "intent-preference", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance", "realname", "points", "voucher", "reward"];
            var path = page + '.html';
            if (bossPages.indexOf(page) < 0 && workerPages.indexOf(page) >= 0) {
                path = '../worker/' + path;
            } else if (bossPages.indexOf(page) < 0 && workerPages.indexOf(page) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }
    </script>
</body>
</html>
