<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报名通知 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame { width: 390px; height: 844px; background: #f5f5f5; overflow: hidden; position: relative; border-radius: 44px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a; }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }
        .nav-bar { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #fff; }
        .nav-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #333; cursor: pointer; }
        .nav-title { font-size: 17px; font-weight: 600; color: #333; }
        .nav-right { display: flex; gap: 14px; color: #333; font-size: 16px; cursor: pointer; }
        .stats-card { background: linear-gradient(135deg, #FF6B35, #FF8C5A); margin: 12px 16px; border-radius: 12px; padding: 16px; color: #fff; display: flex; justify-content: space-around; }
        .stat-item { text-align: center; }
        .stat-num { font-size: 24px; font-weight: 700; }
        .stat-label { font-size: 12px; opacity: 0.9; margin-top: 4px; }
        .apply-item { background: #fff; margin: 12px 16px; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .apply-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .apply-avatar { width: 44px; height: 44px; background: linear-gradient(135deg, #52C41A, #73D13D); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; }
        .apply-info { flex: 1; }
        .apply-name { font-size: 15px; font-weight: 600; color: #333; }
        .apply-meta { font-size: 12px; color: #999; margin-top: 2px; }
        .apply-badge { display: inline-block; font-size: 11px; padding: 2px 6px; background: #FFF3ED; color: #FF6B35; border-radius: 4px; margin-left: 6px; }
        .apply-job { font-size: 13px; color: #666; line-height: 1.5; margin-bottom: 12px; }
        .apply-job strong { color: #333; }
        .apply-actions { display: flex; gap: 10px; }
        .btn-approve { flex: 1; padding: 10px; background: linear-gradient(135deg, #FF6B35, #FF8C5A); color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; }
        .btn-reject { flex: 1; padding: 10px; background: #fff; color: #666; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; }
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">

                <div class="stat-item"><div class="stat-num">2</div><div class="stat-label">已拒绝</div></div>

                    <div class="apply-info">
                        <div class="apply-name">孙阿姨 <span class="apply-badge">新零工</span></div>
                        <div class="apply-meta">报名时间：2026-08-21 11:20</div>
                    </div>
                </div>
                <div class="apply-job">应聘岗位：<strong>餐饮服务员</strong> · 8月22日 10:00 · 2人</div>
                <div class="apply-actions">
                    <button class="btn-approve">通过</button>
                    <button class="btn-reject">拒绝</button>
                </div>
            </div>
            <div class="apply-item">
                <div class="apply-header">
                    <div class="apply-avatar" style="background: linear-gradient(135deg, #FA8C16, #FFC53D);">周</div>
                    <div class="apply-info">

                        <div class="apply-meta">报名时间：2026-08-20 16:45</div>

                <div class="apply-actions">
                    <button class="btn-approve">通过</button>
                    <button class="btn-reject">拒绝</button>
                </div>
            </div>
        </div>
        <div class="page-indicator"></div>
    </div>
    <script>function goBack(){window.history.back();}</script>
</body>
</html>
