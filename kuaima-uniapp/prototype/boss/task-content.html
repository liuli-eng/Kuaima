<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务要求 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame {
            width: 390px; height: 844px; background: #FFF8E6; overflow: hidden;
            position: relative; border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
        }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: transparent; }
        
        .page-bg { background: #fff; height: calc(100% - 47px); position: relative; display: flex; flex-direction: column; overflow: hidden; }
        
        .modal-header { text-align: center; padding: 18px 16px 0; position: relative; flex-shrink: 0; }
        .modal-title { font-size: 18px; font-weight: 700; color: #333; }
        .modal-close { position: absolute; right: 16px; top: 14px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #999; cursor: pointer; }
        
        .modal-content { flex: 1; overflow-y: auto; padding: 16px; min-height: 0; }
        .modal-content::-webkit-scrollbar { display: none; }
        
        .section-card {
            background: white;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
        }
        
        .field-label {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .field-label .extra { font-size: 12px; color: #FF6B35; font-weight: 400; }
        .field-label .extra-gray { font-size: 12px; color: #999; font-weight: 400; }
        
        .title-input {
            width: 100%;
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 15px;
            color: #333;
            outline: none;
            margin-bottom: 8px;
        }
        .title-input::placeholder { color: #bbb; }
        .title-count { text-align: right; font-size: 11px; color: #bbb; margin-bottom: 8px; }
        
        .desc-textarea {
            width: 100%;
            min-height: 90px;
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px;
            color: #333;
            outline: none;
            resize: none;
            line-height: 1.6;
        }
        .desc-textarea::placeholder { color: #bbb; }
        .desc-count { text-align: right; font-size: 11px; color: #bbb; margin-top: 6px; }
        
        .upload-row { display: flex; gap: 10px; margin-top: 12px; }
        .upload-btn {
            flex: 1;
            height: 70px;
            background: #f9f9f9;
            border: 2px dashed #e0e0e0;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .upload-btn:hover { border-color: #FF6B35; background: #FFF8E6; }
        .upload-btn i { font-size: 22px; color: #FF6B35; margin-bottom: 4px; }
        .upload-btn span { font-size: 12px; color: #666; }
        .upload-hint { font-size: 12px; color: #999; margin-top: 10px; }
        .upload-hint .highlight { color: #FF6B35; font-weight: 500; }
        .upload-link { color: #FF6B35; font-size: 12px; cursor: pointer; margin-right: 12px; }
        
        .tag-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag-item {
            padding: 8px 16px;
            border-radius: 9999px;
            border: 1px solid #eee;
            background: #f9f9f9;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tag-item.selected {
            background: #FFF8E6;
            border-color: #FF6B35;
            color: #FF6B35;
            font-weight: 500;
        }
        
        .bottom-bar {
            background: white;
            padding: 12px 16px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            padding-bottom: 20px;
        }
        .customer-service {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFF8E6, #FFE4B5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FF6B35;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .submit-btn {
            flex: 1;
            height: 48px;
            background: linear-gradient(135deg, #FF6B35, #FF8C5A);
            color: white;
            border-radius: 9999px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.3);
        }
        .submit-btn:active { transform: scale(0.98); }
        
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; z-index: 10; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>
        <div class="status-bar">
            <span>19:53</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>
        
        <div class="page-bg">
            <div class="modal-header">
                <div class="modal-title">任务要求</div>
                <div class="modal-close" onclick="closePage()"><i class="fas fa-times"></i></div>
            </div>
            
            <div class="modal-content">
                <!-- 招工标题 -->
                <div class="section-card">
                    <div class="field-label">招工标题</div>
                    <input type="text" class="title-input" id="jobTitle" value="电子厂普工" maxlength="20" oninput="updateCount()">
                    <div class="title-count"><span id="titleCount">5</span>/20</div>
                </div>
                
                <!-- 详情描述 -->
                <div class="section-card">
                    <div class="field-label">
                        <span>详情描述 <span style="color:#999;font-weight:400;">(非必填)</span></span>
                    </div>
                    <textarea class="desc-textarea" id="jobDesc" placeholder="补充工作要求或详细内容，请勿填写手机号或微信号" maxlength="200" oninput="updateDescCount()"></textarea>
                    <div class="desc-count"><span id="descCount">0</span>/200</div>
                    
                    <div class="upload-row">
                        <div class="upload-btn" onclick="uploadVideo()">
                            <i class="fas fa-video"></i>
                            <span>上传视频</span>
                        </div>
                        <div class="upload-btn" onclick="uploadPhoto()">
                            <i class="fas fa-camera"></i>
                            <span>上传照片</span>
                        </div>
                    </div>
                    <div class="upload-hint">
                        上传有工作内容的视频或照片，<span class="highlight">增加50%的接单率</span>
                        <br>
                        <span class="upload-link" onclick="alert('查看图片示例')">图片示例</span>
                        <span class="upload-link" onclick="alert('查看视频示例')">视频示例</span>
                    </div>
                </div>
                
                <!-- 工作福利 -->
                <div class="section-card">
                    <div class="field-label">
                        <span>工作福利</span>
                        <span class="extra-gray">可多选</span>
                    </div>
                    <div class="tag-group">
                        <div class="tag-item" onclick="toggleTag(this)">包工作餐</div>
                        <div class="tag-item" onclick="toggleTag(this)">中午包饭</div>
                        <div class="tag-item" onclick="toggleTag(this)">晚上包饭</div>
                        <div class="tag-item" onclick="toggleTag(this)">有空调</div>
                        <div class="tag-item" onclick="toggleTag(this)">有风扇</div>
                        <div class="tag-item selected" onclick="toggleTag(this)">室内工作</div>
                    </div>
                </div>
                
                <!-- 经验要求 -->
                <div class="section-card">
                    <div class="field-label">经验要求</div>
                    <div class="tag-group">
                        <div class="tag-item" onclick="toggleTag(this)">只要熟手</div>
                        <div class="tag-item selected" onclick="toggleTag(this)">欢迎新手</div>
                    </div>
                </div>
                
                <!-- 工作要求 -->
                <div class="section-card">
                    <div class="field-label">
                        <span>工作要求</span>
                        <span class="extra-gray">可多选</span>
                    </div>
                    <div class="tag-group">
                        <div class="tag-item" onclick="toggleTag(this)">禁止吸烟</div>
                        <div class="tag-item" onclick="toggleTag(this)">认真负责</div>
                        <div class="tag-item" onclick="toggleTag(this)">手脚麻利</div>
                        <div class="tag-item" onclick="toggleTag(this)">提前到场</div>
                        <div class="tag-item" onclick="toggleTag(this)">不磨洋工</div>
                        <div class="tag-item" onclick="toggleTag(this)">禁穿凉鞋短裤</div>
                    </div>
                </div>
            </div>
            
            <div class="bottom-bar">
                <div class="customer-service" onclick="alert('客服')">
                    <i class="fas fa-headset"></i>
                </div>
                <button class="submit-btn" onclick="saveContent()">完成</button>
            </div>
        </div>
        
        <div class="page-indicator"></div>
    </div>

    <script>
        function closePage() {
            if (window.opener) {
                window.close();
            } else {
                window.history.back();
            }
        }
        
        function toggleTag(el) {
            el.classList.toggle('selected');
        }
        
        function updateCount() {
            const val = document.getElementById('jobTitle').value;
            document.getElementById('titleCount').textContent = val.length;
        }
        
        function updateDescCount() {
            const val = document.getElementById('jobDesc').value;
            document.getElementById('descCount').textContent = val.length;
        }
        
        function uploadVideo() {
            alert('选择视频文件...\n支持MP4格式，最长60秒');
        }
        
        function uploadPhoto() {
            alert('选择照片...\n支持JPG/PNG格式，最多9张');
        }
        
        function saveContent() {
            const title = document.getElementById('jobTitle').value;
            const desc = document.getElementById('jobDesc').value;
            const benefits = Array.from(document.querySelectorAll('.tag-group:nth-of-type(1) .tag-item.selected')).map(el => el.textContent);
            const exp = Array.from(document.querySelectorAll('.tag-group:nth-of-type(2) .tag-item.selected')).map(el => el.textContent);
            const requirements = Array.from(document.querySelectorAll('.tag-group:nth-of-type(3) .tag-item.selected')).map(el => el.textContent);
            
            const data = {
                title: title,
                desc: desc,
                benefits: benefits.join('、'),
                exp: exp.join('、'),
                requirements: requirements.join('、')
            };
            
            sessionStorage.setItem('taskContent', JSON.stringify(data));
            alert('保存成功！\n\n标题：' + title + '\n福利：' + (benefits.join('、') || '无') + '\n经验：' + (exp.join('、') || '无') + '\n要求：' + (requirements.join('、') || '无'));
            window.history.back();
        }
    </script>
</body>
</html>
