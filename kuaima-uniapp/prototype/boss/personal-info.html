<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人信息 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame {
            width: 390px; height: 844px; background: #FFF8E6; overflow: hidden;
            position: relative; border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
        }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: transparent; }
        
        .nav-bar { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #FFF8E6; position: relative; z-index: 10; }
        .nav-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #333; cursor: pointer; }
        .nav-title { font-size: 17px; font-weight: 600; color: #333; }
        .nav-right { display: flex; align-items: center; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); border-radius: 9999px; padding: 3px 6px; gap: 2px; }
        .nav-btn { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #555; font-size: 10px; }
        .nav-divider { width: 1px; height: 10px; background: #ddd; }
        
        .content { padding: 0; height: calc(100% - 97px); overflow-y: auto; }
        .content::-webkit-scrollbar { display: none; }
        
        .auth-banner {
            background: linear-gradient(135deg, #FFF8E6, #FFE4B5);
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .auth-left { display: flex; align-items: center; gap: 12px; }
        .auth-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(255, 165, 0, 0.25);
        }
        .auth-icon i { font-size: 20px; color: white; }
        .auth-title { font-size: 16px; font-weight: 700; color: #333; display: flex; align-items: center; gap: 4px; }
        .auth-title i { color: #FFA500; }
        .auth-desc { font-size: 12px; color: #999; margin-top: 4px; }
        .auth-btn {
            background: linear-gradient(135deg, #FF6B35, #FF8C5A);
            color: white;
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }
        
        .form-card {
            background: white;
            margin: 16px 16px 0;
            border-radius: 14px;
            overflow: hidden;
        }
        .form-row {
            display: flex;
            align-items: center;
            padding: 16px 18px;
            border-bottom: 1px solid #f5f5f5;
            cursor: pointer;
            transition: background 0.15s;
        }
        .form-row:last-child { border-bottom: none; }
        .form-row:active { background: #f9f9f9; }
        .form-label { font-size: 15px; color: #333; font-weight: 500; min-width: 70px; }
        .form-value { flex: 1; text-align: right; font-size: 15px; color: #333; margin-right: 8px; }
        .form-value.placeholder { color: #ccc; }
        .form-arrow { color: #ccc; font-size: 12px; }
        
        .avatar-wrap { display: flex; align-items: center; flex: 1; justify-content: flex-end; gap: 8px; margin-right: 8px; }
        .avatar-img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFE4B5, #FFD48A);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .avatar-img img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-img::before {
            content: '';
            position: absolute;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #FFD48A 0%, #FFA500 50%, #FF6B35 100%);
        }
        .avatar-img::after {
            content: '👤';
            position: absolute;
            font-size: 24px;
        }
        
        .section-title {
            font-size: 13px;
            color: #999;
            padding: 20px 20px 10px;
            font-weight: 500;
        }
        
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; z-index: 10; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>
        <div class="status-bar">
            <span>19:53</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>
        
        <div class="nav-bar">
            <div class="nav-back" onclick="goBack()"><i class="fas fa-chevron-left"></i></div>
            <div class="nav-title">个人信息</div>
            <div class="nav-right">
                <div class="nav-btn" onclick="alert('菜单')"><i class="fas fa-ellipsis"></i></div>
                <div class="nav-divider"></div>
                <div class="nav-btn" onclick="alert('最小化')"><i class="fas fa-minus"></i></div>
                <div class="nav-divider"></div>
                <div class="nav-btn" onclick="alert('更多')"><i class="fas fa-circle"></i></div>
            </div>
        </div>
        
        <div class="content">
            <div class="auth-banner">
                <div class="auth-left">
                    <div class="auth-icon"><i class="fas fa-shield-halved"></i></div>
                    <div>
                        <div class="auth-title"><i class="fas fa-shield-halved"></i>实名认证</div>
                        <div class="auth-desc">完成认证，找活找人更容易！</div>
                    </div>
                </div>
                <div class="auth-btn" onclick="navigateTo('realname')">立即实名 ›</div>
            </div>
            
            <div class="form-card">
                <div class="form-row" onclick="changeAvatar()">
                    <div class="form-label">头像</div>
                    <div class="avatar-wrap">
                        <div class="avatar-img"></div>
                    </div>
                    <i class="fas fa-chevron-right form-arrow"></i>
                </div>
                <div class="form-row" onclick="editName()">
                    <div class="form-label">姓名</div>
                    <div class="form-value">晴时见禾</div>
                    <i class="fas fa-chevron-right form-arrow"></i>
                </div>
                <div class="form-row" onclick="editPhone()">
                    <div class="form-label">手机号</div>
                    <div class="form-value">152******53</div>
                    <i class="fas fa-chevron-right form-arrow"></i>
                </div>
            </div>
            
            <div class="section-title">企业信息</div>
            <div class="form-card">
                <div class="form-row" onclick="navigateTo('enterprise-cert')">
                    <div class="form-label">企业认证</div>
                    <div class="form-value placeholder">未认证</div>
                    <i class="fas fa-chevron-right form-arrow"></i>
                </div>
                <div class="form-row" onclick="alert('编辑企业名称')">
                    <div class="form-label">企业名称</div>
                    <div class="form-value placeholder">未填写</div>
                    <i class="fas fa-chevron-right form-arrow"></i>
                </div>
                <div class="form-row" onclick="alert('编辑企业地址')">
                    <div class="form-label">企业地址</div>
                    <div class="form-value placeholder">未填写</div>
                    <i class="fas fa-chevron-right form-arrow"></i>
                </div>
            </div>
            
            <div class="section-title">账号设置</div>
            <div class="form-card">
                <div class="form-row" onclick="navigateTo('switch-account')">
                    <div class="form-label">更换账号</div>
                    <div class="form-value">切换账号登录</div>
                    <i class="fas fa-chevron-right form-arrow"></i>
                </div>
                <div class="form-row" onclick="alert('退出登录')">
                    <div class="form-label" style="color:#FF6B35;">退出登录</div>
                    <div class="form-value"></div>
                    <i class="fas fa-chevron-right form-arrow"></i>
                </div>
            </div>
        </div>
        
        <div class="page-indicator"></div>
    </div>

    <script>
        function goBack() { window.history.back(); }
        
        function changeAvatar() {
            const choice = confirm('是否要更换头像？');
            if (choice) alert('打开相册选择头像...');
        }
        
        function editName() {
            const name = prompt('请输入新姓名：', '晴时见禾');
            if (name && name.trim()) {
                document.querySelectorAll('.form-row')[1].querySelector('.form-value').textContent = name;
            }
        }
        
        function editPhone() {
            alert('跳转到手机号修改页面');
        }
        
        function navigateTo(page) {
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance", "realname", "points", "voucher", "reward", "add-address", "download-app", "personal-info"];
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "follow-qrcode", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "intent-personal", "intent-job", "intent-preference", "invite", "join-group", "notification", "privacy", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message"];
            var path = page + '.html';
            if (bossPages.indexOf(page) < 0 && workerPages.indexOf(page) >= 0) {
                path = '../worker/' + path;
            } else if (bossPages.indexOf(page) < 0 && workerPages.indexOf(page) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }
    </script>
</body>
</html>
