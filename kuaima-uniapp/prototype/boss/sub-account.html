<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开通子账号 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame { width: 390px; height: 844px; background: #f5f5f5; overflow: hidden; position: relative; border-radius: 44px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a; }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }
        .nav-bar { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #fff; }
        .nav-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #333; cursor: pointer; }
        .nav-title { font-size: 17px; font-weight: 600; color: #333; }
        .nav-right { display: flex; gap: 14px; color: #333; font-size: 16px; cursor: pointer; }
        .info-card { background: #fff; margin: 12px 16px; border-radius: 12px; padding: 16px; }
        .info-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 12px; }
        .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f5f5f5; font-size: 13px; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #666; }
        .info-value { color: #333; }
        .form-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #f5f5f5; }
        .form-label { font-size: 14px; color: #333; width: 100px; }
        .form-input { flex: 1; border: none; outline: none; background: transparent; font-size: 14px; color: #666; }
        .form-input::placeholder { color: #ccc; }
        .role-select { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .role-tag { padding: 6px 12px; font-size: 12px; color: #666; background: #f5f5f5; border-radius: 14px; cursor: pointer; border: 1px solid transparent; }
        .role-tag.active { background: #FFF3ED; color: #FF6B35; border-color: #FF6B35; }
        .submit-btn { width: calc(100% - 32px); padding: 13px; background: linear-gradient(135deg, #FF6B35, #FF8C5A); color: #fff; border: none; border-radius: 24px; font-size: 15px; font-weight: 600; margin: 24px 16px 0; cursor: pointer; }
        .empty-state { text-align: center; padding: 60px 40px; }
        .empty-icon { font-size: 48px; color: #ddd; margin-bottom: 12px; }
        .empty-text { font-size: 14px; color: #999; }
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>
        <div class="status-bar"><span>19:53</span><div class="flex items-center gap-1"><i class="fas fa-signal text-sm"></i><i class="fas fa-wifi text-sm"></i><i class="fas fa-battery-full text-sm"></i></div></div>
        <div class="nav-bar">
            <div class="nav-back" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
            <div class="nav-title">开通子账号</div>
            <div class="nav-right"><i class="fas fa-question-circle"></i></div>
        </div>
        <div class="overflow-y-auto" style="height: calc(100% - 97px - 16px);">
            <div class="info-card">
                <div class="info-title">子账号信息</div>
                <div class="info-row"><span class="info-label">子账号数量</span><span class="info-value">0 / 3</span></div>
                <div class="info-row"><span class="info-label">可分配角色</span><span class="info-value">管理员、操作员</span></div>
            </div>
            <div class="info-card">
                <div class="info-title">添加子账号</div>
                <div class="form-item"><span class="form-label">手机号</span><input class="form-input" placeholder="请输入手机号"></div>
                <div class="form-item"><span class="form-label">验证码</span><input class="form-input" placeholder="请输入验证码"></div>
                <div class="form-item" style="border: none;"><span class="form-label">角色权限</span></div>
                <div class="role-select">
                    <div class="role-tag">查看订单</div>
                    <div class="role-tag">发布岗位</div>
                    <div class="role-tag">结算工资</div>
                    <div class="role-tag active">全部权限</div>
                </div>
            </div>
            <button class="submit-btn" onclick="alert('提交成功')">确认开通</button>
            <div class="empty-state">
                <div class="empty-icon"><i class="fas fa-user-plus"></i></div>
                <div class="empty-text">暂无子账号</div>
                <div class="empty-text" style="margin-top: 4px;">最多可开通3个子账号</div>
            </div>
        </div>
        <div class="page-indicator"></div>
    </div>
    <script>function goBack(){window.history.back();}</script>
</body>
</html>
