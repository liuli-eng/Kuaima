<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息 - 快马日结（老板）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', -apple-system, 'PingFang SC', sans-serif; }
        .phone-frame {
            width: 390px;
            height: 844px;
            background: #FFF8E6;
            overflow: hidden;
            position: relative;
            border-radius: 44px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
            display: flex;
            flex-direction: column;
        }
        .dynamic-island {
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 32px;
            background: #000;
            border-radius: 20px;
            z-index: 60;
        }
        .tab-bar {
            flex-shrink: 0;
            height: 83px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-top: 0.5px solid rgba(0, 0, 0, 0.05);
            display: flex;
            padding-bottom: 20px;
            z-index: 50;
        }
        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .tab-item.active .tab-label { color: #FF6B35; }
        .tab-icon-wrap {
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            margin-bottom: 3px;
        }
        .tab-label {
            font-size: 10px;
            color: #999;
            font-weight: 500;
        }
        .tab-item.active .tab-icon-wrap {
            background: linear-gradient(135deg, #FF6B35, #FF8C5A);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            color: white;
            margin-bottom: 2px;
            box-shadow: 0 4px 10px rgba(255, 107, 53, 0.3);
        }
        .scroll-area {
            flex: 1;
            overflow-y: auto;
            background: #FFF8E6;
        }
        .scroll-area::-webkit-scrollbar { display: none; }
        .card-shadow { box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06); }
        .header-bar {
            background: linear-gradient(180deg, #FFD59E 0%, #FFE4B5 100%);
            padding: 12px 16px 20px;
        }
        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-title {
            font-size: 22px;
            font-weight: 700;
            color: #8B4513;
            position: relative;
        }
        .page-title::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 20px;
            height: 3px;
            background: #FF6B35;
            border-radius: 2px;
        }
        .message-list {
            background: white;
            margin: 12px 16px;
            border-radius: 16px;
            overflow: hidden;
        }
        .message-item {
            display: flex;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #f5f5f5;
            cursor: pointer;
        }
        .message-item:last-child {
            border-bottom: none;
        }
        .message-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 12px;
            position: relative;
            flex-shrink: 0;
        }
        .icon-blue { background: #E6F7FF; color: #1890FF; }
        .icon-orange { background: #FFF3E0; color: #FF6B35; }
        .icon-red { background: #FFE8E8; color: #FF4D4F; }
        .icon-green { background: #E6F7EC; color: #52C41A; }
        .icon-purple { background: #F9F0FF; color: #722ED1; }
        .badge-dot {
            position: absolute;
            top: 0;
            right: 0;
            width: 10px;
            height: 10px;
            background: #FF4D4F;
            border-radius: 50%;
            border: 2px solid white;
        }
        .message-content {
            flex: 1;
            min-width: 0;
        }
        .message-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }
        .message-desc {
            font-size: 13px;
            color: #999;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .message-action {
            flex-shrink: 0;
        }
        .action-btn-small {
            padding: 8px 16px;
            background: #FF6B35;
            color: white;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }
        .action-btn-outline {
            padding: 6px 14px;
            border: 1px solid #FF6B35;
            color: #FF6B35;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
        }
        .view-history {
            text-align: center;
            padding: 24px 16px;
        }
        .history-btn {
            display: inline-block;
            padding: 12px 32px;
            border: 1px solid #ddd;
            border-radius: 24px;
            color: #666;
            font-size: 14px;
            cursor: pointer;
            background: white;
        }
        .empty-tip {
            text-align: center;
            padding: 40px 20px;
            font-size: 13px;
            color: #999;
        }
        .bottom-slogan {
            text-align: center;
            padding: 20px 16px;
        }
        .slogan-title {
            font-size: 28px;
            font-weight: 800;
            color: #E8D5B7;
            letter-spacing: 4px;
        }
        .slogan-desc {
            font-size: 12px;
            color: #ccc;
            margin-top: 8px;
        }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>
        
        <!-- 状态栏 -->
        <div style="height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333;">
            <span>19:53</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>

        <div class="scroll-area">
            <!-- 头部 -->
            <div class="header-bar">
                <div class="title-row">
                    <div class="page-title">消息</div>
                    <div class="flex bg-white/80 backdrop-blur-sm rounded-full p-1 shadow-sm">
                        <div class="w-7 h-7 flex items-center justify-center cursor-pointer">
                            <i class="fas fa-ellipsis text-gray-700 text-sm"></i>
                        </div>
                        <div class="w-px h-4 bg-gray-300"></div>
                        <div class="w-7 h-7 flex items-center justify-center cursor-pointer">
                            <i class="fas fa-circle text-gray-700 text-xs"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 消息列表 -->
            <div class="message-list card-shadow">
                <!-- 企业认证提醒 -->
                <div class="message-item" onclick="alert('企业认证')">
                    <div class="message-icon icon-blue">
                        <i class="fas fa-building"></i>
                        <div class="badge-dot"></div>
                    </div>
                    <div class="message-content">
                        <div class="message-title">企业认证提醒</div>
                        <div class="message-desc">曝光加权·优先推荐熟练零工接单</div>
                    </div>
                    <div class="message-action">
                        <span class="action-btn-small" onclick="navigateTo('enterprise-cert')">立即认证</span>
                    </div>
                </div>

                <!-- 系统通知 -->
                <div class="message-item" onclick="navigateTo('system-notice')">
                    <div class="message-icon icon-orange">
                        <i class="fas fa-bell"></i>
                    </div>
                    <div class="message-content">
                        <div class="message-title">系统通知</div>
                        <div class="message-desc">消息内容</div>
                    </div>
                    <div class="message-action">
                        <i class="fas fa-chevron-right text-gray-300"></i>
                    </div>
                </div>

                <!-- 报名通知 -->
                <div class="message-item" onclick="navigateTo('signup-notice')">
                    <div class="message-icon icon-green">
                        <i class="fas fa-user-plus"></i>
                        <div class="badge-dot"></div>
                    </div>
                    <div class="message-content">
                        <div class="message-title">报名通知</div>
                        <div class="message-desc">有3位零工报名了您发布的岗位</div>
                    </div>
                    <div class="message-action">
                        <i class="fas fa-chevron-right text-gray-300"></i>
                    </div>
                </div>

                <!-- 结算消息 -->
                <div class="message-item" onclick="navigateTo('settlement')">
                    <div class="message-icon icon-purple">
                        <i class="fas fa-money-bill-wave"></i>
                    </div>
                    <div class="message-content">
                        <div class="message-title">结算消息</div>
                        <div class="message-desc">昨日岗位工资已结算完成</div>
                    </div>
                    <div class="message-action">
                        <i class="fas fa-chevron-right text-gray-300"></i>
                    </div>
                </div>

            </div>

            <!-- 查看历史消息 -->
            <div class="view-history">
                <div class="history-btn" onclick="navigateTo('history-message')">查看历史消息</div>
            </div>

            <!-- 底部标语 -->
            <div class="bottom-slogan">
                <div class="slogan-title">招临时工 上快马日结</div>
                <div class="slogan-desc">— 熟练工 上岗快 人靠谱 —</div>
            </div>
        </div>

        <!-- 底部TabBar -->
        <div class="tab-bar">
            <div class="tab-item" onclick="switchTab(this, 'boss-home')">
                <div class="tab-icon-wrap"><i class="fas fa-house text-lg"></i></div>
                <span class="tab-label">首页</span>
            </div>
            <div class="tab-item" onclick="switchTab(this, 'boss-order')">
                <div class="tab-icon-wrap"><i class="fas fa-calendar-check text-lg"></i></div>
                <span class="tab-label">日结订单</span>
            </div>
            <div class="tab-item active" onclick="switchTab(this, 'boss-message')">
                <div class="tab-icon-wrap"><i class="fas fa-comment-dots text-lg"></i></div>
                <span class="tab-label">消息</span>
            </div>
            <div class="tab-item" onclick="switchTab(this, 'boss-profile')">
                <div class="tab-icon-wrap"><i class="fas fa-smile text-lg"></i></div>
                <span class="tab-label">我的</span>
            </div>
        </div>
    </div>

    <script>
        function navigateTo(pageName) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance"];
            var path = pageName + '.html';
            if (bossPages.indexOf(pageName) < 0 && workerPages.indexOf(pageName) >= 0) {
                path = '../worker/' + path;
            } else if (bossPages.indexOf(pageName) < 0 && workerPages.indexOf(pageName) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }


        function switchTab(el, tab) {
            document.querySelectorAll('.tab-item').forEach(i => {
                i.classList.remove('active');
                const iconWrap = i.querySelector('.tab-icon-wrap');
                if (iconWrap) {
                    iconWrap.style.background = '';
                    iconWrap.style.borderRadius = '';
                    iconWrap.style.width = '';
                    iconWrap.style.height = '';
                    iconWrap.style.color = '';
                    iconWrap.style.marginBottom = '';
                    iconWrap.style.boxShadow = '';
                }
            });
            el.classList.add('active');
            const activeIconWrap = el.querySelector('.tab-icon-wrap');
            if (activeIconWrap) {
                activeIconWrap.style.background = 'linear-gradient(135deg, #FF6B35, #FF8C5A)';
                activeIconWrap.style.borderRadius = '50%';
                activeIconWrap.style.width = '32px';
                activeIconWrap.style.height = '32px';
                activeIconWrap.style.color = 'white';
                activeIconWrap.style.marginBottom = '2px';
                activeIconWrap.style.boxShadow = '0 4px 10px rgba(255, 107, 53, 0.3)';
            }
            navigateTo(tab);
        }
    </script>
</body>
</html>
