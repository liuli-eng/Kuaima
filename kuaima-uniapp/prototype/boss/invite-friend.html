<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邀请好友 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame { width: 390px; height: 844px; background: #f5f5f5; overflow: hidden; position: relative; border-radius: 44px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a; }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }
        .nav-bar { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #fff; }
        .nav-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #333; cursor: pointer; }
        .nav-title { font-size: 17px; font-weight: 600; color: #333; }
        .nav-right { display: flex; gap: 14px; color: #333; font-size: 16px; cursor: pointer; }
        .banner { background: linear-gradient(135deg, #FF6B35, #FF8C5A); margin: 12px 16px; border-radius: 16px; padding: 24px; color: #fff; text-align: center; }
        .banner-icon { font-size: 40px; margin-bottom: 12px; }
        .banner-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        .banner-desc { font-size: 13px; opacity: 0.9; }
        .reward-row { display: flex; justify-content: space-around; margin: 16px; background: #fff; border-radius: 12px; padding: 16px; }
        .reward-item { text-align: center; }
        .reward-amount { font-size: 24px; font-weight: 700; color: #FF6B35; }
        .reward-label { font-size: 12px; color: #999; margin-top: 4px; }
        .rule-card { background: #fff; margin: 12px 16px; border-radius: 12px; padding: 16px; }
        .rule-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 12px; }
        .rule-item { font-size: 13px; color: #666; line-height: 1.8; display: flex; gap: 6px; }
        .rule-item::before { content: '•'; color: #FF6B35; }
        .invite-btns { display: flex; gap: 12px; margin: 16px; }
        .invite-btn { flex: 1; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-wx { background: #07C160; color: #fff; border: none; }
        .btn-link { background: #fff; color: #FF6B35; border: 1px solid #FF6B35; }
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>
        <div class="status-bar"><span>19:53</span><div class="flex items-center gap-1"><i class="fas fa-signal text-sm"></i><i class="fas fa-wifi text-sm"></i><i class="fas fa-battery-full text-sm"></i></div></div>
        <div class="nav-bar">
            <div class="nav-back" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
            <div class="nav-title">邀请好友</div>
            <div class="nav-right"><i class="fas fa-ellipsis-h"></i></div>
        </div>
        <div class="overflow-y-auto" style="height: calc(100% - 97px - 16px);">
            <div class="banner">
                <div class="banner-icon"><i class="fas fa-gift"></i></div>
                <div class="banner-title">邀请好友 各得50元</div>
                <div class="banner-desc">好友成功注册并完成第一单，您和好友各得50元奖励</div>
            </div>
            <div class="reward-row">
                <div class="reward-item"><div class="reward-amount">50</div><div class="reward-label">邀请奖励(元)</div></div>
                <div class="reward-item"><div class="reward-amount">12</div><div class="reward-label">已邀请人数</div></div>
                <div class="reward-item"><div class="reward-amount">¥600</div><div class="reward-label">累计奖励</div></div>
            </div>
            <div class="rule-card">
                <div class="rule-title">活动规则</div>
                <div class="rule-item">邀请好友注册快马日结平台</div>
                <div class="rule-item">好友完成第一单日结后，双方各得50元奖励</div>
                <div class="rule-item">奖励直接进入账户余额，可用于平台消费</div>
                <div class="rule-item">本活动长期有效，多邀多得，上不封顶</div>
                <div class="rule-item">如有作弊行为，平台有权取消奖励资格</div>
            </div>
            <div class="invite-btns">
                <button class="invite-btn btn-wx" onclick="alert('调起微信分享')"><i class="fab fa-weixin"></i>微信分享</button>
                <button class="invite-btn btn-link" onclick="alert('复制邀请链接')"><i class="fas fa-link"></i>复制链接</button>
            </div>
        </div>
        <div class="page-indicator"></div>
    </div>
    <script>function goBack(){window.history.back();}</script>
</body>
</html>
