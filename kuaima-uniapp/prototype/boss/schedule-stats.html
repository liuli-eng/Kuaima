<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>招工统计 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame {
            width: 390px; height: 844px; background: #f5f5f5; overflow: hidden;
            position: relative; border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
        }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }
        .nav-bar { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #fff; }
        .nav-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #333; cursor: pointer; }
        .nav-title { font-size: 17px; font-weight: 600; color: #333; }
        .nav-right { display: flex; gap: 14px; color: #333; font-size: 16px; cursor: pointer; }

        .date-tabs { display: flex; background: linear-gradient(135deg, #FFD700, #FFA500); padding: 16px 12px 20px; gap: 8px; overflow-x: auto; }
        .date-tabs::-webkit-scrollbar { display: none; }
        .date-tab { flex: 1; min-width: 70px; background: rgba(255,255,255,0.9); border-radius: 10px; padding: 10px 8px; text-align: center; cursor: pointer; }
        .date-tab .day { font-size: 14px; font-weight: 600; color: #333; }
        .date-tab .date { font-size: 11px; color: #999; margin-top: 2px; }
        .date-tab .demand { font-size: 11px; color: #FF6B35; margin-top: 4px; }
        .date-tab.active { background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .date-tab.active .day { color: #FF6B35; }

        .content-area { margin-top: -8px; background: #f5f5f5; border-radius: 16px 16px 0 0; padding: 16px; position: relative; }

        .stats-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .stats-title { font-size: 15px; font-weight: 600; color: #333; }
        .filter-btn { display: flex; align-items: center; gap: 4px; font-size: 13px; color: #FF6B35; cursor: pointer; }
        .filter-btn i { font-size: 10px; }

        .stats-list { background: #fff; border-radius: 12px; overflow: hidden; }
        .stats-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid #f5f5f5; }
        .stats-item:last-child { border-bottom: none; }
        .stats-label { font-size: 14px; color: #666; }
        .stats-value { font-size: 18px; font-weight: 600; color: #333; }

        .bottom-slogan { text-align: center; padding: 40px 16px 20px; }
        .slogan-title { font-size: 28px; font-weight: 800; color: #E8D5B7; letter-spacing: 4px; }
        .slogan-desc { font-size: 13px; color: #ccc; margin-top: 6px; }

        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
        .scroll-area { position: absolute; top: 97px; left: 0; right: 0; bottom: 0; overflow-y: auto; }
        .scroll-area::-webkit-scrollbar { display: none; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>
        <div class="status-bar"><span>19:53</span><div class="flex items-center gap-1"><i class="fas fa-signal text-sm"></i><i class="fas fa-wifi text-sm"></i><i class="fas fa-battery-full text-sm"></i></div></div>
        <div class="nav-bar">
            <div class="nav-back" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
            <div class="nav-title">招工统计</div>
            <div class="nav-right"><i class="fas fa-ellipsis-h"></i></div>
        </div>
        <div class="scroll-area">
            <div class="date-tabs" id="dateTabs">
                <div class="date-tab active" onclick="switchDate(this)">
                    <div class="day">周四</div>
                    <div class="date">20</div>
                    <div class="demand">需求0</div>
                </div>
                <div class="date-tab" onclick="switchDate(this)">
                    <div class="day">周五</div>
                    <div class="date">21</div>
                    <div class="demand">需求0</div>
                </div>
                <div class="date-tab" onclick="switchDate(this)">
                    <div class="day">周六</div>
                    <div class="date">22</div>
                    <div class="demand">需求0</div>
                </div>
                <div class="date-tab" onclick="switchDate(this)">
                    <div class="day">周日</div>
                    <div class="date">23</div>
                    <div class="demand">需求0</div>
                </div>
            </div>
            <div class="content-area">
                <div class="stats-header">
                    <div class="stats-title">需求人数 0</div>
                    <div class="filter-btn" onclick="alert('筛选统计维度')">
                        <span>筛选</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
                <div class="stats-list">
                    <div class="stats-item">
                        <span class="stats-label">接单</span>
                        <span class="stats-value">0</span>
                    </div>
                    <div class="stats-item">
                        <span class="stats-label">到达</span>
                        <span class="stats-value">0</span>
                    </div>
                    <div class="stats-item">
                        <span class="stats-label">开工</span>
                        <span class="stats-value">0</span>
                    </div>
                    <div class="stats-item">
                        <span class="stats-label">完工</span>
                        <span class="stats-value">0</span>
                    </div>
                    <div class="stats-item">
                        <span class="stats-label">结算</span>
                        <span class="stats-value">0</span>
                    </div>
                </div>
                <div class="bottom-slogan">
                    <div class="slogan-title">招临时工 上快马日结</div>
                    <div class="slogan-desc">— 熟练工 上岗快 人靠谱 —</div>
                </div>
            </div>
        </div>
        <div class="page-indicator"></div>
    </div>

    <script>
        function switchDate(el) {
            document.querySelectorAll('.date-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }

        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
