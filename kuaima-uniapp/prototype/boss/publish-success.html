<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>招工发布成功 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame {
            width: 390px; height: 844px; background: #FFF8E6; overflow: hidden;
            position: relative; border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
        }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }
        .page-bg { background: #FFF8E6; height: calc(100% - 47px); position: relative; display: flex; flex-direction: column; overflow: hidden; }
        .nav-bar { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; background: #fff; flex-shrink: 0; }
        .nav-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: #333; font-size: 20px; cursor: pointer; }
        .nav-right { display: flex; align-items: center; gap: 2px; }
        .nav-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }

        .scroll-area { flex: 1; overflow-y: auto; min-height: 0; background: #FFF8E6; }
        .scroll-area::-webkit-scrollbar { display: none; }

        .success-header {
            text-align: center; padding: 30px 20px 20px; background: #fff;
        }
        .success-icon {
            width: 64px; height: 64px; border-radius: 50%;
            background: linear-gradient(135deg, #52C41A, #73D13D);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 14px; color: #fff; font-size: 28px;
            box-shadow: 0 6px 20px rgba(82, 196, 26, 0.3);
        }
        .success-title { font-size: 22px; font-weight: 700; color: #333; }
        .success-desc { font-size: 14px; color: #999; margin-top: 6px; }

        .diagnosis-card {
            background: #fff; margin: 16px 12px 0; border-radius: 12px; overflow: hidden;
        }
        .diagnosis-header {
            padding: 14px 16px; background: #FFFBE6; display: flex; align-items: center; gap: 6px;
            font-size: 14px; font-weight: 500; color: #FA8C16;
        }
        .diagnosis-header i { font-size: 14px; }
        .diagnosis-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px; border-top: 1px solid #f5f5f5;
        }
        .diag-info { flex: 1; }
        .diag-title { font-size: 15px; font-weight: 500; color: #333; }
        .diag-tag {
            display: inline-block; margin-top: 6px; font-size: 12px; color: #FF6B35;
            background: #FFF3ED; padding: 3px 8px; border-radius: 4px; cursor: pointer;
        }
        .diag-tag:hover { background: #FFE8DC; }
        .diag-action {
            font-size: 14px; color: #FF6B35; display: flex; align-items: center; gap: 4px;
            cursor: pointer; flex-shrink: 0;
        }

        .preview-card {
            background: #fff; margin: 12px; border-radius: 12px; padding: 14px 16px;
        }
        .preview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .preview-title { font-size: 14px; font-weight: 500; color: #333; }
        .preview-status { font-size: 12px; color: #52C41A; }
        .preview-info { display: flex; flex-wrap: wrap; gap: 6px; }
        .preview-tag {
            font-size: 12px; color: #666; background: #F5F5F5;
            padding: 4px 10px; border-radius: 4px;
        }
        .preview-tag.highlight { background: #FFF3ED; color: #FF6B35; }

        .quick-actions {
            background: #fff; margin: 12px; border-radius: 12px; overflow: hidden;
        }
        .quick-title { padding: 12px 16px; font-size: 13px; color: #999; }
        .action-row {
            display: flex; align-items: center; padding: 14px 16px;
            border-top: 1px solid #f5f5f5; cursor: pointer;
        }
        .action-row:first-of-type { border-top: none; }
        .action-icon {
            width: 36px; height: 36px; border-radius: 8px; display: flex;
            align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
        }
        .action-icon.orange { background: #FFF3ED; color: #FF6B35; }
        .action-icon.blue { background: #EBF5FF; color: #1677FF; }
        .action-icon.green { background: #E8F8EF; color: #52C41A; }
        .action-icon.purple { background: #F3EEFB; color: #722ED1; }
        .action-icon.red { background: #FFECE8; color: #F5222D; }
        .action-info { flex: 1; margin-left: 12px; }
        .action-title { font-size: 14px; color: #333; font-weight: 500; }
        .action-desc { font-size: 12px; color: #999; margin-top: 2px; }
        .action-arrow { color: #CCC; font-size: 12px; }

        .bottom-bar {
            background: #fff; padding: 12px 16px 30px; border-top: 1px solid #f0f0f0; flex-shrink: 0;
        }
        .primary-btn {
            width: 100%; height: 48px; background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #fff; border: none; border-radius: 24px; font-size: 16px; font-weight: 600; cursor: pointer;
        }
        .secondary-btn {
            width: 100%; height: 44px; background: #fff; color: #666;
            border: 1px solid #E0E0E0; border-radius: 22px; font-size: 14px; cursor: pointer;
            margin-top: 10px;
        }

        .modal-mask {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 100;
            display: flex; align-items: flex-end; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-mask.show { opacity: 1; pointer-events: auto; }
        .modal-content {
            width: 100%; background: #fff; border-radius: 20px 20px 0 0;
            padding: 24px 20px 30px; transform: translateY(100%);
            transition: transform 0.3s ease-out;
        }
        .modal-mask.show .modal-content { transform: translateY(0); }
        .modal-title { font-size: 18px; font-weight: 600; color: #333; text-align: center; margin-bottom: 16px; }
        .modal-warnings { display: flex; flex-direction: column; gap: 12px; }
        .warning-item {
            display: flex; align-items: flex-start; gap: 8px;
            font-size: 13px; color: #666; line-height: 1.6;
        }
        .warning-item i { color: #FA8C16; font-size: 14px; margin-top: 3px; flex-shrink: 0; }
        .warning-item b { color: #333; }
        .modal-btn {
            width: 100%; height: 46px; background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #fff; border: none; border-radius: 23px; font-size: 15px; font-weight: 600; cursor: pointer;
            margin-top: 20px;
        }

        .page-indicator { width: 120px; height: 5px; background: #1a1a1a; border-radius: 3px; margin: 8px auto 0; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body>
    <div class="phone-frame">
        <div class="dynamic-island"></div>
        <div class="status-bar">
            <span>19:53</span>
            <span class="flex items-center gap-1">
                <i class="fas fa-signal text-xs"></i>
                <i class="fas fa-wifi text-xs"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </span>
        </div>
        <div class="page-bg">
            <div class="nav-bar">
                <div class="nav-back" onclick="closePage()"><i class="fas fa-chevron-left"></i></div>
                <div class="nav-right">
                    <div class="nav-btn"><i class="fas fa-ellipsis text-gray-700" style="font-size:13px;"></i></div>
                    <div style="width:1px; height:14px; background:#ddd; margin:0 2px;"></div>
                    <div class="nav-btn"><i class="fas fa-circle text-gray-700" style="font-size:11px;"></i></div>
                </div>
            </div>

            <div class="scroll-area">
                <div class="success-header">
                    <div class="success-icon"><i class="fas fa-check"></i></div>
                    <div class="success-title">招工发布成功！</div>
                    <div class="success-desc">您的岗位正在推送给零工...</div>
                </div>

                <div class="diagnosis-card">
                    <div class="diagnosis-header">
                        <i class="fas fa-lightbulb"></i>
                        <span>快马招工诊断：1个项目可优化</span>
                    </div>
                    <div class="diagnosis-item">
                        <div class="diag-info">
                            <div class="diag-title">岗位描述需完善</div>
                            <div class="diag-tag" onclick="navigateTo('task-content')">完善岗位描述 更多熟练工接单 ›</div>
                        </div>
                        <div class="diag-action" onclick="navigateTo('task-content')">
                            去填写 <i class="fas fa-chevron-right" style="font-size:10px;"></i>
                        </div>
                    </div>
                </div>

                <div class="preview-card">
                    <div class="preview-header">
                        <div class="preview-title">岗位预览</div>
                        <div class="preview-status"><i class="fas fa-clock"></i> 招聘中</div>
                    </div>
                    <div class="preview-info">
                        <span class="preview-tag highlight">普工</span>
                        <span class="preview-tag">电子厂</span>
                        <span class="preview-tag">100元/小时</span>
                        <span class="preview-tag">8小时</span>
                        <span class="preview-tag">本周五</span>
                    </div>
                </div>

                <div class="quick-actions">
                    <div class="quick-title">常用操作</div>
                    <div class="action-row" onclick="navigateTo('recruit-manager')">
                        <div class="action-icon orange"><i class="fas fa-user-friends"></i></div>
                        <div class="action-info">
                            <div class="action-title">管理报名零工</div>
                            <div class="action-desc">查看已报名人员，安排面试</div>
                        </div>
                        <i class="fas fa-chevron-right action-arrow"></i>
                    </div>
                    <div class="action-row" onclick="navigateTo('publish-info')">
                        <div class="action-icon blue"><i class="fas fa-edit"></i></div>
                        <div class="action-info">
                            <div class="action-title">编辑招工信息</div>
                            <div class="action-desc">修改岗位描述、工价等信息</div>
                        </div>
                        <i class="fas fa-chevron-right action-arrow"></i>
                    </div>
                    <div class="action-row" onclick="navigateTo('boss-order')">
                        <div class="action-icon green"><i class="fas fa-clipboard-list"></i></div>
                        <div class="action-info">
                            <div class="action-title">查看订单</div>
                            <div class="action-desc">管理已开工、结算中的订单</div>
                        </div>
                        <i class="fas fa-chevron-right action-arrow"></i>
                    </div>
                    <div class="action-row" onclick="navigateTo('service-chat')">
                        <div class="action-icon purple"><i class="fas fa-headset"></i></div>
                        <div class="action-info">
                            <div class="action-title">联系客服</div>
                            <div class="action-desc">遇到问题？我们帮您解决</div>
                        </div>
                        <i class="fas fa-chevron-right action-arrow"></i>
                    </div>
                </div>

                <div style="height: 20px;"></div>
            </div>

            <div class="bottom-bar">
                <button class="primary-btn" onclick="viewJob()">查看招工</button>
                <button class="secondary-btn" onclick="backToHome()">返回首页</button>
            </div>
        </div>

        <div class="modal-mask" id="tipModal">
            <div class="modal-content">
                <div class="modal-title">温馨提示</div>
                <div class="modal-warnings">
                    <div class="warning-item">
                        <i class="fas fa-exclamation-circle"></i>
                        <div>请注意接听零工电话！</div>
                    </div>
                    <div class="warning-item">
                        <i class="fas fa-exclamation-circle"></i>
                        <div>禁止添加零工联系方式私下交易，绕过平台等行为，否则将被封号且不退费！</div>
                    </div>
                    <div class="warning-item">
                        <i class="fas fa-exclamation-circle"></i>
                        <div>零工完工后，请立即通过平台支付报酬（禁止线下支付）！</div>
                    </div>
                </div>
                <button class="modal-btn" onclick="closeTip()">知道了</button>
            </div>
        </div>

        <div class="page-indicator"></div>
    </div>

    <script>
        let bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance", "realname", "points", "voucher", "reward", "add-address", "download-app", "personal-info", "task-content", "gender-age", "location", "recruit-demand", "invite-worker", "recruit-settings", "publish-success"];

        function navigateTo(page) {
            window.location.href = page + '.html';
        }

        function closePage() { window.history.back(); }

        function viewJob() {
            document.getElementById('tipModal').classList.add('show');
        }

        function closeTip() {
            document.getElementById('tipModal').classList.remove('show');
            setTimeout(() => {
                location.href = 'boss-order.html';
            }, 300);
        }

        function backToHome() {
            location.href = 'boss-home.html';
        }

        window.onload = function() {
            setTimeout(() => {
                document.getElementById('tipModal').classList.add('show');
            }, 800);
        };
    </script>
</body>
</html>
