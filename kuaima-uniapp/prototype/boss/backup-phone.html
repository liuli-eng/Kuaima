<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系电话设置 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame {
            width: 390px; height: 844px; background: #FFF8E6; overflow: hidden;
            position: relative; border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
        }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }
        .page-bg { background: #fff; height: calc(100% - 47px); position: relative; display: flex; flex-direction: column; overflow: hidden; }
        .nav-bar { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; background: #fff; flex-shrink: 0; }
        .nav-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: #333; font-size: 20px; cursor: pointer; }
        .nav-title { font-size: 17px; font-weight: 700; color: #333; }
        .nav-placeholder { width: 32px; }

        .scroll-area { flex: 1; overflow-y: auto; background: #F7F8FA; min-height: 0; }
        .scroll-area::-webkit-scrollbar { display: none; }

        .section-card {
            background: #fff; margin: 12px; border-radius: 12px; padding: 16px;
        }
        .section-title {
            font-size: 13px; color: #999; margin-bottom: 10px; font-weight: 500;
        }

        .phone-item {
            display: flex; align-items: center; padding: 12px 0;
            border-bottom: 1px solid #f5f5f5; gap: 12px;
        }
        .phone-item:last-child { border-bottom: none; }
        .phone-icon {
            width: 40px; height: 40px; border-radius: 10px;
            background: #EBF5FF; color: #1E88E5;
            display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
        }
        .phone-icon.primary { background: #FFF3ED; color: #FF6B35; }
        .phone-info { flex: 1; }
        .phone-number { font-size: 16px; font-weight: 600; color: #333; }
        .phone-tag {
            display: inline-block; font-size: 11px; padding: 1px 6px;
            background: #FFF3ED; color: #FF6B35; border-radius: 3px; margin-left: 6px;
        }
        .phone-desc { font-size: 12px; color: #999; margin-top: 2px; }
        .phone-actions { display: flex; align-items: center; gap: 8px; }
        .phone-actions button {
            font-size: 12px; color: #1E88E5; background: none; border: none; cursor: pointer;
        }
        .phone-actions button.danger { color: #FF4D4F; }
        .phone-actions .divider { width: 1px; height: 12px; background: #e0e0e0; }

        .add-btn {
            display: flex; align-items: center; justify-content: center;
            gap: 8px; padding: 14px; background: #fff;
            margin: 12px; border-radius: 12px;
            border: 1px dashed #ccc; color: #1E88E5; font-size: 15px; font-weight: 500; cursor: pointer;
        }
        .add-btn:hover { background: #EBF5FF; }

        .tip-box {
            background: #FFF8E6; margin: 0 12px 12px; border-radius: 12px;
            padding: 12px 14px; display: flex; gap: 8px;
        }
        .tip-box i { color: #FF6B35; margin-top: 2px; }
        .tip-box span { font-size: 12px; color: #666; line-height: 1.6; }

        .bottom-btn {
            flex-shrink: 0; padding: 12px 16px 34px; background: #fff;
        }
        .btn-save {
            width: 100%; height: 48px; background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #fff; border: none; border-radius: 24px; font-size: 16px; font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 165, 0, 0.3);
        }

        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center; z-index: 100;
        }
        .modal-content {
            width: 320px; background: #fff; border-radius: 16px; padding: 20px;
        }
        .modal-title { font-size: 17px; font-weight: 600; text-align: center; margin-bottom: 16px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; }
        .form-group input {
            width: 100%; padding: 10px 12px; border: 1px solid #ddd;
            border-radius: 8px; font-size: 15px; outline: none;
        }
        .form-group input:focus { border-color: #1E88E5; }
        .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
        .modal-actions button {
            flex: 1; height: 42px; border-radius: 21px; font-size: 15px; font-weight: 500; cursor: pointer; border: none;
        }
        .btn-cancel { background: #f5f5f5; color: #666; }
        .btn-confirm { background: linear-gradient(135deg, #FFD700, #FFA500); color: #fff; }

        .hidden { display: none !important; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body>
    <div class="phone-frame" style="margin: 20px auto;">
        <div class="dynamic-island"></div>
        <div class="status-bar">
            <span>19:53</span>
            <span>📶 🔋</span>
        </div>
        <div class="page-bg">
            <div class="nav-bar">
                <div class="nav-back" onclick="history.back()"><i class="fas fa-arrow-left"></i></div>
                <div class="nav-title">联系电话设置</div>
                <div class="nav-placeholder"></div>
            </div>

            <div class="scroll-area">
                <div class="section-card">
                    <div class="section-title">主要联系电话</div>
                    <div class="phone-item">
                        <div class="phone-icon primary"><i class="fas fa-phone"></i></div>
                        <div class="phone-info">
                            <div class="phone-number">13698756321 <span class="phone-tag">主</span></div>
                            <div class="phone-desc">零工电话报名、问路等</div>
                        </div>
                    </div>
                </div>

                <div class="section-card">
                    <div class="section-title">备用联系电话 <span style="color:#FF4D4F;">*</span>（最多添加3个）</div>
                    <div id="phoneList">
                        <div class="phone-item">
                            <div class="phone-icon"><i class="fas fa-phone-alt"></i></div>
                            <div class="phone-info">
                                <div class="phone-number">13888888888</div>
                                <div class="phone-desc">备用联系人：张先生</div>
                            </div>
                            <div class="phone-actions">
                                <button onclick="editPhone(0)">编辑</button>
                                <div class="divider"></div>
                                <button class="danger" onclick="deletePhone(0)">删除</button>
                            </div>
                        </div>
                        <div class="phone-item">
                            <div class="phone-icon"><i class="fas fa-phone-alt"></i></div>
                            <div class="phone-info">
                                <div class="phone-number">13666666666</div>
                                <div class="phone-desc">备用联系人：李女士</div>
                            </div>
                            <div class="phone-actions">
                                <button onclick="editPhone(1)">编辑</button>
                                <div class="divider"></div>
                                <button class="danger" onclick="deletePhone(1)">删除</button>
                            </div>
                        </div>
                    </div>
                    <div class="add-btn" id="addBtn" onclick="openAddModal()">
                        <i class="fas fa-plus"></i> 添加备用联系电话
                    </div>
                </div>

                <div class="tip-box">
                    <i class="fas fa-info-circle"></i>
                    <span>备用电话用于零工无法联系时的补充沟通，确保招工信息传达顺畅。</span>
                </div>
            </div>

            <div class="bottom-btn">
                <button class="btn-save" onclick="saveAndReturn()">保存设置</button>
            </div>
        </div>

        <div class="modal hidden" id="phoneModal">
            <div class="modal-content">
                <div class="modal-title" id="modalTitle">添加备用联系电话</div>
                <div class="form-group">
                    <label>联系人姓名</label>
                    <input type="text" id="contactName" placeholder="请输入姓名">
                </div>
                <div class="form-group">
                    <label>手机号码</label>
                    <input type="tel" id="contactPhone" placeholder="请输入11位手机号" maxlength="11">
                </div>
                <div class="modal-actions">
                    <button class="btn-cancel" onclick="closeModal()">取消</button>
                    <button class="btn-confirm" onclick="savePhone()">保存</button>
                </div>
            </div>
        </div>

        <div class="modal hidden" id="deleteModal">
            <div class="modal-content">
                <div class="modal-title">确认删除</div>
                <div style="text-align:center; font-size:14px; color:#666; margin-bottom:16px;">
                    删除后该备用联系人将无法接收零工相关通知
                </div>
                <div class="modal-actions">
                    <button class="btn-cancel" onclick="closeDeleteModal()">取消</button>
                    <button class="btn-confirm" style="background:linear-gradient(135deg,#FF6B35,#FF4D4F);" onclick="confirmDelete()">确认删除</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let phoneList = [
            { name: '张先生', phone: '13888888888' },
            { name: '李女士', phone: '13666666666' }
        ];
        let editingIndex = -1;
        let deletingIndex = -1;

        function renderList() {
            const list = document.getElementById('phoneList');
            const addBtn = document.getElementById('addBtn');

            if (phoneList.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding:20px; color:#999; font-size:13px;">暂无备用联系人</div>';
                addBtn.style.display = 'flex';
                return;
            }

            list.innerHTML = phoneList.map((p, i) => `
                <div class="phone-item">
                    <div class="phone-icon"><i class="fas fa-phone-alt"></i></div>
                    <div class="phone-info">
                        <div class="phone-number">${p.phone}</div>
                        <div class="phone-desc">备用联系人：${p.name}</div>
                    </div>
                    <div class="phone-actions">
                        <button onclick="editPhone(${i})">编辑</button>
                        <div class="divider"></div>
                        <button class="danger" onclick="deletePhone(${i})">删除</button>
                    </div>
                </div>
            `).join('');

            if (phoneList.length >= 3) {
                addBtn.style.display = 'none';
            } else {
                addBtn.style.display = 'flex';
            }
        }

        function openAddModal() {
            editingIndex = -1;
            document.getElementById('modalTitle').textContent = '添加备用联系电话';
            document.getElementById('contactName').value = '';
            document.getElementById('contactPhone').value = '';
            document.getElementById('phoneModal').classList.remove('hidden');
        }

        function editPhone(index) {
            editingIndex = index;
            const p = phoneList[index];
            document.getElementById('modalTitle').textContent = '编辑联系电话';
            document.getElementById('contactName').value = p.name;
            document.getElementById('contactPhone').value = p.phone;
            document.getElementById('phoneModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('phoneModal').classList.add('hidden');
        }

        function savePhone() {
            const name = document.getElementById('contactName').value.trim();
            const phone = document.getElementById('contactPhone').value.trim();

            if (!name) { alert('请输入联系人姓名'); return; }
            if (!/^1\d{10}$/.test(phone)) { alert('请输入正确的手机号'); return; }

            if (editingIndex >= 0) {
                phoneList[editingIndex] = { name, phone };
            } else {
                if (phoneList.length >= 3) { alert('最多添加3个备用联系人'); return; }
                phoneList.push({ name, phone });
            }

            renderList();
            closeModal();
        }

        function deletePhone(index) {
            deletingIndex = index;
            document.getElementById('deleteModal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
        }

        function confirmDelete() {
            if (deletingIndex >= 0) {
                phoneList.splice(deletingIndex, 1);
                renderList();
            }
            closeDeleteModal();
        }

        function saveAndReturn() {
            sessionStorage.setItem('backupPhones', JSON.stringify(phoneList));
            alert('保存成功');
            setTimeout(() => {
                if (document.referrer) {
                    history.back();
                } else {
                    location.href = 'recruit-demand.html';
                }
            }, 500);
        }

        renderList();
    </script>
</body>
</html>
