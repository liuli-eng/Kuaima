<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择工种 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame {
            width: 390px; height: 844px; background: #fff; overflow: hidden;
            position: relative; border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
        }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }
        
        /* 导航栏 */
        .nav-bar {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: #fff;
        }
        .nav-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #333; cursor: pointer; }
        .nav-title { font-size: 17px; font-weight: 600; color: #333; }
        .nav-right { display: flex; gap: 14px; color: #333; font-size: 16px; cursor: pointer; }
        
        /* 内容区 */
        .content { padding: 16px; }
        
        .page-title {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 4px;
        }
        .page-desc {
            font-size: 13px;
            color: #999;
            margin-bottom: 16px;
        }
        
        /* 搜索框 */
        .search-box {
            display: flex;
            align-items: center;
            background: #f5f5f5;
            border-radius: 24px;
            padding: 12px 18px;
            margin-bottom: 24px;
        }
        .search-box i { color: #999; margin-right: 10px; font-size: 14px; }
        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 14px;
        }
        .search-box input::placeholder { color: #999; }
        
        /* 热门工种 */
        .section-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 14px;
        }
        .section-header i { color: #FF6B35; font-size: 14px; }
        .section-header span { font-size: 16px; font-weight: 600; color: #333; }
        
        .hot-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .hot-item {
            background: #F8F8F8;
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            font-size: 14px;
            color: #333;
            cursor: pointer;
            transition: all 0.2s;
        }
        .hot-item:hover {
            background: #FFF3ED;
            color: #FF6B35;
        }
        
        /* 查看全部 */
        .view-all {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #FF6B35;
            cursor: pointer;
        }
        .view-all i { font-size: 12px; }
        
        /* 浮动客服按钮 */
        .float-service {
            position: absolute;
            right: 16px;
            bottom: 60px;
            width: 56px;
            height: 56px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
        }
        .float-service i { font-size: 18px; color: #FF6B35; }
        .float-service span { font-size: 10px; color: #FF6B35; margin-top: 2px; }
        
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>

        <div class="status-bar">
            <span>19:53</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>

        <!-- 导航栏 -->
        <div class="nav-bar">
            <div class="nav-back" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
            </div>
            <div class="nav-title">选择工种</div>
            <div class="nav-right">
                <i class="fas fa-ellipsis-h"></i>
            </div>
        </div>

        <!-- 内容区 -->
        <div class="content">
            <div class="page-title">要招的工种</div>
            <div class="page-desc">选对工种，平台推荐熟手</div>

            <!-- 搜索框 -->
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="填写工种名称，如&quot;普工&quot;" id="jobSearch" oninput="filterJobs()">
            </div>

            <!-- 热门工种 -->
            <div class="section-header">
                <i class="fas fa-fire"></i>
                <span>热门工种</span>
            </div>

            <div class="hot-grid" id="hotGrid">
                <div class="hot-item" onclick="selectJob('电子厂普工')">电子厂普工</div>
                <div class="hot-item" onclick="selectJob('五金厂CNC操作工')">五金厂CNC操作工</div>
                <div class="hot-item" onclick="selectJob('注塑厂注塑工')">注塑厂注塑工</div>
                <div class="hot-item" onclick="selectJob('快递分拣打包工')">快递分拣打包工</div>
                <div class="hot-item" onclick="selectJob('快递搬运装卸工')">快递搬运装卸工</div>
                <div class="hot-item" onclick="selectJob('电商分拣打包工')">电商分拣打包工</div>
                <div class="hot-item" onclick="selectJob('电商手工活')">电商手工活</div>
                <div class="hot-item" onclick="selectJob('餐饮服务员')">餐饮服务员</div>
            </div>

            <div class="view-all" onclick="viewAllJobs()">
                查看全部工种 <i class="fas fa-chevron-right"></i>
            </div>
        </div>

        <!-- 浮动客服 -->
        <div class="float-service" onclick="navigateTo('service-chat')">
            <i class="fas fa-headset"></i>
            <span>客服</span>
        </div>

        <div class="page-indicator"></div>
    </div>

    <script>
        const allJobs = [
            '电子厂普工', '五金厂CNC操作工', '注塑厂注塑工', '快递分拣打包工',
            '快递搬运装卸工', '电商分拣打包工', '电商手工活', '餐饮服务员',
            '餐饮服务员、洗碗工', '厨师/厨师助理', '酒水促销员', '营业员/收银员',
            '超市理货员', '冷库分拣员', '装配工', '包装工', '质检员', '仓管员',
            '叉车司机', '货运司机', '网约车司机', '保洁员', '保安', '物业维修工',
            '汽修学徒', '美容美发助理', '服装/家纺缝纫工', '电子维修工', '电焊工',
            '氩弧焊/气保焊', '厨师/面点师', '前台接待', '电话客服', '售后客服'
        ];

        function goBack() {
            window.history.back();
        }

        function filterJobs() {
            const val = document.getElementById('jobSearch').value.trim();
            const grid = document.getElementById('hotGrid');
            if (!val) {
                grid.innerHTML = `
                    <div class="hot-item" onclick="selectJob('电子厂普工')">电子厂普工</div>
                    <div class="hot-item" onclick="selectJob('五金厂CNC操作工')">五金厂CNC操作工</div>
                    <div class="hot-item" onclick="selectJob('注塑厂注塑工')">注塑厂注塑工</div>
                    <div class="hot-item" onclick="selectJob('快递分拣打包工')">快递分拣打包工</div>
                    <div class="hot-item" onclick="selectJob('快递搬运装卸工')">快递搬运装卸工</div>
                    <div class="hot-item" onclick="selectJob('电商分拣打包工')">电商分拣打包工</div>
                    <div class="hot-item" onclick="selectJob('电商手工活')">电商手工活</div>
                    <div class="hot-item" onclick="selectJob('餐饮服务员')">餐饮服务员</div>
                `;
                return;
            }
            const filtered = allJobs.filter(j => j.includes(val));
            if (filtered.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#999;padding:40px 0;">未找到相关工种</div>';
            } else {
                grid.innerHTML = filtered.map(j => 
                    `<div class="hot-item" onclick="selectJob('${j}')">${j}</div>`
                ).join('');
            }
        }

        function selectJob(jobName) {
            document.getElementById('jobSearch').value = jobName;
            setTimeout(() => {
                window.location.href = 'publish-info.html?job=' + encodeURIComponent(jobName);
            }, 200);
        }

        document.getElementById('jobSearch').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && this.value.trim()) {
                window.history.back();
            }
        });

        function viewAllJobs() {
            window.location.href = 'all-jobs.html';
        }

        function navigateTo(page) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance"];
            var path = page + '.html';
            if (bossPages.indexOf(page) < 0 && workerPages.indexOf(page) >= 0) {
                path = '../worker/' + path;
            } else if (bossPages.indexOf(page) < 0 && workerPages.indexOf(page) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }
    </script>
</body>
</html>
