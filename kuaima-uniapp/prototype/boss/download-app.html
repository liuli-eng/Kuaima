    <script>
        function goBack() { window.history.back(); }
        function download() { alert('开始下载...'); }
        
        function generateQR() {
            const qr = document.getElementById('qrCode');
            if (!qr) return;
            for (let i = 0; i < 121; i++) {
                const cell = document.createElement('div');
                cell.className = 'qr-cell';
                // Create a pseudo-random but consistent QR pattern
                const row = Math.floor(i / 11);
                const col = i % 11;
                
                // Position detection patterns (corners)
                const isCornerTL = row < 3 && col < 3;
                const isCornerTR = row < 3 && col > 7;
                const isCornerBL = row > 7 && col < 3;
                
                if (isCornerTL || isCornerTR || isCornerBL) {
                    cell.classList.remove('empty');
                } else if (row === 5 && col === 5) {
                    cell.classList.remove('empty');
                } else {
                    // Pseudo random pattern
                    const seed = (row * 31 + col * 17) % 10;
                    if (seed < 4) {
                        cell.classList.remove('empty');
                    } else {
                        cell.classList.add('empty');
                    }
                }
                qr.appendChild(cell);
            }
        }
        
        generateQR();
    </script>
