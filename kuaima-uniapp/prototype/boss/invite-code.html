<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邀请码 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame { width: 390px; height: 844px; background: #f5f5f5; overflow: hidden; position: relative; border-radius: 44px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a; }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }
        .nav-bar { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #fff; }
        .nav-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #333; cursor: pointer; }
        .nav-title { font-size: 17px; font-weight: 600; color: #333; }
        .code-card { background: linear-gradient(135deg, #FF6B35, #FF8C5A); margin: 20px 16px; border-radius: 16px; padding: 24px; text-align: center; color: #fff; }
        .code-label { font-size: 13px; opacity: 0.9; }
        .code-value { font-size: 28px; font-weight: 700; letter-spacing: 4px; margin: 12px 0; }
        .code-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: rgba(255,255,255,0.25); border-radius: 16px; font-size: 13px; cursor: pointer; }
        .reward-card { background: #fff; margin: 12px 16px; border-radius: 12px; padding: 16px; }
        .reward-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 12px; }
        .reward-row { display: flex; justify-content: space-around; text-align: center; }
        .reward-item .num { font-size: 22px; font-weight: 700; color: #FF6B35; }
        .reward-item .label { font-size: 12px; color: #999; margin-top: 4px; }
        .share-card { background: #fff; margin: 12px 16px; border-radius: 12px; padding: 16px; }
        .share-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 12px; }
        .share-icons { display: flex; justify-content: space-around; }
        .share-item { text-align: center; cursor: pointer; }
        .share-icon { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; margin: 0 auto 6px; }
        .share-label { font-size: 12px; color: #666; }
        .wechat { background: #E8F5E9; color: #07C160; }
        .qq { background: #E3F2FD; color: #12B7F5; }
        .weibo { background: #FCE4EC; color: #E6162D; }
        .link { background: #FFF3ED; color: #FF6B35; }
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>
        <div class="status-bar"><span>19:53</span><div class="flex items-center gap-1"><i class="fas fa-signal text-sm"></i><i class="fas fa-wifi text-sm"></i><i class="fas fa-battery-full text-sm"></i></div></div>
        <div class="nav-bar">
            <div class="nav-back" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
            <div class="nav-title">邀请码</div>
            <div style="width:32px;"></div>
        </div>
        <div class="overflow-y-auto" style="height: calc(100% - 97px - 16px);">
            <div class="code-card">
                <div class="code-label">我的邀请码</div>
                <div class="code-value">KMS8X2</div>
                <div class="code-btn" onclick="alert('复制邀请码')"><i class="fas fa-copy"></i>复制邀请码</div>
            </div>
            <div class="reward-card">
                <div class="reward-title">邀请奖励</div>
                <div class="reward-row">
                    <div class="reward-item"><div class="num">50</div><div class="label">每邀1人(元)</div></div>
                    <div class="reward-item"><div class="num">12</div><div class="label">已邀请人数</div></div>
                    <div class="reward-item"><div class="num">600</div><div class="label">累计奖励(元)</div></div>
                </div>
            </div>
            <div class="share-card">
                <div class="share-title">邀请好友</div>
                <div class="share-icons">
                    <div class="share-item" onclick="alert('微信分享')"><div class="share-icon wechat"><i class="fab fa-weixin"></i></div><div class="share-label">微信</div></div>
                    <div class="share-item" onclick="alert('QQ分享')"><div class="share-icon qq"><i class="fab fa-qq"></i></div><div class="share-label">QQ</div></div>
                    <div class="share-item" onclick="alert('微博分享')"><div class="share-icon weibo"><i class="fab fa-weibo"></i></div><div class="share-label">微博</div></div>
                    <div class="share-item" onclick="alert('复制链接')"><div class="share-icon link"><i class="fas fa-link"></i></div><div class="share-label">复制</div></div>
                </div>
            </div>
        </div>
        <div class="page-indicator"></div>
    </div>
    <script>function goBack(){window.history.back();}</script>
</body>
</html>
