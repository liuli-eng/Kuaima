<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索零工 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame {
            width: 390px; height: 844px; background: #fff; overflow: hidden;
            position: relative; border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
        }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }
        
        /* 导航栏 */
        .nav-bar {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: #fff;
        }
        .nav-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #333; cursor: pointer; }
        .nav-title { font-size: 17px; font-weight: 600; color: #333; }
        .nav-right { display: flex; gap: 14px; color: #333; font-size: 16px; cursor: pointer; }
        
        /* 搜索框 */
        .search-header {
            padding: 12px 16px;
            background: #fff;
            border-bottom: 1px solid #f5f5f5;
        }
        .search-input-wrap {
            display: flex;
            align-items: center;
            background: #f5f5f5;
            border-radius: 24px;
            padding: 10px 16px;
        }
        .search-input-wrap i { color: #999; margin-right: 8px; font-size: 14px; }
        .search-input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 14px;
        }
        .search-input::placeholder { color: #999; }
        .search-btn {
            background: linear-gradient(135deg, #FF6B35, #FF8C5A);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            margin-left: 8px;
        }
        
        /* 筛选标签行 */
        .filter-row {
            display: flex;
            padding: 12px 16px;
            gap: 16px;
            font-size: 14px;
            color: #333;
        }
        .filter-row .active { color: #FF6B35; font-weight: 500; }
        .filter-dropdown { display: flex; align-items: center; gap: 4px; }
        .filter-dropdown i { font-size: 10px; color: #999; }
        
        /* Tab标签 */
        .tabs-row {
            display: flex;
            padding: 0 16px 12px;
            gap: 20px;
            overflow-x: auto;
        }
        .tabs-row::-webkit-scrollbar { display: none; }
        .tab-item {
            font-size: 13px;
            color: #999;
            padding: 6px 12px;
            border-radius: 16px;
            white-space: nowrap;
            cursor: pointer;
        }
        .tab-item.active {
            background: #FFF3ED;
            color: #FF6B35;
            font-weight: 500;
        }
        
        /* 空状态 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 40px;
        }
        .empty-image {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #FFE4C4 0%, #FFDAB9 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin-bottom: 20px;
        }
        .empty-text {
            font-size: 15px;
            color: #999;
            margin-bottom: 8px;
        }
        .empty-desc {
            font-size: 13px;
            color: #ccc;
        }
        
        /* 底部标语 */
        .bottom-slogan {
            text-align: center;
            padding: 24px 16px;
        }
        .slogan-title {
            font-size: 28px;
            font-weight: 800;
            color: #E8D5B7;
            letter-spacing: 4px;
        }
        .slogan-desc {
            font-size: 13px;
            color: #ccc;
            margin-top: 6px;
        }
        
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>

        <div class="status-bar">
            <span>19:53</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>

        <!-- 导航栏 -->
        <div class="nav-bar">
            <div class="nav-back" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
            </div>
            <div class="nav-title">搜索零工</div>
            <div class="nav-right">
                <i class="fas fa-ellipsis-h"></i>
            </div>
        </div>

        <!-- 搜索框 -->
        <div class="search-header">
            <div class="search-input-wrap">
                <i class="fas fa-search"></i>
                <input type="text" class="search-input" placeholder="搜索姓名/身份证后4位" id="searchInput">
                <button class="search-btn" onclick="doSearch()">搜索</button>
            </div>
        </div>

        <!-- 筛选条件 -->
        <div class="filter-row" style="justify-content:space-between; padding:12px 16px 8px;">
            <span style="font-size:15px; font-weight:600; color:#333;">零工列表</span>
            <div style="display:flex; gap:16px;">
                <div class="filter-dropdown" onclick="toggleDropdown('people')">
                    <span>找人</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="filter-dropdown" onclick="toggleDropdown('date')">
                    <span>日期筛选</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
            </div>
        </div>

        <!-- Tab标签 -->
        <div class="tabs-row">
            <div class="tab-item active" onclick="switchTab(this, 'all')">全部</div>
            <div class="tab-item" onclick="switchTab(this, 'signUp')">报名 0</div>
            <div class="tab-item" onclick="switchTab(this, 'accept')">接单 0</div>
            <div class="tab-item" onclick="switchTab(this, 'arrive')">到达 0</div>
            <div class="tab-item" onclick="switchTab(this, 'working')">工作中 0</div>
            <div class="tab-item" onclick="switchTab(this, 'settle')">待结算 0</div>
        </div>

        <!-- 空状态 -->
        <div class="empty-state">
            <div class="empty-image">
                <i class="fas fa-user-search" style="color: #fff;"></i>
            </div>
            <div class="empty-text">暂无数据</div>
            <div class="empty-desc">输入零工姓名或身份证号后4位进行搜索</div>
        </div>

        <!-- 底部标语 -->
        <div class="bottom-slogan">
            <div class="slogan-title">招临时工 上快马日结</div>
            <div class="slogan-desc">— 熟练工 上岗快 人靠谱 —</div>
        </div>

        <div class="page-indicator"></div>
    </div>

    <script>
        function goBack() {
            window.history.back();
        }

        function doSearch() {
            const val = document.getElementById('searchInput').value.trim();
            if (!val) {
                alert('请输入搜索内容');
                return;
            }
            alert('搜索：' + val + '\n\n暂无匹配的零工数据');
        }

        function toggleDropdown(type) {
            if (type === 'people') {
                alert('选择找人方式：\n\n1. 按姓名搜索\n2. 按身份证号搜索\n3. 按手机号搜索');
            } else {
                alert('选择日期筛选：\n\n1. 今天\n2. 明天\n3. 本周\n4. 自定义日期');
            }
        }

        function switchTab(el, type) {
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                doSearch();
            }
        });
    </script>
</body>
</html>
