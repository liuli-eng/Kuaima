<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>筛选 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .phone-frame {
            width: 390px;
            height: 844px;
            background: #fff;
            overflow: hidden;
            position: relative;
            border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            border: 10px solid #1a1a1a;
        }
        .dynamic-island {
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 35px;
            background: #000;
            border-radius: 20px;
            z-index: 50;
        }
        .status-bar {
            height: 47px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 28px;
            font-size: 15px;
            font-weight: 600;
            color: #333;
            background: #fff;
        }
        .top-nav {
            padding: 8px 16px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
        }
        .nav-back {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .nav-title {
            font-size: 17px;
            font-weight: 600;
            color: #333;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .nav-btn {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .content-area {
            padding: 16px;
            padding-bottom: 100px;
            overflow-y: auto;
            height: calc(100% - 47px - 52px);
        }
        .filter-section {
            margin-bottom: 24px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }
        .filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .filter-option {
            padding: 8px 16px;
            background: #f5f5f5;
            border: 1px solid #e8e8e8;
            border-radius: 20px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-option.active {
            background: linear-gradient(135deg, #3B82F6, #60A5FA);
            color: #fff;
            border-color: transparent;
        }
        .filter-option:hover {
            border-color: #3B82F6;
        }
        .filter-option.active:hover {
            border-color: transparent;
        }
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: #fff;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 24px;
            z-index: 10;
            gap: 16px;
        }
        .reset-btn {
            width: 140px;
            padding: 12px;
            background: #f5f5f5;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
        }
        .confirm-btn {
            width: 140px;
            padding: 12px;
            background: linear-gradient(135deg, #3B82F6, #60A5FA);
            border: none;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
        }
        .page-indicator {
            height: 5px;
            background: #000;
            border-radius: 3px;
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 134px;
        }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>

        <!-- 状态栏 -->
        <div class="status-bar">
            <span>19:48</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>

        <!-- 顶部导航 -->
        <div class="top-nav">
            <div class="nav-back" onclick="goBack()">
                <i class="fas fa-chevron-left text-gray-700 text-lg"></i>
            </div>
            <div class="nav-title">筛选</div>
            <div class="nav-right">
                <div class="nav-btn">
                    <i class="fas fa-ellipsis text-gray-700" style="font-size: 13px;"></i>
                </div>
                <div style="width: 1px; height: 14px; background: #ddd; margin: 0 2px;"></div>
                <div class="nav-btn">
                    <i class="fas fa-circle text-gray-700" style="font-size: 11px;"></i>
                </div>
            </div>
        </div>

        <!-- 内容区 -->
        <div class="content-area">
            <!-- 招工日期 -->
            <div class="filter-section">
                <div class="section-title">招工日期</div>
                <div class="filter-options">
                    <div class="filter-option active" onclick="selectOption(this)">全部</div>
                    <div class="filter-option" onclick="selectOption(this)">今天</div>
                    <div class="filter-option" onclick="selectOption(this)">明天</div>
                    <div class="filter-option" onclick="selectOption(this)">后天</div>
                    <div class="filter-option" onclick="selectOption(this)">本周内</div>
                    <div class="filter-option" onclick="selectOption(this)">本月内</div>
                </div>
            </div>

            <!-- 工种类型 -->
            <div class="filter-section">
                <div class="section-title">工种类型</div>
                <div class="filter-options">
                    <div class="filter-option active" onclick="selectOption(this)">全部</div>
                    <div class="filter-option" onclick="selectOption(this)">餐饮服务</div>
                    <div class="filter-option" onclick="selectOption(this)">快递配送</div>
                    <div class="filter-option" onclick="selectOption(this)">仓储物流</div>
                    <div class="filter-option" onclick="selectOption(this)">制造业</div>
                    <div class="filter-option" onclick="selectOption(this)">建筑装修</div>
                    <div class="filter-option" onclick="selectOption(this)">零售促销</div>
                    <div class="filter-option" onclick="selectOption(this)">家政服务</div>
                </div>
            </div>

            <!-- 薪资范围 -->
            <div class="filter-section">
                <div class="section-title">薪资范围</div>
                <div class="filter-options">
                    <div class="filter-option active" onclick="selectOption(this)">不限</div>
                    <div class="filter-option" onclick="selectOption(this)">100元以下</div>
                    <div class="filter-option" onclick="selectOption(this)">100-200元</div>
                    <div class="filter-option" onclick="selectOption(this)">200-300元</div>
                    <div class="filter-option" onclick="selectOption(this)">300元以上</div>
                    <div class="filter-option" onclick="selectOption(this)">日结周结</div>
                </div>
            </div>

            <!-- 工作地点 -->
            <div class="filter-section">
                <div class="section-title">工作地点</div>
                <div class="filter-options">
                    <div class="filter-option active" onclick="selectOption(this)">不限</div>
                    <div class="filter-option" onclick="selectOption(this)">3公里内</div>
                    <div class="filter-option" onclick="selectOption(this)">5公里内</div>
                    <div class="filter-option" onclick="selectOption(this)">10公里内</div>
                    <div class="filter-option" onclick="selectOption(this)">同城</div>
                </div>
            </div>

            <!-- 零工经验 -->
            <div class="filter-section">
                <div class="section-title">零工经验</div>
                <div class="filter-options">
                    <div class="filter-option active" onclick="selectOption(this)">不限</div>
                    <div class="filter-option" onclick="selectOption(this)">新手可做</div>
                    <div class="filter-option" onclick="selectOption(this)">有经验优先</div>
                    <div class="filter-option" onclick="selectOption(this)">熟练工</div>
                    <div class="filter-option" onclick="selectOption(this)">技术工人</div>
                </div>
            </div>

            <!-- 性别要求 -->
            <div class="filter-section">
                <div class="section-title">性别要求</div>
                <div class="filter-options">
                    <div class="filter-option active" onclick="selectOption(this)">不限</div>
                    <div class="filter-option" onclick="selectOption(this)">男</div>
                    <div class="filter-option" onclick="selectOption(this)">女</div>
                    <div class="filter-option" onclick="selectOption(this)">男女均可</div>
                </div>
            </div>

            <!-- 特色标签 -->
            <div class="filter-section">
                <div class="section-title">特色标签</div>
                <div class="filter-options">
                    <div class="filter-option" onclick="selectOption(this)">包吃住</div>
                    <div class="filter-option" onclick="selectOption(this)">有空调</div>
                    <div class="filter-option" onclick="selectOption(this)">日结</div>
                    <div class="filter-option" onclick="selectOption(this)">可长期</div>
                    <div class="filter-option" onclick="selectOption(this)">报销路费</div>
                    <div class="filter-option" onclick="selectOption(this)">提供工具</div>
                </div>
            </div>
        </div>

        <!-- 底部操作栏 -->
        <div class="bottom-bar">
            <button class="reset-btn" onclick="resetFilter()">重置</button>
            <button class="confirm-btn" onclick="confirmFilter()">确认筛选</button>
        </div>

        <!-- 底部指示器 -->
        <div class="page-indicator"></div>
    </div>

    <script>
        function navigateTo(page) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance"];
            var path = page + '.html';
            if (bossPages.indexOf(page) < 0 && workerPages.indexOf(page) >= 0) {
                path = '../worker/' + path;
            } else if (bossPages.indexOf(page) < 0 && workerPages.indexOf(page) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }


        function goBack() {
            window.history.back();
        }

        function selectOption(el) {
            const parent = el.parentElement;
            parent.querySelectorAll('.filter-option').forEach(opt => opt.classList.remove('active'));
            el.classList.add('active');
        }

        function resetFilter() {
            document.querySelectorAll('.filter-section').forEach(section => {
                const options = section.querySelectorAll('.filter-option');
                options.forEach((opt, index) => {
                    opt.classList.remove('active');
                    if (index === 0) opt.classList.add('active');
                });
            });
        }

        function confirmFilter() {
            goBack();
        }
    </script>
</body>
</html>
