<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专属招工经理 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame { width: 390px; height: 844px; background: #f5f5f5; overflow: hidden; position: relative; border-radius: 44px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a; }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }
        .nav-bar { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #fff; }
        .nav-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #333; cursor: pointer; }
        .nav-title { font-size: 17px; font-weight: 600; color: #333; }
        .nav-right { display: flex; gap: 14px; color: #333; font-size: 16px; cursor: pointer; }
        .manager-card { background: #fff; margin: 12px 16px; border-radius: 12px; padding: 16px; }
        .manager-head { display: flex; align-items: center; gap: 12px; }
        .manager-avatar { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #FF6B35, #FF8C5A); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 20px; }
        .manager-info { flex: 1; }
        .manager-name { font-size: 16px; font-weight: 600; color: #333; }
        .manager-title { font-size: 12px; color: #FF6B35; margin-top: 2px; }
        .manager-contact { display: flex; gap: 10px; margin-top: 10px; }
        .contact-btn { flex: 1; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-phone { background: linear-gradient(135deg, #FF6B35, #FF8C5A); color: #fff; border: none; }
        .btn-chat { background: #fff; color: #666; border: 1px solid #ddd; }
        .service-list { background: #fff; margin: 12px 16px; border-radius: 12px; padding: 16px; }
        .service-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 12px; }
        .service-item { display: flex; gap: 10px; padding: 8px 0; }
        .service-icon { width: 32px; height: 32px; background: #FFF3ED; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #FF6B35; flex-shrink: 0; }
        .service-desc { font-size: 13px; color: #666; line-height: 1.5; }
        .service-desc strong { color: #333; }
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>
        <div class="status-bar"><span>19:53</span><div class="flex items-center gap-1"><i class="fas fa-signal text-sm"></i><i class="fas fa-wifi text-sm"></i><i class="fas fa-battery-full text-sm"></i></div></div>
        <div class="nav-bar">
            <div class="nav-back" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
            <div class="nav-title">专属招工经理</div>
            <div class="nav-right"><i class="fas fa-phone"></i></div>
        </div>
        <div class="overflow-y-auto" style="height: calc(100% - 97px - 16px);">
            <div class="manager-card">
                <div class="manager-head">
                    <div class="manager-avatar">李</div>
                    <div class="manager-info">
                        <div class="manager-name">李经理</div>
                        <div class="manager-title">高级客户经理 · 服务500+企业</div>
                    </div>
                </div>
                <div class="manager-contact">
                    <button class="contact-btn btn-phone" onclick="alert('拨打电话')"><i class="fas fa-phone"></i>电话</button>
                    <button class="contact-btn btn-chat" onclick="alert('发起聊天')"><i class="fas fa-comment"></i>私信</button>
                </div>
            </div>
            <div class="service-list">
                <div class="service-title">提供服务</div>
                <div class="service-item">
                    <div class="service-icon"><i class="fas fa-user-check"></i></div>
                    <div class="service-desc"><strong>岗位推荐：</strong>根据企业需求精准推荐合适零工</div>
                </div>
                <div class="service-item">
                    <div class="service-icon"><i class="fas fa-calendar-alt"></i></div>
                    <div class="service-desc"><strong>招工方案：</strong>协助制定招工计划和薪酬方案</div>
                </div>
                <div class="service-item">
                    <div class="service-icon"><i class="fas fa-headset"></i></div>
                    <div class="service-desc"><strong>全程跟踪：</strong>订单跟进、纠纷调解、结算保障</div>
                </div>
                <div class="service-item">
                    <div class="service-icon"><i class="fas fa-chart-line"></i></div>
                    <div class="service-desc"><strong>数据支持：</strong>提供行业薪资报告和用工分析</div>
                </div>
            </div>
        </div>
        <div class="page-indicator"></div>
    </div>
    <script>function goBack(){window.history.back();}</script>
</body>
</html>
