<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报酬支付明细 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame { width: 390px; height: 844px; background: #f5f5f5; overflow: hidden; position: relative; border-radius: 44px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a; }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }
        .nav-bar { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #fff; }
        .nav-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #333; cursor: pointer; }
        .nav-title { font-size: 17px; font-weight: 600; color: #333; }
        .summary-card { background: linear-gradient(135deg, #722ED1, #9254DE); margin: 12px 16px; border-radius: 12px; padding: 16px; color: #fff; }
        .summary-title { font-size: 13px; opacity: 0.9; }
        .summary-amount { font-size: 28px; font-weight: 700; margin-top: 6px; }
        .summary-period { font-size: 12px; opacity: 0.8; margin-top: 4px; }
        .record-card { background: #fff; margin: 8px 16px; border-radius: 12px; padding: 14px; }
        .record-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .record-title { font-size: 14px; font-weight: 600; color: #333; }
        .record-status { font-size: 11px; padding: 2px 8px; border-radius: 4px; }
        .status-success { color: #52C41A; background: #F6FFED; }
        .status-pending { color: #FA8C16; background: #FFF8E6; }
        .record-desc { font-size: 12px; color: #999; }
        .record-amount { font-size: 18px; font-weight: 700; color: #333; text-align: right; }
        .record-time { font-size: 11px; color: #bbb; margin-top: 4px; text-align: right; }
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>
        <div class="status-bar"><span>19:53</span><div class="flex items-center gap-1"><i class="fas fa-signal text-sm"></i><i class="fas fa-wifi text-sm"></i><i class="fas fa-battery-full text-sm"></i></div></div>

        </div>

                <div class="summary-title">累计支付报酬</div>
                <div class="summary-amount">¥12,560.00</div>
                <div class="summary-period">2026年5月23日 ~ 2026年8月21日</div>
            </div>
            <div class="record-card">
                <div class="record-head"><div class="record-title">8月工资结算</div><div class="record-status status-success">已支付</div></div>
                <div class="record-desc">结算周期：2026-08-01 至 2026-08-21</div>
                <div class="record-amount">¥3,600.00</div>
                <div class="record-time">2026-08-21 18:00 已到账</div>
            </div>
            <div class="record-card">
                <div class="record-head"><div class="record-title">7月工资结算</div><div class="record-status status-success">已支付</div></div>
                <div class="record-desc">结算周期：2026-07-01 至 2026-07-31</div>
                <div class="record-amount">¥8,960.00</div>
                <div class="record-time">2026-07-31 18:00 已到账</div>
            </div>
            <div class="record-card">
                <div class="record-head"><div class="record-title">6月工资结算</div><div class="record-status status-success">已支付</div></div>
                <div class="record-desc">结算周期：2026-06-01 至 2026-06-30</div>
                <div class="record-amount">¥0.00</div>
                <div class="record-time">无订单</div>
            </div>
        </div>
        <div class="page-indicator"></div>
    </div>
    <script>function goBack(){window.history.back();}</script>
</body>
</html>
