<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更换账号 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame { width: 390px; height: 844px; background: #f5f5f5; overflow: hidden; position: relative; border-radius: 44px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a; }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }
        .nav-bar { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #fff; }
        .nav-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #333; cursor: pointer; }
        .nav-title { font-size: 17px; font-weight: 600; color: #333; }
        .account-card { background: #fff; margin: 12px 16px; border-radius: 12px; padding: 16px; }
        .account-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 12px; }
        .account-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #f5f5f5; }
        .account-item:last-child { border-bottom: none; }
        .account-avatar { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; flex-shrink: 0; }
        .account-info { flex: 1; }
        .account-name { font-size: 14px; font-weight: 600; color: #333; }
        .account-phone { font-size: 12px; color: #999; margin-top: 2px; }
        .current-badge { font-size: 11px; color: #FF6B35; background: #FFF3ED; padding: 2px 6px; border-radius: 4px; }
        .switch-btn { padding: 6px 12px; font-size: 12px; color: #FF6B35; background: #FFF3ED; border-radius: 14px; cursor: pointer; border: none; }
        .add-btn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 14px; margin: 12px 16px; background: #fff; border: 1px dashed #ddd; border-radius: 10px; color: #666; font-size: 14px; cursor: pointer; }
        .logout-btn { margin: 24px 16px; padding: 13px; background: #fff; color: #FF4D4F; border: none; border-radius: 24px; font-size: 15px; font-weight: 500; cursor: pointer; width: calc(100% - 32px); }
        .tips { text-align: center; padding: 0 16px; font-size: 12px; color: #bbb; line-height: 1.6; }
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>
        <div class="status-bar"><span>19:53</span><div class="flex items-center gap-1"><i class="fas fa-signal text-sm"></i><i class="fas fa-wifi text-sm"></i><i class="fas fa-battery-full text-sm"></i></div></div>
        <div class="nav-bar">
            <div class="nav-back" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
            <div class="nav-title">更换账号</div>
            <div style="width:32px;"></div>
        </div>
        <div class="overflow-y-auto" style="height: calc(100% - 97px - 16px);">
            <div class="account-card">
                <div class="account-title">已登录账号</div>
                <div class="account-item">
                    <div class="account-avatar" style="background: linear-gradient(135deg, #FF6B35, #FF8C5A);">晴</div>
                    <div class="account-info">
                        <div class="account-name">晴时见禾 <span class="current-badge">当前账号</span></div>
                        <div class="account-phone">138****5678</div>
                    </div>
                </div>
                <div class="account-item">
                    <div class="account-avatar" style="background: linear-gradient(135deg, #1890FF, #40A9FF);">管</div>
                    <div class="account-info">
                        <div class="account-name">企业管理员</div>
                        <div class="account-phone">139****1234</div>
                    </div>
                    <button class="switch-btn" onclick="alert('切换到此账号')">切换</button>
                </div>
            </div>
            <div class="add-btn" onclick="alert('添加新账号')"><i class="fas fa-plus"></i>添加新账号</div>
            <button class="logout-btn" onclick="alert('退出登录')">退出登录</button>
            <div class="tips">切换账号将保留各自的订单、消息和设置数据</div>
        </div>
        <div class="page-indicator"></div>
    </div>
    <script>function goBack(){window.history.back();}</script>
</body>
</html>
