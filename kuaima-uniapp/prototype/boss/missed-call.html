    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame { width: 390px; height: 844px; background: #f5f5f5; overflow: hidden; position: relative; border-radius: 44px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a; }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }
        .nav-bar { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #fff; }
        .nav-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #333; cursor: pointer; }
        .nav-title { font-size: 17px; font-weight: 600; color: #333; }
        .nav-right { display: flex; gap: 14px; color: #333; font-size: 16px; cursor: pointer; }
        .call-item { background: #fff; margin: 12px 16px; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .call-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .call-avatar { width: 40px; height: 40px; background: linear-gradient(135deg, #FF6B35, #FF8C5A); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; }
        .call-info { flex: 1; }
        .call-name { font-size: 15px; font-weight: 600; color: #333; }
        .call-time { font-size: 12px; color: #999; }
        .call-reason { font-size: 13px; color: #666; line-height: 1.5; margin-bottom: 12px; }
        .call-actions { display: flex; gap: 10px; }
        .btn-primary { flex: 1; padding: 10px; background: linear-gradient(135deg, #FF6B35, #FF8C5A); color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-secondary { flex: 1; padding: 10px; background: #f5f5f5; color: #666; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .empty-state { text-align: center; padding: 60px 40px; }
        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        .empty-text { font-size: 15px; color: #999; }
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
    </style>
