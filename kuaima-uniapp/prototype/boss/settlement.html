<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>结算消息 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame { width: 390px; height: 844px; background: #f5f5f5; overflow: hidden; position: relative; border-radius: 44px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a; }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }
        .nav-bar { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #fff; }
        .nav-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #333; cursor: pointer; }
        .nav-title { font-size: 17px; font-weight: 600; color: #333; }
        .nav-right { display: flex; gap: 14px; color: #333; font-size: 16px; cursor: pointer; }
        .settle-card { background: linear-gradient(135deg, #722ED1, #9254DE); margin: 12px 16px; border-radius: 12px; padding: 20px; color: #fff; }
        .settle-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .settle-title { font-size: 16px; font-weight: 600; }
        .settle-status { font-size: 12px; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 10px; }
        .settle-amount { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
        .settle-info { font-size: 13px; opacity: 0.9; line-height: 1.8; }
        .settle-detail { background: #fff; margin: 12px 16px; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .detail-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 12px; }
        .detail-row { display: flex; justify-content: space-between; font-size: 13px; color: #666; padding: 8px 0; border-bottom: 1px solid #f5f5f5; }
        .detail-row:last-child { border-bottom: none; }
        .detail-row .label { color: #999; }
        .detail-row .value { color: #333; }
        .detail-row .value.money { color: #FF6B35; font-weight: 600; }
        .action-btn { margin: 16px; padding: 12px; background: linear-gradient(135deg, #FF6B35, #FF8C5A); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; width: calc(100% - 32px); }
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>
        <div class="status-bar"><span>19:53</span><div class="flex items-center gap-1"><i class="fas fa-signal text-sm"></i><i class="fas fa-wifi text-sm"></i><i class="fas fa-battery-full text-sm"></i></div></div>
        <div class="nav-bar">
            <div class="nav-back" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
            <div class="nav-title">结算消息</div>
            <div class="nav-right"><i class="fas fa-ellipsis-h"></i></div>
        </div>
        <div class="overflow-y-auto" style="height: calc(100% - 97px - 16px);">
            <div class="settle-card">
                <div class="settle-header">
                    <div class="settle-title">2026年8月结算</div>
                    <div class="settle-status">已结算</div>
                </div>
                <div class="settle-amount">¥12,560.00</div>
                <div class="settle-info">结算时间：2026-08-31 18:00</div>
                <div class="settle-info">结算周期：2026-08-01 至 2026-08-31</div>
            </div>
            <div class="settle-detail">
                <div class="detail-title">结算明细</div>
                <div class="detail-row"><span class="label">电商分拣打包工</span><span class="value">5人天 × ¥180 = <span class="money">¥900</span></span></div>
                <div class="detail-row"><span class="label">餐饮服务员</span><span class="value">3人天 × ¥150 = <span class="money">¥450</span></span></div>
                <div class="detail-row"><span class="label">快递搬运装卸工</span><span class="value">4人天 × ¥200 = <span class="money">¥800</span></span></div>
                <div class="detail-row"><span class="label">冷库分拣员</span><span class="value">2人天 × ¥220 = <span class="money">¥440</span></span></div>
                <div class="detail-row"><span class="label">装配工</span><span class="value">8人天 × ¥250 = <span class="money">¥2,000</span></span></div>
                <div class="detail-row"><span class="label">其他岗位</span><span class="value"><span class="money">¥7,970</span></span></div>
            </div>
        </div>
        <div class="page-indicator"></div>
    </div>
    <script>
        function navigateTo(pageName) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance"];
            var path = pageName + '.html';
            if (bossPages.indexOf(pageName) < 0 && workerPages.indexOf(pageName) >= 0) {
                path = '../worker/' + path;
            } else if (bossPages.indexOf(pageName) < 0 && workerPages.indexOf(pageName) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }


        function goBack(){window.history.back();}
    </script>
</body>
</html>
