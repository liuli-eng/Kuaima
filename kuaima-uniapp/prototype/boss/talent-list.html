<!DOCTYPE html>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame { width: 390px; height: 844px; background: #f5f5f5; overflow: hidden; position: relative; border-radius: 44px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a; }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }
        .nav-bar { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #fff; }
        .nav-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #333; cursor: pointer; }
        .nav-title { font-size: 17px; font-weight: 600; color: #333; }
        .nav-right { display: flex; gap: 14px; color: #333; font-size: 16px; cursor: pointer; }
        .search-bar { padding: 10px 16px; background: #fff; }
        .search-input { display: flex; align-items: center; background: #f5f5f5; border-radius: 20px; padding: 8px 14px; }
        .search-input input { flex: 1; border: none; outline: none; background: transparent; font-size: 14px; }
        .filter-tabs { display: flex; gap: 8px; padding: 0 16px 12px; background: #fff; }
        .filter-tab { padding: 6px 14px; font-size: 13px; color: #666; background: #f5f5f5; border-radius: 16px; cursor: pointer; }
        .filter-tab.active { background: #FFF3ED; color: #FF6B35; }
        .worker-card { background: #fff; margin: 8px 16px; border-radius: 12px; padding: 14px; display: flex; gap: 12px; }
        .worker-avatar { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; flex-shrink: 0; }
        .worker-info { flex: 1; }
        .worker-name { font-size: 15px; font-weight: 600; color: #333; display: flex; align-items: center; gap: 6px; }
        .worker-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #FFF3ED; color: #FF6B35; }
        .worker-meta { font-size: 12px; color: #999; margin-top: 4px; }
        .worker-skills { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
        .skill-tag { font-size: 11px; padding: 2px 8px; background: #f5f5f5; color: #666; border-radius: 4px; }
        .worker-action { display: flex; flex-direction: column; gap: 6px; justify-content: center; }
        .btn-sm { padding: 6px 12px; border-radius: 14px; font-size: 12px; font-weight: 500; cursor: pointer; border: none; }
        .btn-primary { background: linear-gradient(135deg, #FF6B35, #FF8C5A); color: #fff; }
        .btn-outline { background: #fff; color: #FF6B35; border: 1px solid #FF6B35; }
        .empty-state { text-align: center; padding: 60px 40px; }
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
