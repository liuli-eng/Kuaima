        .other-label {

        }
        .footer-info {
            text-align: center;
            padding: 20px 16px;
            font-size: 11px;
            color: #bbb;
            line-height: 1.8;
        }
    </style>

    <script>
        function navigateTo(pageName) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance", "realname", "points", "voucher", "reward", "add-address", "download-app", "personal-info"];
            var path = pageName + '.html';
            var query = '';
            var qIndex = pageName.indexOf('?');
            if (qIndex >= 0) {
                query = pageName.substring(qIndex);
                pageName = pageName.substring(0, qIndex);
            }
            path = pageName + '.html' + query;
            if (bossPages.indexOf(pageName) < 0 && workerPages.indexOf(pageName) >= 0) {
                path = '../worker/' + path;
            } else if (bossPages.indexOf(pageName) < 0 && workerPages.indexOf(pageName) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }


        function switchTab(el, tab) {
            document.querySelectorAll('.tab-item').forEach(i => {
                i.classList.remove('active');
                const iconWrap = i.querySelector('.tab-icon-wrap');
                if (iconWrap) {
                    iconWrap.style.background = '';
                    iconWrap.style.borderRadius = '';
                    iconWrap.style.width = '';
                    iconWrap.style.height = '';
                    iconWrap.style.color = '';
                    iconWrap.style.marginBottom = '';
                    iconWrap.style.boxShadow = '';
                }
            });
            el.classList.add('active');
            const activeIconWrap = el.querySelector('.tab-icon-wrap');
            if (activeIconWrap) {
                activeIconWrap.style.background = 'linear-gradient(135deg, #FF6B35, #FF8C5A)';
                activeIconWrap.style.borderRadius = '50%';
                activeIconWrap.style.width = '32px';
                activeIconWrap.style.height = '32px';
                activeIconWrap.style.color = 'white';
                activeIconWrap.style.marginBottom = '2px';
                activeIconWrap.style.boxShadow = '0 4px 10px rgba(255, 107, 53, 0.3)';
            }
            navigateTo(tab);
        }
    </script>
