<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>券包 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame {
            width: 390px; height: 844px; background: #FFF8E6; overflow: hidden;
            position: relative; border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
        }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: transparent; }
        .nav-bar { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #FFF8E6; }
        .nav-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #333; cursor: pointer; }
        .nav-title { font-size: 17px; font-weight: 600; color: #333; }
        .nav-right { display: flex; align-items: center; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); border-radius: 9999px; padding: 3px 6px; gap: 2px; }
        .nav-btn { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #555; font-size: 10px; }
        .nav-divider { width: 1px; height: 10px; background: #ddd; }
        .content { padding: 16px; height: calc(100% - 97px); overflow-y: auto; }
        .content::-webkit-scrollbar { display: none; }
        
        .summary-card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            display: flex;
            justify-content: space-around;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .summary-item { text-align: center; }
        .summary-value { font-size: 22px; font-weight: 700; color: #FF6B35; }
        .summary-label { font-size: 12px; color: #999; margin-top: 4px; }
        .summary-divider { width: 1px; background: #f0f0f0; }
        
        .tab-switch { display: flex; background: white; border-radius: 10px; padding: 4px; margin-bottom: 16px; }
        .tab-switch-item { flex: 1; text-align: center; padding: 8px; font-size: 14px; color: #666; cursor: pointer; border-radius: 8px; }
        .tab-switch-item.active { background: #FF6B35; color: white; font-weight: 600; }
        
        .coupon-list { display: flex; flex-direction: column; gap: 12px; }
        .coupon-item {
            background: white;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            position: relative;
            overflow: hidden;
        }
        .coupon-item::before {
            content: '';
            position: absolute;
            left: 80px;
            top: 0;
            bottom: 0;
            width: 1px;
            background-image: radial-gradient(circle, #ddd 3px, transparent 3px);
            background-size: 1px 8px;
        }
        .coupon-left { flex: 1; padding-right: 16px; }
        .coupon-amount { font-size: 24px; font-weight: 700; color: #FF6B35; }
        .coupon-amount sup { font-size: 14px; }
        .coupon-condition { font-size: 12px; color: #999; margin-top: 4px; }
        .coupon-name { font-size: 14px; font-weight: 500; color: #333; margin-top: 6px; }
        .coupon-expire { font-size: 11px; color: #bbb; margin-top: 4px; }
        .coupon-use {
            width: 64px;
            height: 32px;
            background: linear-gradient(135deg, #FF6B35, #FF8C5A);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            flex-shrink: 0;
        }
        .coupon-item.disabled { opacity: 0.5; }
        .coupon-item.disabled .coupon-use { background: #ccc; cursor: not-allowed; }
        
        .empty-state { text-align: center; padding: 60px 0; }
        .empty-icon { font-size: 48px; color: #ddd; margin-bottom: 12px; }
        .empty-text { font-size: 14px; color: #999; }
        
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; z-index: 10; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>
        <div class="status-bar">
            <span>19:53</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>
        <div class="nav-bar">
            <div class="nav-back" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
            </div>
            <div class="nav-title">券包</div>
            <div class="nav-right">
                <div class="nav-btn"><i class="fas fa-ellipsis"></i></div>
                <div class="nav-divider"></div>
                <div class="nav-btn"><i class="fas fa-minus"></i></div>
                <div class="nav-divider"></div>
                <div class="nav-btn"><i class="fas fa-circle"></i></div>
            </div>
        </div>
        <div class="content">
            <div class="summary-card">
                <div class="summary-item">
                    <div class="summary-value">0</div>
                    <div class="summary-label">可用券</div>
                </div>
                <div class="summary-divider"></div>
                <div class="summary-item">
                    <div class="summary-value">0</div>
                    <div class="summary-label">已使用</div>
                </div>
                <div class="summary-divider"></div>
                <div class="summary-item">
                    <div class="summary-value">0</div>
                    <div class="summary-label">已过期</div>
                </div>
            </div>
            
            <div class="tab-switch">
                <div class="tab-switch-item active" onclick="switchTab(this, 'available')">待使用</div>
                <div class="tab-switch-item" onclick="switchTab(this, 'used')">已使用</div>
                <div class="tab-switch-item" onclick="switchTab(this, 'expired')">已过期</div>
            </div>
            
            <div class="coupon-list" id="couponList">
                <div class="coupon-item">
                    <div class="coupon-left">
                        <div class="coupon-amount"><sup>¥</sup>20</div>
                        <div class="coupon-condition">满100元可用</div>
                        <div class="coupon-name">新人优惠券</div>
                        <div class="coupon-expire">有效期至 2026-12-31</div>
                    </div>
                    <button class="coupon-use" onclick="useCoupon()">去使用</button>
                </div>
                <div class="coupon-item">
                    <div class="coupon-left">
                        <div class="coupon-amount"><sup>¥</sup>50</div>
                        <div class="coupon-condition">满300元可用</div>
                        <div class="coupon-name">满减优惠券</div>
                        <div class="coupon-expire">有效期至 2026-10-31</div>
                    </div>
                    <button class="coupon-use" onclick="useCoupon()">去使用</button>
                </div>
                <div class="coupon-item disabled">
                    <div class="coupon-left">
                        <div class="coupon-amount"><sup>¥</sup>10</div>
                        <div class="coupon-condition">满50元可用</div>
                        <div class="coupon-name">限时优惠</div>
                        <div class="coupon-expire">已过期 2026-08-01</div>
                    </div>
                    <button class="coupon-use" disabled>已过期</button>
                </div>
            </div>
        </div>
        <div class="page-indicator"></div>
    </div>

    <script>
        function goBack() { window.history.back(); }
        function useCoupon() { alert('跳转发布订单页面使用优惠券'); }
        function switchTab(el, tab) {
            document.querySelectorAll('.tab-switch-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }
        function navigateTo(page) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "follow-qrcode", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "intent-personal", "intent-job", "intent-preference", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance", "realname", "points", "voucher", "reward"];
            var path = page + '.html';
            if (bossPages.indexOf(page) < 0 && workerPages.indexOf(page) >= 0) {
                path = '../worker/' + path;
            } else if (bossPages.indexOf(page) < 0 && workerPages.indexOf(page) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }
    </script>
</body>
</html>
