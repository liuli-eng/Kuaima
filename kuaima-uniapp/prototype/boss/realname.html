<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机号验证 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame {
            width: 390px; height: 844px; background: #fff; overflow: hidden;
            position: relative; border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
        }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: transparent; }
        
        .nav-bar { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #fff; position: relative; z-index: 10; }
        .nav-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #333; cursor: pointer; }
        .nav-title { font-size: 17px; font-weight: 600; color: #333; }
        .nav-right { display: flex; align-items: center; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); border-radius: 9999px; padding: 3px 6px; gap: 2px; }
        .nav-btn { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #555; font-size: 10px; }
        .nav-divider { width: 1px; height: 10px; background: #ddd; }
        
        .content { padding: 20px 20px 0; height: calc(100% - 97px); overflow-y: auto; }
        .content::-webkit-scrollbar { display: none; }
        
        .phone-icon {
            width: 72px; height: 72px; margin: 10px auto 16px;
            background: linear-gradient(135deg, #FFE4B5, #FFD966);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 24px rgba(255, 180, 50, 0.3);
        }
        .phone-icon i { font-size: 32px; color: #FF6B35; }
        
        .page-title { font-size: 22px; font-weight: 700; color: #333; text-align: center; margin-bottom: 8px; }
        .page-desc { font-size: 13px; color: #999; text-align: center; margin-bottom: 28px; line-height: 1.6; }
        
        .form-card { background: #FAFAFA; border-radius: 16px; padding: 8px 20px; margin-bottom: 24px; }
        .form-item { display: flex; align-items: center; padding: 16px 0; border-bottom: 1px solid #EFEFEF; }
        .form-item:last-of-type { border-bottom: none; }
        .form-label { font-size: 15px; color: #333; font-weight: 500; width: 70px; flex-shrink: 0; }
        .form-input { flex: 1; min-width: 0; font-size: 15px; color: #333; border: none; outline: none; background: transparent; }
        .form-input::placeholder { color: #bbb; }
        .form-input.phone { letter-spacing: 1px; }
        
        .send-code-btn {
            flex-shrink: 0;
            font-size: 13px;
            color: #FF6B35;
            font-weight: 500;
            padding: 7px 16px;
            margin-left: 8px;
            border: 1px solid #FF6B35;
            border-radius: 999px;
            cursor: pointer;
            background: transparent;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .send-code-btn:hover { background: #FFF3EE; }
        .send-code-btn.disabled { color: #bbb; border-color: #ddd; cursor: not-allowed; background: transparent; }
        
        .verify-btn {
            width: 100%; margin-top: 32px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #fff; padding: 16px; border-radius: 28px;
            font-size: 17px; font-weight: 600; cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 180, 50, 0.4);
            border: none;
        }
        .verify-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .tip-box {
            background: #FFF8F0;
            border-radius: 12px;
            padding: 14px 16px;
            margin-top: 20px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .tip-icon {
            width: 20px; height: 20px; flex-shrink: 0;
            background: #FF6B35; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 11px; font-weight: 700;
            margin-top: 1px;
        }
        .tip-text { font-size: 12px; color: #666; line-height: 1.7; }
        .tip-text a { color: #FF6B35; cursor: pointer; }
        
        .agreement { display: flex; align-items: flex-start; justify-content: center; margin-top: 20px; gap: 6px; }
        .checkbox-custom { width: 16px; height: 16px; border: 2px solid #ddd; border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; cursor: pointer; }
        .checkbox-custom.checked { background: #FF6B35; border-color: #FF6B35; }
        .checkbox-custom.checked::after { content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900; color: #fff; font-size: 10px; }
        .agreement-text { font-size: 12px; color: #999; line-height: 1.6; }
        .agreement-text a { color: #FF6B35; cursor: pointer; }
        
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; z-index: 10; }
        
        .code-input-wrap {
            display: flex; gap: 10px; margin-top: 8px; justify-content: center;
        }
        .code-box {
            width: 44px; height: 52px;
            background: #FAFAFA; border: 1.5px solid #E0E0E0; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: 600; color: #333;
            transition: border-color 0.2s;
        }
        .code-box.filled { border-color: #FF6B35; }
        .code-box.active { border-color: #FF6B35; box-shadow: 0 0 0 3px rgba(255,107,53,0.1); }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>
        <div class="status-bar">
            <span>19:53</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>
        
        <div class="nav-bar">
            <div class="nav-back" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
            </div>
            <div class="nav-title">手机号验证</div>
            <div class="nav-right">
                <div class="nav-btn"><i class="fas fa-ellipsis"></i></div>
                <div class="nav-divider"></div>
                <div class="nav-btn"><i class="fas fa-minus"></i></div>
                <div class="nav-divider"></div>
                <div class="nav-btn"><i class="fas fa-circle"></i></div>
            </div>
        </div>
        
        <div class="content">
            <div class="phone-icon">
                <i class="fas fa-mobile-alt"></i>
            </div>
            
            <div class="page-title">验证手机号</div>
            <div class="page-desc">为了保障您的账户安全，需要验证<br>您绑定的手机号 138****5678</div>
            
            <div class="form-card">
                <div class="form-item">
                    <div class="form-label">手机号</div>
                    <input type="tel" class="form-input phone" value="138 **** 5678" maxlength="13" readonly>
                </div>
                <div class="form-item">
                    <div class="form-label">验证码</div>
                    <input type="text" class="form-input" id="codeInput" placeholder="请输入6位验证码" maxlength="6" oninput="onCodeInput(this)">
                    <button class="send-code-btn" id="sendCodeBtn" onclick="sendCode()">获取验证码</button>
                </div>
            </div>

            <div class="code-input-wrap">
                <div class="code-box" id="box0"></div>
                <div class="code-box" id="box1"></div>
                <div class="code-box" id="box2"></div>
                <div class="code-box" id="box3"></div>
                <div class="code-box" id="box4"></div>
                <div class="code-box" id="box5"></div>
            </div>
            
            <button class="verify-btn" id="verifyBtn" onclick="doVerify()" disabled>确 认 验 证</button>

            <div class="tip-box">
                <div class="tip-icon">!</div>
                <div class="tip-text">
                    未收到短信？请检查手机号码是否正确，或尝试稍后再获取。
                </div>
            </div>
            
            <div class="agreement">
                <div class="checkbox-custom" id="agreementCheck" onclick="toggleAgreement(this)"></div>
                <div class="agreement-text">
                    您已阅读并同意<a onclick="event.stopPropagation(); navigateTo('user-agreement')">《快马日结隐私政策》</a>
                </div>
            </div>
        </div>
        
        <div class="page-indicator"></div>
    </div>

    <script>
        var countdown = 0;
        var countdownTimer = null;
        var codeValue = '';

        function goBack() { window.history.back(); }
        
        function toggleAgreement(el) { el.classList.toggle('checked'); }

        function sendCode() {
            if (countdown > 0) return;
            countdown = 60;
            var btn = document.getElementById('sendCodeBtn');
            btn.classList.add('disabled');
            btn.textContent = countdown + 's 后重试';
            countdownTimer = setInterval(function() {
                countdown--;
                if (countdown <= 0) {
                    clearInterval(countdownTimer);
                    btn.classList.remove('disabled');
                    btn.textContent = '重新获取';
                    countdown = 0;
                } else {
                    btn.textContent = countdown + 's 后重试';
                }
            }, 1000);
            alert('验证码已发送至 138****5678');
        }

        function sendVoiceCode() {
            alert('语音验证码即将拨打，请接听来电');
        }

        function onCodeInput(input) {
            var val = input.value.replace(/\D/g, '').slice(0, 6);
            input.value = val;
            codeValue = val;
            updateCodeBoxes();
            checkVerifyBtn();
        }

        function updateCodeBoxes() {
            for (var i = 0; i < 6; i++) {
                var box = document.getElementById('box' + i);
                box.textContent = codeValue[i] || '';
                box.className = 'code-box' + (codeValue.length > i ? ' filled' : '');
            }
        }

        function checkVerifyBtn() {
            var btn = document.getElementById('verifyBtn');
            btn.disabled = codeValue.length !== 6;
        }

        function doVerify() {
            if (!document.getElementById('agreementCheck').classList.contains('checked')) {
                alert('请先阅读并同意隐私政策'); return;
            }
            if (codeValue.length !== 6) {
                alert('请输入6位验证码'); return;
            }
            alert('验证成功！');
        }
        
        function navigateTo(page) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "follow-qrcode", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "intent-personal", "intent-job", "intent-preference", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance", "realname"];
            var path = page + '.html';
            if (bossPages.indexOf(page) < 0 && workerPages.indexOf(page) >= 0) {
                path = '../worker/' + path;
            } else if (bossPages.indexOf(page) < 0 && workerPages.indexOf(page) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }
    </script>
</body>
</html>
