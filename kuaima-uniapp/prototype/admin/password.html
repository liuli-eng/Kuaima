<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快马日结 - 修改密码</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
    <style>
        .password-container {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
            align-items: start;
        }
        .password-card {
            background: #fff;
            border-radius: 16px;
            padding: 36px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .password-tips {
            background: linear-gradient(135deg, #FFF8E6 0%, #FFF3D6 100%);
            border: 1px solid #FDE68A;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 28px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .password-tips-icon {
            width: 36px;
            height: 36px;
            background: rgba(245,158,11,0.15);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #F59E0B;
            flex-shrink: 0;
            font-size: 16px;
        }
        .password-tips-content {
            flex: 1;
        }
        .password-tips-title {
            font-size: 14px;
            font-weight: 600;
            color: #92400E;
            margin-bottom: 6px;
        }
        .password-tips-list {
            font-size: 13px;
            color: #B45309;
            line-height: 1.8;
        }
        .password-input-wrap {
            position: relative;
        }
        .password-input-wrap .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #9CA3AF;
            font-size: 15px;
        }
        .password-input {
            width: 100%;
            height: 48px;
            padding: 0 48px 0 46px;
            border: 1px solid #E5E7EB;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            background: #F9FAFB;
        }
        .password-input:focus {
            border-color: #FF6B35;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(255,107,53,0.1);
        }
        .password-input-wrap .toggle-pwd {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9CA3AF;
            font-size: 15px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px;
        }
        .password-strength {
            margin-top: 12px;
        }
        .strength-bar {
            height: 6px;
            background: #E5E7EB;
            border-radius: 3px;
            overflow: hidden;
            display: flex;
            gap: 3px;
        }
        .strength-bar span {
            flex: 1;
            border-radius: 3px;
            transition: all 0.3s;
        }
        .strength-bar.weak span:nth-child(1) { background: #EF4444; }
        .strength-bar.medium span:nth-child(1),
        .strength-bar.medium span:nth-child(2) { background: #F59E0B; }
        .strength-bar.strong span { background: #10B981; }
        .strength-text {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
        }
        .strength-text strong {
            font-weight: 600;
        }
        .strength-text.weak strong { color: #EF4444; }
        .strength-text.medium strong { color: #F59E0B; }
        .strength-text.strong strong { color: #10B981; }
        .password-confirm {
            background: #F0FDF4;
            border: 1px solid #BBF7D0;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
            color: #166534;
            margin-top: 12px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .password-confirm.show {
            display: flex;
        }
        .login-history {
            background: #fff;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            position: sticky;
            top: 20px;
        }
        .login-history-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .login-history-title i {
            color: var(--primary);
        }
        .login-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }
        .login-item:last-child {
            border-bottom: none;
        }
        .login-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .login-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .login-icon.success { background: #ECFDF5; color: #10B981; }
        .login-icon.danger { background: #FEF2F2; color: #EF4444; }
        .login-info-text .login-loc {
            font-size: 14px;
            font-weight: 500;
        }
        .login-info-text .login-detail {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .login-status {
            font-size: 12px;
        }
        .login-status.success { color: #10B981; }
        .login-status.danger { color: #EF4444; }
        @media (max-width: 1024px) {
            .password-container {
                grid-template-columns: 1fr;
            }
            .login-history {
                position: static;
            }
        }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="admin-layout">
    <div class="admin-sidebar"></div>
    <div class="admin-main">
        <div class="admin-topbar"></div>
        <div class="admin-content">
            <div class="page-header">
                <h1 class="page-title">修改密码</h1>
                <p class="page-desc">定期修改密码有助于保障账户安全</p>
            </div>

            <div class="password-container">
                <div class="password-card">
                    <div class="password-tips">
                        <div class="password-tips-icon">
                            <i class="fas fa-shield-alt"></i>
                        </div>
                        <div class="password-tips-content">
                            <div class="password-tips-title">密码安全建议</div>
                            <div class="password-tips-list">
                                · 密码长度建议 8-20 位<br>
                                · 需包含大写字母、小写字母和数字<br>
                                · 避免使用生日、手机号等个人信息<br>
                                · 不要与其他网站使用相同密码
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">当前密码</label>
                        <div class="password-input-wrap">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" class="password-input" id="oldPwd" placeholder="请输入当前登录密码">
                            <button type="button" class="toggle-pwd" onclick="togglePwd('oldPwd', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">新密码</label>
                        <div class="password-input-wrap">
                            <i class="fas fa-key input-icon"></i>
                            <input type="password" class="password-input" id="newPwd" placeholder="请输入新密码" oninput="checkStrength(this.value)">
                            <button type="button" class="toggle-pwd" onclick="togglePwd('newPwd', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="password-strength">
                            <div class="strength-bar" id="strengthBar">
                                <span></span><span></span><span></span>
                            </div>
                            <div class="strength-text" id="strengthText">
                                <span>密码强度</span>
                                <strong id="strengthLevel">请输入密码</strong>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">确认新密码</label>
                        <div class="password-input-wrap">
                            <i class="fas fa-check-double input-icon"></i>
                            <input type="password" class="password-input" id="confirmPwd" placeholder="请再次输入新密码" oninput="checkMatch()">
                            <button type="button" class="toggle-pwd" onclick="togglePwd('confirmPwd', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="password-confirm" id="pwdMatch">
                            <i class="fas fa-check-circle"></i>
                            <span>两次输入的密码一致</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">手机验证码</label>
                        <div style="display:flex; gap:12px;">
                            <div class="password-input-wrap" style="flex:1;">
                                <i class="fas fa-mobile-alt input-icon"></i>
                                <input type="text" class="password-input" id="smsCode" placeholder="请输入手机验证码" maxlength="6">
                            </div>
                            <button type="button" class="btn btn-outline" style="width:130px; flex-shrink:0;" onclick="sendSms(this)">
                                <i class="fas fa-paper-plane"></i> 获取验证码
                            </button>
                        </div>
                    </div>

                    <div style="display:flex; gap:12px; margin-top:24px;">
                        <button class="btn btn-primary" style="padding:0 32px; height:48px;" onclick="submitChange()">
                            <i class="fas fa-check"></i> 确认修改
                        </button>
                        <button class="btn btn-outline" style="padding:0 32px; height:48px;" onclick="resetForm()">
                            重置
                        </button>
                    </div>
                </div>

                <div class="login-history">
                    <div class="login-history-title">
                        <i class="fas fa-history"></i> 最近登录记录
                    </div>
                    <div class="login-item">
                        <div class="login-info">
                            <div class="login-icon success">
                                <i class="fas fa-sign-in-alt"></i>
                            </div>
                            <div class="login-info-text">
                                <div class="login-loc">中国 · 上海</div>
                                <div class="login-detail">IP：192.168.1.105 · Chrome · 2024-03-18 09:15</div>
                            </div>
                        </div>
                        <div class="login-status success">成功</div>
                    </div>
                    <div class="login-item">
                        <div class="login-info">
                            <div class="login-icon success">
                                <i class="fas fa-sign-in-alt"></i>
                            </div>
                            <div class="login-info-text">
                                <div class="login-loc">中国 · 上海</div>
                                <div class="login-detail">IP：192.168.1.105 · Chrome · 2024-03-17 09:02</div>
                            </div>
                        </div>
                        <div class="login-status success">成功</div>
                    </div>
                    <div class="login-item">
                        <div class="login-info">
                            <div class="login-icon danger">
                                <i class="fas fa-exclamation-triangle"></i>
                            </div>
                            <div class="login-info-text">
                                <div class="login-loc">中国 · 未知</div>
                                <div class="login-detail">IP：45.87.236.19 · 未知浏览器 · 2024-03-16 22:47</div>
                            </div>
                        </div>
                        <div class="login-status danger">密码错误（已拦截）</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
    <script>
        initPageLayout();

        function togglePwd(id, btn) {
            const input = document.getElementById(id);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        function checkStrength(pwd) {
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthLevel');
            bar.className = 'strength-bar';
            if (!pwd) {
                text.textContent = '请输入密码';
                text.className = '';
                return;
            }
            let score = 0;
            if (pwd.length >= 8) score++;
            if (/[a-z]/.test(pwd) && /[A-Z]/.test(pwd)) score++;
            if (/\d/.test(pwd)) score++;
            if (/[^a-zA-Z0-9]/.test(pwd)) score++;

            if (score <= 1) {
                bar.classList.add('weak');
                text.textContent = '弱';
                text.className = 'weak';
            } else if (score <= 2) {
                bar.classList.add('medium');
                text.textContent = '中等';
                text.className = 'medium';
            } else if (score <= 3) {
                bar.classList.add('medium');
                text.textContent = '较强';
                text.className = 'medium';
            } else {
                bar.classList.add('strong');
                text.textContent = '强';
                text.className = 'strong';
            }
            checkMatch();
        }

        function checkMatch() {
            const p1 = document.getElementById('newPwd').value;
            const p2 = document.getElementById('confirmPwd').value;
            const match = document.getElementById('pwdMatch');
            if (p1 && p2) {
                if (p1 === p2) {
                    match.classList.add('show');
                } else {
                    match.classList.remove('show');
                }
            } else {
                match.classList.remove('show');
            }
        }

        function sendSms(btn) {
            let count = 60;
            const origHtml = btn.innerHTML;
            btn.disabled = true;
            btn.style.opacity = '0.7';
            btn.innerHTML = '<i class="fas fa-clock"></i> ' + count + 's 后重发';
            const timer = setInterval(() => {
                count--;
                if (count <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.style.opacity = '';
                    btn.innerHTML = origHtml;
                } else {
                    btn.innerHTML = '<i class="fas fa-clock"></i> ' + count + 's 后重发';
                }
            }, 1000);
        }

        function submitChange() {
            const oldPwd = document.getElementById('oldPwd').value;
            const newPwd = document.getElementById('newPwd').value;
            const confirmPwd = document.getElementById('confirmPwd').value;
            const smsCode = document.getElementById('smsCode').value;

            if (!oldPwd) { alert('请输入当前密码'); return; }
            if (!newPwd) { alert('请输入新密码'); return; }
            if (newPwd.length < 8) { alert('新密码至少8位'); return; }
            if (newPwd !== confirmPwd) { alert('两次输入的密码不一致'); return; }
            if (!smsCode) { alert('请输入验证码'); return; }
            if (oldPwd === newPwd) { alert('新密码不能与原密码相同'); return; }

            alert('密码修改成功！下次登录请使用新密码');
            resetForm();
        }

        function resetForm() {
            document.querySelectorAll('.password-input').forEach(i => i.value = '');
            document.getElementById('pwdMatch').classList.remove('show');
            document.getElementById('strengthBar').className = 'strength-bar';
            document.getElementById('strengthLevel').textContent = '请输入密码';
            document.getElementById('strengthLevel').className = '';
        }
    </script>
</body>
</html>
