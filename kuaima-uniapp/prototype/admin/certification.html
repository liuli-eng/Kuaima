<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快马日结 - 认证审核</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
    <style>
        .tabs {
            display: flex;
            gap: 4px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
        }
        .tab {
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }
        .tab:hover { color: var(--primary); }
        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .tab .tab-count {
            display: inline-block;
            margin-left: 6px;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 11px;
            background: var(--bg-page);
            color: var(--text-muted);
        }
        .tab.active .tab-count {
            background: var(--primary-light);
            color: var(--primary);
        }
        .cert-id-cell {
            font-family: monospace;
            color: var(--primary);
            font-weight: 500;
        }
        .type-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .type-worker { background: #EFF6FF; color: var(--secondary); }
        .type-employer { background: #FFF0EB; color: var(--primary); }
        .applicant-cell {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .applicant-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            flex-shrink: 0;
        }
        .applicant-name { font-weight: 500; font-size: 13px; }
        .applicant-sub { font-size: 12px; color: var(--text-muted); }
        .submit-time { font-size: 13px; color: var(--text-secondary); }
        .action-cell { display: flex; gap: 6px; }
        .action-cell .btn { padding: 4px 10px; font-size: 12px; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: flex-start;
            justify-content: center;
            z-index: 1000;
            padding-top: 60px;
            overflow-y: auto;
        }
        .modal-overlay.active { display: flex; }
        .modal-container {
            width: 480px;
            max-width: calc(100% - 32px);
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            overflow: hidden;
            animation: modalSlideIn 0.25s ease-out;
        }
        @keyframes modalSlideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal-close {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: none;
            background: transparent;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .modal-close:hover {
            background: var(--bg-page);
            color: var(--text-primary);
        }
        .modal-body { padding: 20px; }

        .panel-status {
            text-align: center;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .panel-status.pending { background: #FFFBEB; }
        .panel-status .status-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            font-size: 20px;
        }
        .panel-status.pending .status-icon { background: #FEF3C7; color: var(--warning); }
        .panel-status .status-text {
            font-size: 16px;
            font-weight: 600;
            color: var(--warning);
        }
        .panel-status .status-hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .detail-section-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .detail-info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        .detail-info-item { display: flex; flex-direction: column; gap: 4px; }
        .detail-info-label { font-size: 12px; color: var(--text-muted); }
        .detail-info-value { font-size: 14px; font-weight: 500; color: var(--text-primary); }
        .document-preview {
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .document-preview-header {
            background: var(--bg-page);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 500;
        }
        .document-preview-body {
            padding: 14px;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .doc-thumb {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            flex-shrink: 0;
        }
        .doc-thumb.id-front { background: linear-gradient(135deg, #3B82F6, #2563EB); }
        .doc-thumb.id-back { background: linear-gradient(135deg, #10B981, #059669); }
        .doc-info { flex: 1; }
        .doc-name { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
        .doc-meta { font-size: 12px; color: var(--text-muted); }
        .doc-view-btn {
            color: var(--primary);
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .action-buttons .btn { justify-content: center; }
        .reject-form {
            background: #FEF2F2;
            border-radius: 8px;
            padding: 14px;
            border: 1px solid #FECACA;
        }
        .reject-form-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--danger);
        }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="admin-layout">
    <div class="admin-sidebar"></div>
    <div class="admin-main">
        <div class="admin-topbar"></div>
        <div class="admin-content">
                <div class="page-header">
                    <h1 class="page-title">认证审核</h1>
                    <p class="page-desc">实名认证、企业资质审核管理</p>
                </div>

                <div class="tabs">
                    <div class="tab active" onclick="switchTab(this, 'worker')">
                        <i class="fas fa-user" style="margin-right:6px; font-size:13px;"></i>零工认证 <span class="tab-count">56</span>
                    </div>
                    <div class="tab" onclick="switchTab(this, 'employer')">
                        <i class="fas fa-building" style="margin-right:6px; font-size:13px;"></i>雇主认证 <span class="tab-count">33</span>
                    </div>
                </div>

                <div class="card">
                    <div class="filter-bar">
                        <div class="filter-item">
                            <span>审核状态</span>
                            <select id="statusFilter">
                                <option value="">全部</option>
                                <option value="pending">待审核</option>
                                <option value="approved">已通过</option>
                                <option value="rejected">已拒绝</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <span>提交时间</span>
                            <input type="date" id="dateFrom" style="width:130px;">
                            <span>至</span>
                            <input type="date" id="dateTo" style="width:130px;">
                        </div>
                        <div class="filter-item">
                            <div class="search-box" style="width:180px;">
                                <i class="fas fa-search"></i>
                                <input type="text" id="keywordSearch" placeholder="姓名搜索" style="width:180px; padding:7px 12px 7px 36px;">
                            </div>
                        </div>
                        <button class="btn btn-primary btn-sm" onclick="applyFilter()"><i class="fas fa-search"></i> 查询</button>
                        <button class="btn btn-outline btn-sm" onclick="resetFilter()"><i class="fas fa-rotate-left"></i> 重置</button>
                    </div>

                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>审核ID</th>
                                    <th>类型</th>
                                    <th>申请人</th>
                                    <th>提交时间</th>
                                    <th>审核状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="certTableBody"></tbody>
                        </table>
                    </div>

                    <div class="pagination">
                        <div class="pagination-info" id="paginationInfo">共 3,070 条审核记录，当前显示 1-8 条</div>
                        <div class="pagination-controls" id="paginationControls"></div>
                    </div>
                </div>
            </div>
        </div>

    <div class="modal-overlay" id="detailModal" onclick="closeModalBg(event)">
        <div class="modal-container" id="modalContainer">
            <div class="modal-header">
                <h3><i class="fas fa-id-card" style="color:var(--primary);"></i> 审核详情</h3>
                <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="admin.js"></script>
    <script>
        initPageLayout();

        const certData = [
            { id:'RZ20240821001', type:'worker', typeLabel:'零工', name:'张建国', phone:'138****8562', idCard:'510***********1234', gender:'男', submitTime:'2024-08-21 18:30', status:'pending', avatar:'张', avatarBg:'linear-gradient(135deg,#FF8C42,#FF6B35)', docs:[{type:'id-front',name:'身份证正面.jpg',size:'1.2MB'},{type:'id-back',name:'身份证反面.jpg',size:'1.1MB'}] },
            { id:'RZ20240821002', type:'worker', typeLabel:'零工', name:'李美丽', phone:'139****3471', idCard:'320***********5678', gender:'女', submitTime:'2024-08-21 17:15', status:'pending', avatar:'李', avatarBg:'linear-gradient(135deg,#3B82F6,#2563EB)', docs:[{type:'id-front',name:'身份证正面.jpg',size:'1.3MB'},{type:'id-back',name:'身份证反面.jpg',size:'1.0MB'}] },
            { id:'RZ20240821003', type:'employer', typeLabel:'雇主', name:'富士康科技集团', phone:'-', idCard:'91***1234', gender:'-', submitTime:'2024-08-21 15:40', status:'pending', avatar:'富', avatarBg:'linear-gradient(135deg,#10B981,#059669)', docs:[{type:'biz-license',name:'营业执照.jpg',size:'2.5MB'}] },
            { id:'RZ20240821004', type:'worker', typeLabel:'零工', name:'王小刚', phone:'136****7823', idCard:'420***********9012', gender:'男', submitTime:'2024-08-21 14:20', status:'approved', avatar:'王', avatarBg:'linear-gradient(135deg,#8B5CF6,#6D28D9)', docs:[{type:'id-front',name:'身份证正面.jpg',size:'1.1MB'},{type:'id-back',name:'身份证反面.jpg',size:'0.9MB'}] },
            { id:'RZ20240821005', type:'employer', typeLabel:'雇主', name:'顺丰速运有限公司', phone:'-', idCard:'91***5678', gender:'-', submitTime:'2024-08-21 11:05', status:'rejected', avatar:'顺', avatarBg:'linear-gradient(135deg,#F59E0B,#D97706)', docs:[{type:'biz-license',name:'营业执照.jpg',size:'2.2MB'}] },
            { id:'RZ20240821006', type:'worker', typeLabel:'零工', name:'陈大海', phone:'137****2945', idCard:'440***********3456', gender:'男', submitTime:'2024-08-21 09:30', status:'pending', avatar:'陈', avatarBg:'linear-gradient(135deg,#EC4899,#BE185D)', docs:[{type:'id-front',name:'身份证正面.jpg',size:'1.4MB'},{type:'id-back',name:'身份证反面.jpg',size:'1.2MB'}] },
            { id:'RZ20240821007', type:'worker', typeLabel:'零工', name:'刘芳', phone:'135****6781', idCard:'430***********7890', gender:'女', submitTime:'2024-08-20 18:50', status:'approved', avatar:'刘', avatarBg:'linear-gradient(135deg,#06B6D4,#0891B2)', docs:[{type:'id-front',name:'身份证正面.jpg',size:'1.0MB'},{type:'id-back',name:'身份证反面.jpg',size:'1.1MB'}] },
            { id:'RZ20240821008', type:'employer', typeLabel:'雇主', name:'肯德基餐饮管理', phone:'-', idCard:'91***9012', gender:'-', submitTime:'2024-08-20 16:15', status:'pending', avatar:'肯', avatarBg:'linear-gradient(135deg,#64748B,#475569)', docs:[{type:'biz-license',name:'营业执照.jpg',size:'2.8MB'}] }
        ];

        let currentTabType = 'worker';

        function renderTable(type, options = {}) {
            let filtered = certData;
            if (type) filtered = filtered.filter(c => c.type === type);
            if (options.status) filtered = filtered.filter(c => c.status === options.status);
            if (options.keyword) filtered = filtered.filter(c => c.name.includes(options.keyword) || c.id.toLowerCase().includes(options.keyword.toLowerCase()));
            if (options.dateFrom) filtered = filtered.filter(c => c.submitTime >= options.dateFrom);
            if (options.dateTo) filtered = filtered.filter(c => c.submitTime <= options.dateTo + ' 23:59');

            const tbody = document.getElementById('certTableBody');
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:40px; color:var(--text-muted);">暂无符合条件的数据</td></tr>`;
            } else {
                tbody.innerHTML = filtered.map((c, i) => {
                    const statusBadge = c.status === 'pending'
                        ? '<span class="status-badge warning">待审核</span>'
                        : c.status === 'approved'
                        ? '<span class="status-badge success">已通过</span>'
                        : '<span class="status-badge danger">已拒绝</span>';
    
                    const actions = c.status === 'pending'
                        ? `<div class="action-cell">
                             <button class="btn btn-primary btn-sm" onclick="event.stopPropagation(); doAudit(${certData.indexOf(c)})">审核</button>
                             <button class="btn btn-outline btn-sm" onclick="event.stopPropagation(); showDetail(${certData.indexOf(c)})">详情</button>
                           </div>`
                        : `<div class="action-cell">
                             <button class="btn btn-outline btn-sm" onclick="event.stopPropagation(); showDetail(${certData.indexOf(c)})">查看</button>
                           </div>`;
    
                    return `<tr>
                        <td class="cert-id-cell">${c.id}</td>
                        <td><span class="type-badge ${c.type === 'worker' ? 'type-worker' : 'type-employer'}">${c.typeLabel}</span></td>
                        <td>
                            <div class="applicant-cell">
                                <span class="applicant-avatar" style="background:${c.avatarBg};">${c.avatar}</span>
                                <div>
                                    <div class="applicant-name">${c.name}</div>
                                    <div class="applicant-sub">${c.phone}</div>
                                </div>
                            </div>
                        </td>
                        <td class="submit-time">${c.submitTime}</td>
                        <td>${statusBadge}</td>
                        <td>${actions}</td>
                    </tr>`;
                }).join('');
            }

            const displayCount = Math.min(filtered.length, 8);
            const totalCount = type ? (type === 'worker' ? 56 : 33) : 3070;
            document.getElementById('paginationInfo').textContent = 
                `共 ${totalCount.toLocaleString()} 条审核记录，当前显示 1-${displayCount} 条`;

            const totalPages = type ? (type === 'worker' ? Math.ceil(56 / 8) : Math.ceil(33 / 8)) : 384;
            document.getElementById('paginationControls').innerHTML = buildPagination(totalPages);

            document.querySelectorAll('.tab').forEach(t => {
                const tabType = t.getAttribute('onclick').match(/'(\w+)'/)[1];
                const count = certData.filter(c => c.type === tabType).length;
                const countEl = t.querySelector('.tab-count');
                if (countEl) countEl.textContent = count;
            });
        }

        function buildPagination(totalPages) {
            let html = '<button class="page-btn" disabled><i class="fas fa-chevron-left" style="font-size:10px;"></i></button>';
            const showPages = Math.min(totalPages, 5);
            for (let i = 1; i <= showPages; i++) {
                html += `<button class="page-btn${i === 1 ? ' active' : ''}">${i}</button>`;
            }
            if (totalPages > 5) {
                html += '<span style="color:var(--text-muted); padding:0 4px;">...</span>';
                html += `<button class="page-btn">${totalPages}</button>`;
            }
            html += '<button class="page-btn"><i class="fas fa-chevron-right" style="font-size:10px;"></i></button>';
            return html;
        }

        function showDetail(index) {
            const c = certData[index];
            const statusText = c.status === 'pending' ? '等待审核' : c.status === 'approved' ? '审核已通过' : '审核已拒绝';
            const statusColor = c.status === 'pending' ? 'var(--warning)' : c.status === 'approved' ? 'var(--success)' : 'var(--danger)';

            const docsHtml = c.docs.map(d => {
                const icon = d.type === 'id-front' ? 'fa-id-card' : d.type === 'id-back' ? 'fa-id-card' : 'fa-file-alt';
                const label = d.type === 'id-front' ? '身份证（人像面）' : d.type === 'id-back' ? '身份证（国徽面）' : '营业执照';
                const thumbClass = d.type === 'id-front' ? 'id-front' : d.type === 'id-back' ? 'id-back' : 'id-front';
                return `<div class="document-preview">
                    <div class="document-preview-header">
                        <span><i class="fas ${icon}" style="color:var(--primary); margin-right:6px;"></i>${label}</span>
                        <a class="doc-view-btn" href="javascript:void(0);"><i class="fas fa-eye"></i> 查看大图</a>
                    </div>
                    <div class="document-preview-body">
                        <div class="doc-thumb ${thumbClass}"><i class="fas ${icon}"></i></div>
                        <div class="doc-info">
                            <div class="doc-name">${d.name}</div>
                            <div class="doc-meta">${d.size} · ${c.submitTime.split(' ')[0]} 上传</div>
                        </div>
                    </div>
                </div>`;
            }).join('');

            const actionHtml = c.status === 'pending'
                ? `<div class="action-buttons">
                    <button class="btn btn-success" style="background:var(--success); color:#fff; width:100%;" onclick="approveCert(${i})">
                        <i class="fas fa-check-circle"></i> 通过审核
                    </button>
                    <button class="btn btn-danger" style="width:100%;" onclick="showRejectForm(${i})">
                        <i class="fas fa-times-circle"></i> 拒绝审核
                    </button>
                </div>
                <div id="rejectFormBox_${i}" style="display:none; margin-top:12px;">
                    <div class="reject-form">
                        <div class="reject-form-title">拒绝原因</div>
                        <select class="form-select" style="width:100%; margin-bottom:8px; font-size:13px;">
                            <option value="">请选择拒绝原因</option>
                            <option value="id_mismatch">身份证信息不匹配</option>
                            <option value="id_expired">身份证已过期</option>
                            <option value="id_unclear">证件照片不清晰</option>
                            <option value="other">其他原因</option>
                        </select>
                        <textarea class="form-textarea" placeholder="请详细说明拒绝原因（选填）" style="width:100%; min-height:50px; font-size:13px; margin-bottom:8px;"></textarea>
                        <div style="display:flex; gap:8px;">
                            <button class="btn btn-danger btn-sm" style="flex:1;" onclick="submitReject()">确认拒绝</button>
                            <button class="btn btn-outline btn-sm" onclick="hideRejectForm(${i})">取消</button>
                        </div>
                    </div>
                </div>`
                : `<div class="action-buttons">
                    <button class="btn btn-outline" style="width:100%;" onclick="closeModal()">关闭</button>
                </div>`;

            document.getElementById('modalBody').innerHTML = `
                <div class="panel-status pending" style="background:${c.status === 'pending' ? '#FFFBEB' : c.status === 'approved' ? '#ECFDF5' : '#FEF2F2'};">
                    <div class="status-icon" style="background:${c.status === 'pending' ? '#FEF3C7' : c.status === 'approved' ? '#D1FAE5' : '#FECACA'}; color:${statusColor};"><i class="fas ${c.status === 'pending' ? 'fa-clock' : c.status === 'approved' ? 'fa-check' : 'fa-times'}"></i></div>
                    <div class="status-text" style="color:${statusColor};">${statusText}</div>
                    <div class="status-hint">${c.typeLabel} · 提交于 ${c.submitTime}</div>
                </div>

                <div class="detail-section-title">申请人信息</div>
                <div class="detail-info-grid">
                    <div class="detail-info-item">
                        <span class="detail-info-label">姓名/企业</span>
                        <span class="detail-info-value">${c.name}</span>
                    </div>
                    <div class="detail-info-item">
                        <span class="detail-info-label">手机号</span>
                        <span class="detail-info-value">${c.phone}</span>
                    </div>
                    <div class="detail-info-item">
                        <span class="detail-info-label">证件号码</span>
                        <span class="detail-info-value">${c.idCard}</span>
                    </div>
                    <div class="detail-info-item">
                        <span class="detail-info-label">性别</span>
                        <span class="detail-info-value">${c.gender}</span>
                    </div>
                </div>

                <div class="detail-section-title">证件预览</div>
                ${docsHtml}

                ${actionHtml}
            `;

            document.getElementById('detailModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        function closeModalBg(e) {
            if (e.target.id === 'detailModal') closeModal();
        }

        function switchTab(el, type) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            currentTabType = type;
            renderTable(type);
        }

        function applyFilter() {
            const status = document.getElementById('statusFilter').value;
            const keyword = document.getElementById('keywordSearch').value.trim();
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;
            renderTable(currentTabType, { status, keyword, dateFrom, dateTo });
        }

        function resetFilter() {
            document.getElementById('statusFilter').value = '';
            document.getElementById('keywordSearch').value = '';
            document.getElementById('dateFrom').value = '';
            document.getElementById('dateTo').value = '';
            renderTable(currentTabType);
        }

        function doAudit(index) {
            showDetail(index);
        }

        function approveCert(index) {
            alert('审核已通过！认证信息已更新。');
            closeModal();
        }

        function showRejectForm(index) {
            const box = document.getElementById('rejectFormBox_' + index);
            if (box) box.style.display = 'block';
        }

        function hideRejectForm(index) {
            const box = document.getElementById('rejectFormBox_' + index);
            if (box) box.style.display = 'none';
        }

        function submitReject() {
            alert('已拒绝该认证申请！');
            closeModal();
        }

        renderTable('worker');
    </script>
</body>
</html>
