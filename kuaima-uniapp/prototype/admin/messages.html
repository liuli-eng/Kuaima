<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快马日结 - 消息管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
    <style>
        .tab-nav {
            display: flex;
            gap: 0;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
        }
        .tab-item {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-secondary);
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }
        .tab-item:hover {
            color: var(--primary);
        }
        .tab-item.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .tab-item .tab-badge {
            display: inline-block;
            margin-left: 6px;
            padding: 1px 7px;
            background: var(--primary);
            color: #fff;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 500;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .channel-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        .channel-inapp {
            background: #EFF6FF;
            color: var(--secondary);
        }
        .channel-sms {
            background: #FFF8E6;
            color: var(--primary);
        }
        .channel-both {
            background: #ECFDF5;
            color: var(--success);
        }
        .action-btns {
            display: flex;
            gap: 6px;
        }
        .action-btns .btn {
            padding: 4px 10px;
            font-size: 12px;
        }
        .template-name {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .template-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-light);
            color: var(--primary);
            flex-shrink: 0;
        }
        .template-icon.blue {
            background: #EFF6FF;
            color: var(--secondary);
        }
        .template-icon.green {
            background: #ECFDF5;
            color: var(--success);
        }
        .template-icon.yellow {
            background: #FFFBEB;
            color: var(--warning);
        }
        .template-icon.purple {
            background: #F3E8FF;
            color: #8B5CF6;
        }
        .template-info {
            display: flex;
            flex-direction: column;
        }
        .template-info .name {
            font-weight: 500;
            font-size: 14px;
        }
        .template-info .event {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .add-btn-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .msg-preview-btn {
            color: var(--primary);
            cursor: pointer;
            font-size: 12px;
            margin-left: 4px;
        }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="admin-layout">
    <div class="admin-sidebar"></div>
    <div class="admin-main">
        <div class="admin-topbar"></div>
        <div class="admin-content">
            <div class="page-header">
                <h1 class="page-title">消息管理</h1>
                <p class="page-desc">消息模板、推送记录、通知设置</p>
            </div>

            <div class="tab-nav">
                <div class="tab-item active" onclick="switchTab('template', this)">
                    <i class="fas fa-envelope-open" style="margin-right:6px;"></i> 消息模板
                </div>
                <div class="tab-item" onclick="switchTab('record', this)">
                    <i class="fas fa-paper-plane" style="margin-right:6px;"></i> 推送记录
                </div>
            </div>

            <div class="tab-content active" id="tab-template">
                <div class="card">
                    <div class="add-btn-bar">
                        <div style="font-size:13px; color:var(--text-secondary);">共 <span id="templateCount" style="color:var(--primary); font-weight:600;">8</span> 个消息模板</div>
                        <button class="btn btn-primary" onclick="openTemplateModal()">
                            <i class="fas fa-plus"></i> 新增模板
                        </button>
                    </div>

                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>模板信息</th>
                                    <th>触发事件</th>
                                    <th>发送渠道</th>
                                    <th>状态</th>
                                    <th>最近使用</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="templateTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="tab-record">
                <div class="card">
                    <div class="filter-bar">
                        <div class="filter-item">
                            <span>推送时间</span>
                            <input type="date" id="recordStart" style="width:140px;">
                            <span>至</span>
                            <input type="date" id="recordEnd" style="width:140px;">
                        </div>
                        <div class="filter-item">
                            <span>状态</span>
                            <select id="recordStatus">
                                <option value="">全部</option>
                                <option value="success">推送成功</option>
                                <option value="failed">推送失败</option>
                                <option value="sending">推送中</option>
                            </select>
                        </div>
                        <button class="btn btn-primary btn-sm"><i class="fas fa-search"></i> 查询</button>
                        <button class="btn btn-outline btn-sm"><i class="fas fa-rotate-left"></i> 重置</button>
                    </div>

                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>推送ID</th>
                                    <th>模板名称</th>
                                    <th>接收人数</th>
                                    <th>推送时间</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="recordTableBody"></tbody>
                        </table>
                    </div>

                    <div class="pagination">
                        <div class="pagination-info">共 6 条记录，当前显示 1-6 条</div>
                        <div class="pagination-controls">
                            <button class="page-btn" disabled><i class="fas fa-chevron-left" style="font-size:10px;"></i></button>
                            <button class="page-btn active">1</button>
                            <button class="page-btn">2</button>
                            <button class="page-btn"><i class="fas fa-chevron-right" style="font-size:10px;"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="templateModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
        <div style="background:#fff; border-radius:16px; width:90%; max-width:560px; max-height:90vh; overflow:hidden; display:flex; flex-direction:column;">
            <div style="padding:20px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between;">
                <span style="font-size:18px; font-weight:600;" id="tmplModalTitle">新增消息模板</span>
                <div class="modal-close" onclick="closeTemplateModal()" style="cursor:pointer; width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:6px; color:var(--text-muted);">
                    <i class="fas fa-times"></i>
                </div>
            </div>
            <div style="padding:24px; overflow-y:auto; flex:1;">
                <div class="form-group">
                    <label class="form-label">模板名称</label>
                    <input type="text" class="form-input" id="t_name" placeholder="请输入模板名称">
                </div>
                <div class="form-group">
                    <label class="form-label">触发事件</label>
                    <select class="form-input form-select" id="t_event">
                        <option value="order_success">订单完成</option>
                        <option value="order_cancel">订单取消</option>
                        <option value="register">用户注册</option>
                        <option value="realname_approved">实名认证通过</option>
                        <option value="realname_rejected">实名认证拒绝</option>
                        <option value="settlement">结算到账</option>
                        <option value="subsidy">补贴发放</option>
                        <option value="system">系统通知</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">发送渠道</label>
                    <select class="form-input form-select" id="t_channel">
                        <option value="inapp">仅站内信</option>
                        <option value="sms">仅短信</option>
                        <option value="both">站内信 + 短信</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">模板内容</label>
                    <textarea class="form-input form-textarea" id="t_content" placeholder="例如：您的订单{订单号}已完成，工资{金额}元已结算到账。" style="min-height:100px;"></textarea>
                    <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">可用变量：{订单号}、{金额}、{用户名}、{时间} 等</div>
                </div>
            </div>
            <div style="padding:16px 24px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:12px;">
                <button class="btn btn-outline" onclick="closeTemplateModal()">取消</button>
                <button class="btn btn-primary" onclick="saveTemplate()">保存模板</button>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
    <script>
        initPageLayout();

        const templates = [
            { id: 'T001', name: '订单完成通知', icon: 'fa-check-circle', iconClass: 'green', event: 'order_success', channel: 'both', status: 'enabled', lastUsed: '2024-06-20 14:30' },
            { id: 'T002', name: '订单取消通知', icon: 'fa-times-circle', iconClass: 'red', event: 'order_cancel', channel: 'inapp', status: 'enabled', lastUsed: '2024-06-20 12:15' },
            { id: 'T003', name: '新用户注册欢迎', icon: 'fa-user-plus', iconClass: 'blue', event: 'register', channel: 'both', status: 'enabled', lastUsed: '2024-06-20 10:45' },
            { id: 'T004', name: '实名认证通过', icon: 'fa-id-card', iconClass: 'green', event: 'realname_approved', channel: 'inapp', status: 'enabled', lastUsed: '2024-06-19 16:20' },
            { id: 'T005', name: '实名认证拒绝', icon: 'fa-exclamation-triangle', iconClass: 'yellow', event: 'realname_rejected', channel: 'inapp', status: 'disabled', lastUsed: '2024-06-18 09:30' },
            { id: 'T006', name: '结算到账提醒', icon: 'fa-coins', iconClass: '', event: 'settlement', channel: 'sms', status: 'enabled', lastUsed: '2024-06-20 08:00' },
            { id: 'T007', name: '高温补贴发放', icon: 'fa-sun', iconClass: 'yellow', event: 'subsidy', channel: 'both', status: 'enabled', lastUsed: '2024-06-15 11:00' },
            { id: 'T008', name: '系统维护通知', icon: 'fa-wrench', iconClass: 'purple', event: 'system', channel: 'inapp', status: 'disabled', lastUsed: '2024-06-10 18:00' }
        ];

        const records = [
            { id: 'P202406201430', template: '订单完成通知', receivers: 1256, pushTime: '2024-06-20 14:30:25', status: 'success' },
            { id: 'P202406201045', template: '新用户注册欢迎', receivers: 892, pushTime: '2024-06-20 10:45:12', status: 'success' },
            { id: 'P202406200800', template: '结算到账提醒', receivers: 3420, pushTime: '2024-06-20 08:00:00', status: 'success' },
            { id: 'P202406191620', template: '实名认证通过', receivers: 456, pushTime: '2024-06-19 16:20:33', status: 'success' },
            { id: 'P202406181400', template: '订单完成通知', receivers: 8, pushTime: '2024-06-18 14:00:00', status: 'failed' },
            { id: 'P202406151100', template: '高温补贴发放', receivers: 25600, pushTime: '2024-06-15 11:00:00', status: 'success' }
        ];

        const eventMap = {
            order_success: '订单完成',
            order_cancel: '订单取消',
            register: '用户注册',
            realname_approved: '实名认证通过',
            realname_rejected: '实名认证拒绝',
            settlement: '结算到账',
            subsidy: '补贴发放',
            system: '系统通知'
        };

        const channelMap = {
            inapp: { text: '站内信', class: 'channel-inapp' },
            sms: { text: '短信', class: 'channel-sms' },
            both: { text: '站内信+短信', class: 'channel-both' }
        };

        const statusMap = {
            enabled: { text: '已启用', class: 'success' },
            disabled: { text: '已禁用', class: 'default' }
        };

        function switchTab(tab, el) {
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
        }

        function renderTemplates() {
            const tbody = document.getElementById('templateTableBody');
            tbody.innerHTML = templates.map(t => {
                const ch = channelMap[t.channel];
                const st = statusMap[t.status];
                return `
                    <tr>
                        <td>
                            <div class="template-name">
                                <div class="template-icon ${t.iconClass}"><i class="fas ${t.icon}"></i></div>
                                <div class="template-info">
                                    <span class="name">${t.name}</span>
                                    <span class="event">ID: ${t.id}</span>
                                </div>
                            </div>
                        </td>
                        <td>${eventMap[t.event] || t.event}</td>
                        <td><span class="channel-tag ${ch.class}">${ch.text}</span></td>
                        <td><span class="status-badge ${st.class}">${st.text}</span></td>
                        <td style="color:var(--text-secondary);">${t.lastUsed || '-'}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn btn-outline btn-sm" onclick="previewTemplate('${t.id}')">预览</button>
                                <button class="btn btn-secondary btn-sm" onclick="editTemplate('${t.id}')">编辑</button>
                                <button class="btn ${t.status === 'enabled' ? 'btn-danger' : 'btn-primary'} btn-sm" onclick="toggleTemplate('${t.id}')">${t.status === 'enabled' ? '禁用' : '启用'}</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
            document.getElementById('templateCount').textContent = templates.length;
        }

        function renderRecords() {
            const tbody = document.getElementById('recordTableBody');
            tbody.innerHTML = records.map(r => {
                const st = { success: { text: '推送成功', class: 'success' }, failed: { text: '推送失败', class: 'danger' }, sending: { text: '推送中', class: 'info' } }[r.status];
                return `
                    <tr>
                        <td style="font-family:monospace; color:var(--primary);">${r.id}</td>
                        <td>${r.template}</td>
                        <td>${r.receivers.toLocaleString()} 人</td>
                        <td style="color:var(--text-secondary);">${r.pushTime}</td>
                        <td><span class="status-badge ${st.class}">${st.text}</span></td>
                        <td>
                            <div class="action-btns">
                                <button class="btn btn-outline btn-sm" onclick="viewRecord('${r.id}')">详情</button>
                                <button class="btn btn-secondary btn-sm" onclick="retryRecord('${r.id}')">重发</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        let editingTemplateId = null;

        function openTemplateModal() {
            editingTemplateId = null;
            document.getElementById('tmplModalTitle').textContent = '新增消息模板';
            document.getElementById('t_name').value = '';
            document.getElementById('t_event').value = 'order_success';
            document.getElementById('t_channel').value = 'both';
            document.getElementById('t_content').value = '';
            document.getElementById('templateModal').style.display = 'flex';
        }

        function editTemplate(id) {
            const t = templates.find(x => x.id === id);
            if (!t) return;
            editingTemplateId = id;
            document.getElementById('tmplModalTitle').textContent = '编辑消息模板';
            document.getElementById('t_name').value = t.name;
            document.getElementById('t_event').value = t.event;
            document.getElementById('t_channel').value = t.channel;
            document.getElementById('t_content').value = '';
            document.getElementById('templateModal').style.display = 'flex';
        }

        function closeTemplateModal() {
            document.getElementById('templateModal').style.display = 'none';
        }

        function saveTemplate() {
            const name = document.getElementById('t_name').value;
            if (!name) { alert('请输入模板名称'); return; }
            const data = {
                name: name,
                event: document.getElementById('t_event').value,
                channel: document.getElementById('t_channel').value
            };
            if (editingTemplateId) {
                const idx = templates.findIndex(x => x.id === editingTemplateId);
                templates[idx] = { ...templates[idx], ...data };
            } else {
                const icons = [
                    { icon: 'fa-bell', iconClass: '' },
                    { icon: 'fa-envelope', iconClass: 'blue' },
                    { icon: 'fa-bullhorn', iconClass: 'yellow' },
                    { icon: 'fa-bolt', iconClass: 'green' }
                ];
                const ic = icons[Math.floor(Math.random() * icons.length)];
                const newId = 'T' + String(templates.length + 1).padStart(3, '0');
                templates.push({
                    id: newId,
                    name: data.name,
                    icon: ic.icon,
                    iconClass: ic.iconClass,
                    event: data.event,
                    channel: data.channel,
                    status: 'enabled',
                    lastUsed: '-'
                });
            }
            closeTemplateModal();
            renderTemplates();
        }

        function previewTemplate(id) {
            const t = templates.find(x => x.id === id);
            alert('模板预览：\n\n' + t.name + '\n触发事件：' + (eventMap[t.event] || t.event) + '\n渠道：' + (channelMap[t.channel]?.text || t.channel) + '\n\n内容示例：\n您的订单#20240620001已完成，工资￥350.00已结算到账。');
        }

        function toggleTemplate(id) {
            const t = templates.find(x => x.id === id);
            if (!t) return;
            t.status = t.status === 'enabled' ? 'disabled' : 'enabled';
            renderTemplates();
        }

        function viewRecord(id) {
            const r = records.find(x => x.id === id);
            alert('推送详情：\n\n推送ID：' + r.id + '\n模板：' + r.template + '\n接收人数：' + r.receivers.toLocaleString() + '\n推送时间：' + r.pushTime + '\n状态：' + (r.status === 'success' ? '成功' : r.status === 'failed' ? '失败' : '推送中'));
        }

        function retryRecord(id) {
            const r = records.find(x => x.id === id);
            if (!r) return;
            if (!confirm('确定要重新推送此消息吗？')) return;
            r.status = 'success';
            renderRecords();
        }

        renderTemplates();
        renderRecords();
    </script>
</body>
</html>
