<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', -apple-system, 'PingFang SC', sans-serif; }
        .phone-frame {
            width: 390px;
            height: 844px;
            background: #F5F5F5;
            overflow: hidden;
            position: relative;
            border-radius: 44px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
        }
        .dynamic-island {
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 32px;
            background: #000;
            border-radius: 20px;
            z-index: 60;
        }
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 47px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 28px;
            font-size: 15px;
            font-weight: 600;
            color: #333;
            z-index: 40;
            background: transparent;
        }
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 83px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-top: 0.5px solid rgba(0, 0, 0, 0.05);
            display: flex;
            padding-bottom: 20px;
            z-index: 50;
        }
        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .tab-item.active .tab-label { color: #FF6B35; }
        .tab-icon-wrap {
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            margin-bottom: 3px;
        }
        .tab-label {
            font-size: 10px;
            color: #999;
            font-weight: 500;
        }
        .tab-item.active .tab-icon-wrap {
            background: linear-gradient(135deg, #FF6B35, #FF8C5A);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            color: white;
            margin-bottom: 2px;
            box-shadow: 0 4px 10px rgba(255, 107, 53, 0.3);
        }
        .scroll-area {
            position: absolute;
            top: 47px;
            left: 0;
            right: 0;
            bottom: 83px;
            overflow-y: auto;
            background: #FFF8E6;
            -webkit-overflow-scrolling: touch;
        }
        .scroll-area::-webkit-scrollbar { display: none; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>
        
        <!-- 状态栏 -->
        <div class="status-bar">
            <span>19:48</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>

        <div class="scroll-area">
            <!-- 顶部标题 -->
            <div class="bg-yellow-50 px-4 py-3 flex items-center justify-between">
                <div class="w-8 h-8"></div>
                <span class="font-bold text-lg text-gray-800">消息</span>
                <div class="flex bg-white/80 backdrop-blur-sm rounded-full p-1 shadow-sm">
                    <div class="w-7 h-7 flex items-center justify-center cursor-pointer">
                        <i class="fas fa-ellipsis text-gray-700 text-sm"></i>
                    </div>
                    <div class="w-px h-4 bg-gray-300"></div>
                    <div class="w-7 h-7 flex items-center justify-center cursor-pointer">
                        <i class="fas fa-circle text-gray-700 text-xs"></i>
                    </div>
                </div>
            </div>

            <div class="bg-yellow-50 px-4 py-2"></div>

            <!-- 消息列表 -->
            <div class="bg-yellow-50 px-4 py-4 space-y-3">
                <!-- 系统通知 -->
                <div class="bg-white rounded-2xl p-4 flex items-start gap-3 shadow-sm cursor-pointer" onclick="navigateTo('notification')">
                    <div class="w-12 h-12 rounded-full bg-orange-100 flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-bell text-orange-500 text-xl"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="font-semibold text-base text-gray-800 mb-1">系统通知</div>
                        <div class="text-sm text-gray-500">消息内容</div>
                    </div>
                </div>

                <!-- 查看历史消息 -->
                <div class="bg-white rounded-2xl py-5 px-4 flex items-center justify-center shadow-sm cursor-pointer" onclick="navigateTo('history-message')">
                    <span class="text-sm font-medium text-gray-700">查看历史消息</span>
                </div>
            </div>

            <!-- 底部标语 -->
            <div class="text-center py-8">
                <div class="text-3xl font-extrabold text-gray-300 tracking-widest">找日结 上快马</div>
                <div class="text-sm text-gray-400 mt-2">— 真老板 真工价 真日结 —</div>
            </div>
        </div>

        <!-- 底部TabBar -->
        <div class="tab-bar">
            <div class="tab-item" onclick="switchTab(this, 'home')">
                <div class="tab-icon-wrap"><i class="fas fa-house text-lg"></i></div>
                <span class="tab-label">抢日结</span>
            </div>
            <div class="tab-item" onclick="switchTab(this, 'order')">
                <div class="tab-icon-wrap"><i class="fas fa-clipboard-list text-lg"></i></div>
                <span class="tab-label">接单</span>
            </div>
            <div class="tab-item active" onclick="switchTab(this, 'message')">
                <div class="tab-icon-wrap"><i class="fas fa-comment-dots text-lg"></i></div>
                <span class="tab-label">消息</span>
            </div>
            <div class="tab-item" onclick="switchTab(this, 'profile')">
                <div class="tab-icon-wrap"><i class="fas fa-smile text-lg"></i></div>
                <span class="tab-label">我的</span>
            </div>
        </div>
    </div>

    <script>
        function navigateTo(pageName) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "follow-qrcode", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance"];
            var path = pageName + '.html';
            if (workerPages.indexOf(pageName) < 0 && bossPages.indexOf(pageName) >= 0) {
                path = '../boss/' + path;
            } else if (workerPages.indexOf(pageName) < 0 && bossPages.indexOf(pageName) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }


        function switchTab(el, tab) {
            document.querySelectorAll('.tab-item').forEach(i => {
                i.classList.remove('active');
                const iconWrap = i.querySelector('.tab-icon-wrap');
                if (iconWrap) {
                    iconWrap.style.background = '';
                    iconWrap.style.borderRadius = '';
                    iconWrap.style.width = '';
                    iconWrap.style.height = '';
                    iconWrap.style.color = '';
                    iconWrap.style.marginBottom = '';
                    iconWrap.style.boxShadow = '';
                }
            });
            el.classList.add('active');
            const activeIconWrap = el.querySelector('.tab-icon-wrap');
            if (activeIconWrap) {
                activeIconWrap.style.background = 'linear-gradient(135deg, #FF6B35, #FF8C5A)';
                activeIconWrap.style.borderRadius = '50%';
                activeIconWrap.style.width = '32px';
                activeIconWrap.style.height = '32px';
                activeIconWrap.style.color = 'white';
                activeIconWrap.style.marginBottom = '2px';
                activeIconWrap.style.boxShadow = '0 4px 10px rgba(255, 107, 53, 0.3)';
            }
            navigateTo(tab);
        }
    </script>
</body>
</html>
