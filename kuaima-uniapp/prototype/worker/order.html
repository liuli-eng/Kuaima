<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', -apple-system, 'PingFang SC', sans-serif; }
        .phone-frame {
            width: 390px;
            height: 844px;
            background: #F5F5F5;
            overflow: hidden;
            position: relative;
            border-radius: 44px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
        }
        .dynamic-island {
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 32px;
            background: #000;
            border-radius: 20px;
            z-index: 60;
        }
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 47px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 28px;
            font-size: 15px;
            font-weight: 600;
            color: #333;
            z-index: 40;
            background: transparent;
        }
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 83px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-top: 0.5px solid rgba(0, 0, 0, 0.05);
            display: flex;
            padding-bottom: 20px;
            z-index: 50;
        }
        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .tab-item.active .tab-label { color: #FF6B35; }
        .tab-icon-wrap {
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            margin-bottom: 3px;
        }
        .tab-label {
            font-size: 10px;
            color: #999;
            font-weight: 500;
        }
        .tab-item.active .tab-icon-wrap {
            background: linear-gradient(135deg, #FF6B35, #FF8C5A);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            color: white;
            margin-bottom: 2px;
            box-shadow: 0 4px 10px rgba(255, 107, 53, 0.3);
        }
        .scroll-area {
            position: absolute;
            top: 47px;
            left: 0;
            right: 0;
            bottom: 83px;
            overflow-y: auto;
            background: #FFF8E6;
            -webkit-overflow-scrolling: touch;
        }
        .scroll-area::-webkit-scrollbar { display: none; }
        #dayTabs::-webkit-scrollbar { display: none; width: 0; height: 0; }
        #dayTabs { scrollbar-width: none; -ms-overflow-style: none; }
        .status-tabs-container::-webkit-scrollbar { display: none; width: 0; height: 0; }
        .status-tabs-container { scrollbar-width: none; -ms-overflow-style: none; }
        .day-tabs-container::-webkit-scrollbar { display: none; width: 0; height: 0; }
        .day-tabs-container { scrollbar-width: none; -ms-overflow-style: none; }
        .day-tab {
            flex-shrink: 0;
            text-align: center;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            background: white;
        }
        .day-tab.active {
            background: linear-gradient(135deg, #FF6B35, #FF8C5A);
            color: white;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }
        .status-tab {
            flex-shrink: 0;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
        }
        .status-tab.active {
            background: #FFF3EE;
            color: #FF6B35;
            font-weight: 600;
        }
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .order-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        .order-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }
        .order-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .order-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
        }
        .tag-green { background: #E8F5E9; color: #4CAF50; }
        .tag-blue { background: #E3F2FD; color: #2196F3; }
        .tag-orange { background: #FFF3E0; color: #FF9800; }
        .tag-red { background: #FFEBEE; color: #F44336; }
        .order-status {
            font-size: 13px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
            white-space: nowrap;
        }
        .status-applied { background: #FFF3E0; color: #FF9800; }
        .status-hired { background: #E3F2FD; color: #2196F3; }
        .status-arrived { background: #F3E5F5; color: #9C27B0; }
        .status-done { background: #E8F5E9; color: #4CAF50; }
        .order-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .info-item i {
            color: #FF6B35;
            width: 12px;
        }
        .info-label { color: #999; }
        .info-value { color: #333; font-weight: 500; }
        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .order-wage {
            font-size: 18px;
            font-weight: 700;
            color: #FF6B35;
        }
        .order-wage-unit {
            font-size: 12px;
            font-weight: 400;
            color: #999;
            margin-left: 2px;
        }
        .order-actions {
            display: flex;
            gap: 8px;
        }
        .btn-small {
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #FF6B35, #FF8C5A);
            color: white;
        }
        .btn-outline {
            background: white;
            color: #666;
            border: 1px solid #ddd;
        }
        .btn-warn {
            background: #FFF3E0;
            color: #FF6B35;
        }
        .order-type-badge {
            display: inline-block;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 6px;
            font-weight: 500;
        }
        .type-day { background: #FFF3EE; color: #FF6B35; }
        .type-press { background: #E8F5E9; color: #4CAF50; }
        .type-monthly { background: #E3F2FD; color: #2196F3; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">

        <!-- 状态栏 -->
        <div class="status-bar">

        <div class="scroll-area">

            <!-- 日期选择 -->
                <div class="day-tabs-container flex gap-2 overflow-x-auto pb-1" id="dayTabs">
                    <div class="day-tab active" onclick="filterByDate('all')">
                        <div>全部</div>
                        <div class="text-[10px] font-normal">订单</div>
                    </div>
                    <div class="day-tab" onclick="filterByDate('yesterday')">

                        <div class="text-[10px] font-normal">8/19</div>
                    </div>
                    <div class="day-tab" onclick="filterByDate('today')">
                        <div>今天</div>
                        <div class="text-[10px] font-normal">8/20</div>
                    </div>
                    <div class="day-tab" onclick="filterByDate('tomorrow')">
                        <div>明天</div>
                        <div class="text-[10px] font-normal">8/21</div>
                    </div>
                    <div class="day-tab" onclick="filterByDate('day-after-tomorrow')">
                        <div>后天</div>
                        <div class="text-[10px] font-normal">8/22</div>
                    </div>
                </div>
            </div>

            <!-- 状态筛选 -->
            <div class="bg-yellow-50 px-4 pb-4">
                <div class="status-tabs-container flex gap-2 overflow-x-auto">
                    <span class="status-tab active" onclick="filterByStatus('all', this)">全部状态</span>
                    <span class="status-tab" onclick="filterByStatus('applied', this)">已报名</span>
                    <span class="status-tab" onclick="filterByStatus('hired', this)">已录用</span>
                    <span class="status-tab" onclick="filterByStatus('arrived', this)">已到岗</span>
                    <span class="status-tab" onclick="filterByStatus('done', this)">已完成</span>
                </div>
            </div>

            <!-- 订单列表 -->
            <div id="orderList" class="px-4 pb-4"></div>

            <!-- 底部标语 -->
            <div class="text-center py-8">
                <div class="text-3xl font-extrabold text-gray-300 tracking-widest">找日结 上快马</div>
                <div class="text-sm text-gray-400 mt-2">— 真老板 真工价 真日结 —</div>
            </div>
        </div>

        <!-- 底部TabBar -->
        <div class="tab-bar">
            <div class="tab-item" onclick="switchTab(this, 'home')">
                <div class="tab-icon-wrap"><i class="fas fa-house text-lg"></i></div>
                <span class="tab-label">抢日结</span>
            </div>
            <div class="tab-item active" onclick="switchTab(this, 'order')">
                <div class="tab-icon-wrap"><i class="fas fa-clipboard-list text-lg"></i></div>
                <span class="tab-label">接单</span>
            </div>
            <div class="tab-item" onclick="switchTab(this, 'message')">

            <div class="tab-item" onclick="switchTab(this, 'profile')">
                <div class="tab-icon-wrap"><i class="fas fa-smile text-lg"></i></div>
                <span class="tab-label">我的</span>
            </div>
        </div>
    </div>

                },
                {

                    employer: '绿源农业科技',
                    tags: ['<span class="order-tag tag-green">日结</span>', '<span class="order-tag tag-blue">简单</span>'],

                    employer: '肯德基餐饮管理',
                    tags: ['<span class="order-tag tag-green">压薪</span>', '<span class="order-tag tag-blue">包吃</span>'],
                    date: 'today',
                    status: 'arrived',

                {

                    title: '压薪电商打包员',
                    employer: '京东物流仓储',
                    tags: ['<span class="order-tag tag-green">压薪</span>', '<span class="order-tag tag-orange">长工期</span>'],
                    date: 'tomorrow',
                    status: 'hired',
                    statusText: '已录用',
                    statusClass: 'status-hired',
                    time: '明天 09:00-19:00',
                    location: '松江区洞泾镇',
                    distance: '2.1km',
                    count: '1人',
                    wage: 170,

                {
                    id: 9,

                    employer: '富士康科技集团',
                    tags: ['<span class="order-tag tag-blue">月结</span>', '<span class="order-tag tag-green">稳定</span>'],
                    date: 'today',

                    statusClass: 'status-hired',

                    count: '1人',
                    wage: 5500,
                    unit: '元/月',
                    actions: '<button class="btn-small btn-primary" onclick="navigateTo(\'job-detail\', event)">查看详情</button>'
                }
            ]
        };

        let currentOrderType = 'day';
        let currentDateFilter = 'all';
        let currentStatusFilter = 'all';

        function renderOrders() {
            const list = document.getElementById('orderList');
            let orders = ordersData[currentOrderType] || [];
            
            // 筛选状态
            if (currentStatusFilter !== 'all') {
                orders = orders.filter(o => o.status === currentStatusFilter);
            }
            
            // 筛选日期
            if (currentDateFilter !== 'all') {
                orders = orders.filter(o => o.date === currentDateFilter);
            }
            
            if (orders.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="text-[80px] mb-4">📋</div>
                        <div class="text-gray-400 text-sm">暂无相关订单</div>
                    </div>`;
                return;
            }
            
            const typeClass = currentOrderType === 'day' ? 'type-day' : (currentOrderType === 'press' ? 'type-press' : 'type-monthly');
            const typeText = currentOrderType === 'day' ? '日结' : (currentOrderType === 'press' ? '压薪日结' : '月结');
            
            list.innerHTML = orders.map(o => `
                <div class="order-card" onclick="navigateTo('job-detail')">
                    <div class="order-header">
                        <div>
                            <div class="order-title">
                                <span class="order-type-badge ${typeClass}">${typeText}</span>
                                ${o.title}
                            </div>
                            <div class="order-tags">
                                ${o.tags.join('')}
                            </div>
                        </div>
                        <span class="order-status ${o.statusClass}">${o.statusText}</span>
                    </div>
                    <div class="order-info">
                        <div class="info-item">
                            <i class="fas fa-clock"></i>
                            <span class="info-label">时间：</span>
                            <span class="info-value">${o.time}</span>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-map-marker-alt"></i>
                            <span class="info-label">地点：</span>
                            <span class="info-value">${o.location}</span>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-user"></i>
                            <span class="info-label">雇主：</span>
                            <span class="info-value">${o.employer}</span>
                        </div>
                        <div class="info-item">
                            <i class="fas fa-walking"></i>
                            <span class="info-label">距离：</span>
                            <span class="info-value">${o.distance}</span>
                        </div>
                    </div>
                    <div class="order-footer">
                        <div>
                            <span class="order-wage">¥${o.wage}</span>
                            <span class="order-wage-unit">${o.unit}</span>
                        </div>
                        <div class="order-actions">
                            ${o.actions}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterByDate(date) {
            currentDateFilter = date;
            document.querySelectorAll('#dayTabs .day-tab').forEach(t => {
                t.classList.remove('active');
                t.style.background = '';
                t.style.color = '';
                t.style.boxShadow = '';
            });
            event.currentTarget.classList.add('active');
            event.currentTarget.style.background = 'linear-gradient(135deg, #FF6B35, #FF8C5A)';
            event.currentTarget.style.color = 'white';
            event.currentTarget.style.boxShadow = '0 4px 12px rgba(255, 107, 53, 0.3)';
            renderOrders();
        }

        function filterByStatus(status, el) {
            currentStatusFilter = status;
            document.querySelectorAll('.status-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderOrders();
        }

        function confirmOrder(id) {
            if (confirm('确认接单？')) {
                alert('接单成功！请按时到岗');
            }
        }

        function cancelOrder(id, event) {
            if (event) event.stopPropagation();
            if (confirm('确定取消报名？')) {
                alert('已取消报名');
            }
        }

        function viewSettle(id, event) {
            if (event) event.stopPropagation();
            window.location.href = 'settlement.html';
        }

        function navigateTo(pageName, event) {
            if (event) event.stopPropagation();
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message", "settlement"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance"];
            var path = pageName + '.html';
            if (workerPages.indexOf(pageName) < 0 && bossPages.indexOf(pageName) >= 0) {
                path = '../boss/' + path;
            } else if (workerPages.indexOf(pageName) < 0 && bossPages.indexOf(pageName) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }

        function switchTab(el, tab) {
            document.querySelectorAll('.tab-item').forEach(i => {
                i.classList.remove('active');
                const iconWrap = i.querySelector('.tab-icon-wrap');
                if (iconWrap) {
                    iconWrap.style.background = '';
                    iconWrap.style.borderRadius = '';
                    iconWrap.style.width = '';
                    iconWrap.style.height = '';
                    iconWrap.style.color = '';
                    iconWrap.style.marginBottom = '';
                    iconWrap.style.boxShadow = '';
                }
            });
            el.classList.add('active');
            const activeIconWrap = el.querySelector('.tab-icon-wrap');
            if (activeIconWrap) {
                activeIconWrap.style.background = 'linear-gradient(135deg, #FF6B35, #FF8C5A)';
                activeIconWrap.style.borderRadius = '50%';
                activeIconWrap.style.width = '32px';
                activeIconWrap.style.height = '32px';
                activeIconWrap.style.color = 'white';
                activeIconWrap.style.marginBottom = '2px';
                activeIconWrap.style.boxShadow = '0 4px 10px rgba(255, 107, 53, 0.3)';
            }
            navigateTo(tab);
        }

        function switchOrderType(type) {
            if (type === 'press') {
                currentOrderType = 'press';
                currentDateFilter = 'all';
                currentStatusFilter = 'all';
                document.querySelectorAll('.flex.gap-3 span').forEach(s => {
                    s.classList.remove('bg-white', 'font-semibold', 'text-gray-800');
                    s.classList.add('bg-white/50', 'text-gray-600');
                });
                event.target.classList.remove('bg-white/50', 'text-gray-600');
                event.target.classList.add('bg-white', 'font-semibold', 'text-gray-800');
                resetTabs();
                renderOrders();
            } else if (type === 'monthly') {
                currentOrderType = 'monthly';
                currentDateFilter = 'all';
                currentStatusFilter = 'all';
                document.querySelectorAll('.flex.gap-3 span').forEach(s => {
                    s.classList.remove('bg-white', 'font-semibold', 'text-gray-800');
                    s.classList.add('bg-white/50', 'text-gray-600');
                });
                event.target.classList.remove('bg-white/50', 'text-gray-600');
                event.target.classList.add('bg-white', 'font-semibold', 'text-gray-800');
                resetTabs();
                renderOrders();
            } else {
                currentOrderType = 'day';
                currentDateFilter = 'all';
                currentStatusFilter = 'all';
                document.querySelectorAll('.flex.gap-3 span').forEach(s => {
                    s.classList.remove('bg-white', 'font-semibold', 'text-gray-800');
                    s.classList.add('bg-white/50', 'text-gray-600');
                });
                event.target.classList.remove('bg-white/50', 'text-gray-600');
                event.target.classList.add('bg-white', 'font-semibold', 'text-gray-800');
                resetTabs();
                renderOrders();
            }
        }

        function resetTabs() {
            document.querySelectorAll('#dayTabs .day-tab').forEach(t => {
                t.classList.remove('active');
                t.style.background = '';
                t.style.color = '';
                t.style.boxShadow = '';
            });
            const firstTab = document.querySelector('#dayTabs .day-tab');
            if (firstTab) {
                firstTab.classList.add('active');
                firstTab.style.background = 'linear-gradient(135deg, #FF6B35, #FF8C5A)';
                firstTab.style.color = 'white';
                firstTab.style.boxShadow = '0 4px 12px rgba(255, 107, 53, 0.3)';
            }
            document.querySelectorAll('.status-tab').forEach(t => t.classList.remove('active'));
            document.querySelector('.status-tab').classList.add('active');
        }

        // 初始化渲染
        renderOrders();
    </script>
</body>
</html>
