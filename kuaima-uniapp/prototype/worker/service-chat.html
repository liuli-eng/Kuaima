<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线客服 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame {
            width: 390px; height: 844px; background: #f5f5f5; overflow: hidden;
            position: relative; border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
        }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }

        .chat-header {
            background: linear-gradient(135deg, #FF6B35, #FF8C5A);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-avatar {
            width: 40px; height: 40px;
            background: #fff;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .chat-info { flex: 1; }
        .chat-name { font-size: 15px; font-weight: 600; color: #fff; }
        .chat-status { font-size: 12px; color: rgba(255,255,255,0.8); display: flex; align-items: center; gap: 4px; }
        .status-dot { width: 6px; height: 6px; background: #52C41A; border-radius: 50%; }
        .chat-close { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer; }

        .security-tip {
            background: #FFF8E6;
            padding: 8px 14px;
            font-size: 12px;
            color: #B8860B;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid #FFE4A0;
        }
        .security-tip i { color: #FA8C16; }
        .security-close { margin-left: auto; cursor: pointer; color: #FA8C16; }

        .chat-messages {
            height: 620px;
            overflow-y: auto;
            padding: 16px;
            background: #f5f5f5;
        }
        .chat-messages::-webkit-scrollbar { display: none; }

        .msg-time { text-align: center; font-size: 11px; color: #999; margin: 12px 0; }

        .msg-row { display: flex; gap: 8px; margin-bottom: 16px; }
        .msg-row.self { flex-direction: row-reverse; }

        .msg-avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; flex-shrink: 0;
        }
        .msg-avatar.service { background: linear-gradient(135deg, #FF6B35, #FF8C5A); color: white; }
        .msg-avatar.user { background: #52C41A; color: white; }

        .msg-content { max-width: 75%; }
        .msg-bubble {
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            position: relative;
        }
        .msg-row:not(.self) .msg-bubble {
            background: #fff;
            color: #333;
            border-radius: 4px 12px 12px 12px;
        }
        .msg-row.self .msg-bubble {
            background: linear-gradient(135deg, #FF6B35, #FF8C5A);
            color: white;
            border-radius: 12px 4px 12px 12px;
        }

        .hot-questions {
            background: #fff;
            border-radius: 12px;
            padding: 14px;
            margin-top: 10px;
        }
        .hot-title { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 10px; }
        .hot-list { display: flex; flex-direction: column; gap: 8px; }
        .hot-item {
            padding: 10px 12px;
            background: #FFF8F5;
            border-radius: 8px;
            font-size: 13px;
            color: #FF6B35;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .hot-item:hover { background: #FFE8DF; }
        .hot-item i { color: #FF6B35; font-size: 10px; }
        .hot-item.more { justify-content: center; color: #666; background: #f5f5f5; }
        .hot-item.more i { color: #999; }

        .quick-reply {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .quick-chip {
            padding: 6px 12px;
            background: #FFF8F5;
            border: 1px solid #FFE4D6;
            border-radius: 16px;
            font-size: 12px;
            color: #FF6B35;
            cursor: pointer;
            transition: all 0.2s;
        }
        .quick-chip:hover { background: #FF6B35; color: #fff; }

        .order-card {
            background: #FFF8F5;
            border: 1px solid #FFE4D6;
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
        }
        .order-card-title {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .order-card-info {
            font-size: 12px;
            color: #666;
            line-height: 1.8;
        }
        .order-card-info span { color: #FF6B35; }

        .input-area {
            position: absolute;
            bottom: 34px;
            left: 0; right: 0;
            background: #fff;
            padding: 12px 14px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .input-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-btn {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            color: #666; cursor: pointer;
        }
        .input-field {
            flex: 1;
            padding: 10px 14px;
            background: #f5f5f5;
            border-radius: 20px;
            font-size: 14px;
            border: none;
            outline: none;
        }
        .input-field::placeholder { color: #999; }
        .send-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #FF6B35, #FF8C5A);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .send-btn:disabled { opacity: 0.5; }

        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>

        <div class="status-bar">
            <span>19:48</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>

        <div class="chat-header">
            <div class="chat-close" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
            </div>
            <div class="chat-avatar">
                <i class="fas fa-headset" style="color:#FF6B35;"></i>
            </div>
            <div class="chat-info">
                <div class="chat-name">快马日结客服</div>
                <div class="chat-status">
                    <span class="status-dot"></span>
                    在线 · 平均1分钟回复
                </div>
            </div>
            <div class="chat-close">
                <i class="fas fa-ellipsis-h"></i>
            </div>
        </div>

        <div class="security-tip" id="securityTip">
            <i class="fas fa-shield-alt"></i>
            <span>请勿添加平台外联系方式，以免造成财产损失</span>
            <span class="security-close" onclick="document.getElementById('securityTip').style.display='none'">
                <i class="fas fa-times"></i>
            </span>
        </div>

        <div class="chat-messages">
            <div class="msg-time">今天 19:48</div>

            <div class="msg-row">
                <div class="msg-avatar service"><i class="fas fa-headset"></i></div>
                <div class="msg-content">
                    <div class="msg-bubble">
                        您好，我是快马日结客服小助手，很高兴为您服务！请问有什么可以帮助您？
                    </div>
                </div>
            </div>

            <div class="msg-row">
                <div class="msg-avatar service"><i class="fas fa-headset"></i></div>
                <div class="msg-content">
                    <div class="msg-bubble" style="background: transparent; padding: 0;">
                        <div class="hot-questions">
                            <div class="hot-title">常见问题</div>
                            <div class="hot-list">
                                <div class="hot-item" onclick="selectHotQuestion(this)">
                                    <i class="fas fa-circle"></i>
                                    <span>老板还没有结算报酬怎么办？</span>
                                </div>
                                <div class="hot-item" onclick="selectHotQuestion(this)">
                                    <i class="fas fa-circle"></i>
                                    <span>订单有事去不了怎么取消？</span>
                                </div>
                                <div class="hot-item" onclick="selectHotQuestion(this)">
                                    <i class="fas fa-circle"></i>
                                    <span>到达地方联系不上老板？</span>
                                </div>
                                <div class="hot-item" onclick="selectHotQuestion(this)">
                                    <i class="fas fa-circle"></i>
                                    <span>工资什么时候能到账？</span>
                                </div>
                                <div class="hot-item" onclick="selectHotQuestion(this)">
                                    <i class="fas fa-circle"></i>
                                    <span>如何修改联系方式？</span>
                                </div>
                                <div class="hot-item" onclick="selectHotQuestion(this)">
                                    <i class="fas fa-circle"></i>
                                    <span>被投诉了怎么办？</span>
                                </div>
                                <div class="hot-item more" onclick="selectHotQuestion(this)">
                                    <i class="fas fa-headset"></i>
                                    <span>转人工客服</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="msg-row">
                <div class="msg-avatar service"><i class="fas fa-headset"></i></div>
                <div class="msg-content">
                    <div class="msg-bubble" style="background: transparent; padding: 0;">
                        <div class="order-card">
                            <div class="order-card-title">
                                <i class="fas fa-clipboard-list" style="color:#FF6B35;"></i>
                                <span>您进行中的订单</span>
                            </div>
                            <div class="order-card-info">
                                订单号：<span>J20240315001</span><br>
                                岗位：分拣员 · 顺丰仓库<br>
                                状态：<span>待结算</span> · 已完成
                            </div>
                            <div class="quick-reply">
                                <div class="quick-chip" onclick="selectHotQuestion(this)">催结算</div>
                                <div class="quick-chip" onclick="selectHotQuestion(this)">查看详情</div>
                                <div class="quick-chip" onclick="selectHotQuestion(this)">申请申诉</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-btn" onclick="alert('相册')">
                <i class="fas fa-image"></i>
            </div>
            <div class="input-wrap">
                <input type="text" class="input-field" id="messageInput" placeholder="请输入您的问题...">
            </div>
            <button class="send-btn" onclick="sendMessage()">发送</button>
        </div>

        <div class="page-indicator"></div>
    </div>

    <script>
        function goBack() {
            window.history.back();
        }

        function selectHotQuestion(el) {
            const text = el.querySelector('span').textContent;
            const input = document.getElementById('messageInput');
            input.value = text;
            sendMessage();
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            const messages = document.querySelector('.chat-messages');

            const userMsg = document.createElement('div');
            userMsg.className = 'msg-row self';
            userMsg.innerHTML = `
                <div class="msg-avatar user"><i class="fas fa-user"></i></div>
                <div class="msg-content">
                    <div class="msg-bubble">${text}</div>
                </div>
            `;
            messages.appendChild(userMsg);

            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            setTimeout(() => {
                const replyMsg = document.createElement('div');
                replyMsg.className = 'msg-row';
                replyMsg.innerHTML = `
                    <div class="msg-avatar service"><i class="fas fa-headset"></i></div>
                    <div class="msg-content">
                        <div class="msg-bubble">收到您的问题了，客服专员正在为您处理，请稍候...</div>
                    </div>
                `;
                messages.appendChild(replyMsg);
                messages.scrollTop = messages.scrollHeight;
            }, 1000);
        }

        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
