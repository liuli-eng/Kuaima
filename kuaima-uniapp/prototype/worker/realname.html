<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机号验证 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame {
            width: 390px; height: 844px; background: #fff; overflow: hidden;
            position: relative; border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
        }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }
        .top-nav { padding: 8px 16px 12px; display: flex; align-items: center; justify-content: space-between; background: #fff; border-bottom: 1px solid #f0f0f0; position: absolute; top: 47px; left: 0; right: 0; height: 52px; z-index: 10; }
        .nav-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .nav-right { display: flex; align-items: center; background: rgba(255, 255, 255, 0.9); border-radius: 20px; padding: 4px 6px; gap: 2px; }
        .nav-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
        .content-area { position: absolute; top: 99px; left: 0; right: 0; bottom: 34px; overflow-y: auto; background: #f5f5f5; }
        .content-area::-webkit-scrollbar { display: none; }
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
        
        .header-section { text-align: center; padding: 32px 20px 24px; background: #fff; }
        .header-icon {
            width: 80px; height: 80px; margin: 0 auto 16px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 36px; color: white;
        }
        .header-title { font-size: 20px; font-weight: 600; color: #333; }
        .header-desc { font-size: 14px; color: #999; margin-top: 8px; line-height: 1.6; }
        
        .form-section { background: white; margin: 0 16px; border-radius: 12px; overflow: hidden; }
        .form-item {
            display: flex; align-items: center; padding: 16px;
            border-bottom: 1px solid #f5f5f5;
        }
        .form-item:last-child { border-bottom: none; }
        .form-label { font-size: 15px; color: #333; width: 70px; flex-shrink: 0; }
        .form-input {
            flex: 1; min-width: 0; font-size: 15px; color: #666;
            border: none; outline: none; background: transparent;
        }
        .form-input::placeholder { color: #ccc; }
        .form-input.phone { letter-spacing: 1px; color: #333; }
        
        .send-code-btn {
            flex-shrink: 0;
            font-size: 13px;
            color: #FF6B35;
            font-weight: 500;
            padding: 7px 16px;
            margin-left: 8px;
            border: 1px solid #FF6B35;
            border-radius: 999px;
            cursor: pointer;
            background: transparent;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .send-code-btn.disabled { color: #bbb; border-color: #ddd; cursor: not-allowed; background: transparent; }
        
        .code-input-wrap {
            display: flex; gap: 10px; margin: 20px 16px 0; justify-content: center; background: #fff; padding: 20px 16px; border-radius: 12px;
        }
        .code-box {
            width: 44px; height: 52px;
            background: #FAFAFA; border: 1.5px solid #E0E0E0; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: 600; color: #333;
            transition: border-color 0.2s;
        }
        .code-box.filled { border-color: #FF6B35; }
        
        .verify-btn {
            margin: 24px auto 12px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: white; padding: 13px 24px; border-radius: 24px;
            text-align: center; font-size: 16px; font-weight: 600;
            cursor: pointer; border: none;
            display: block; width: calc(100% - 32px);
        }
        .verify-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .tip-box {
            background: #FFF8F0;
            border-radius: 10px;
            padding: 12px 14px;
            margin: 0 16px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .tip-icon {
            width: 18px; height: 18px; flex-shrink: 0;
            background: #FF6B35; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 10px; font-weight: 700;
            margin-top: 2px;
        }
        .tip-text { font-size: 12px; color: #666; line-height: 1.7; }
        .tip-text a { color: #FF6B35; cursor: pointer; }
        
        .agreement-section {
            display: flex; align-items: flex-start;
            padding: 16px 20px 0; font-size: 12px; color: #999;
        }
        .agreement-checkbox {
            width: 16px; height: 16px; margin-right: 8px; margin-top: 2px; flex-shrink: 0;
            border: 1px solid #ddd; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .agreement-checkbox.checked {
            background: #FFD700; border-color: #FFD700;
        }
        .agreement-text a { color: #FF6B35; text-decoration: none; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>

        <div class="status-bar">
            <span>19:53</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>

        <div class="top-nav">
            <div class="nav-back" onclick="goBack()">
                <i class="fas fa-chevron-left text-gray-700"></i>
            </div>
            <div class="nav-title" style="font-size: 17px; font-weight: 600; color: #333; position: absolute; left: 50%; transform: translateX(-50%);">手机号验证</div>
            <div class="nav-right">
                <div class="nav-btn">
                    <i class="fas fa-ellipsis text-gray-700" style="font-size: 13px;"></i>
                </div>
                <div style="width: 1px; height: 14px; background: #ddd; margin: 0 2px;"></div>
                <div class="nav-btn">
                    <i class="fas fa-circle text-gray-700" style="font-size: 11px;"></i>
                </div>
            </div>
        </div>

        <div class="content-area">
            <div class="header-section">
                <div class="header-icon">
                    <i class="fas fa-mobile-alt"></i>
                </div>
                <div class="header-title">验证手机号</div>
                <div class="header-desc">为了保障您的账户安全，需要验证<br>您绑定的手机号 138****5678</div>
            </div>

            <div class="form-section">
                <div class="form-item">
                    <div class="form-label">手机号</div>
                    <input type="tel" class="form-input phone" value="138 **** 5678" maxlength="13" readonly>
                </div>
                <div class="form-item">
                    <div class="form-label">验证码</div>
                    <input type="text" class="form-input" id="codeInput" placeholder="请输入6位验证码" maxlength="6" oninput="onCodeInput(this)">
                    <button class="send-code-btn" id="sendCodeBtn" onclick="sendCode()">获取验证码</button>
                </div>
            </div>

            <div class="code-input-wrap">
                <div class="code-box" id="box0"></div>
                <div class="code-box" id="box1"></div>
                <div class="code-box" id="box2"></div>
                <div class="code-box" id="box3"></div>
                <div class="code-box" id="box4"></div>
                <div class="code-box" id="box5"></div>
            </div>

            <button class="verify-btn" id="verifyBtn" onclick="doVerify()" disabled>确 认 验 证</button>

            <div class="tip-box">
                <div class="tip-icon">!</div>
                <div class="tip-text">
                    未收到短信？请检查手机号码是否正确，或尝试稍后再获取。
                </div>
            </div>

            <div class="agreement-section">
                <div class="agreement-checkbox checked" id="agreeCheckbox" onclick="toggleAgree()">
                    <i class="fas fa-check" style="font-size: 10px; color: white;"></i>
                </div>
                <span class="agreement-text">您已阅读并同意<a onclick="alert('隐私政策')">《快马日结隐私政策》</a></span>
            </div>
        </div>

        <div class="page-indicator"></div>
    </div>

    <script>
        var countdown = 0;
        var countdownTimer = null;
        var codeValue = '';

        function navigateTo(pageName) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance"];
            var path = pageName + '.html';
            if (workerPages.indexOf(pageName) < 0 && bossPages.indexOf(pageName) >= 0) {
                path = '../boss/' + path;
            } else if (workerPages.indexOf(pageName) < 0 && bossPages.indexOf(pageName) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }

        function goBack() { window.history.back(); }

        function sendCode() {
            if (countdown > 0) return;
            countdown = 60;
            var btn = document.getElementById('sendCodeBtn');
            btn.classList.add('disabled');
            btn.textContent = countdown + 's 后重试';
            countdownTimer = setInterval(function() {
                countdown--;
                if (countdown <= 0) {
                    clearInterval(countdownTimer);
                    btn.classList.remove('disabled');
                    btn.textContent = '重新获取';
                    countdown = 0;
                } else {
                    btn.textContent = countdown + 's 后重试';
                }
            }, 1000);
            alert('验证码已发送至 138****5678');
        }

        function sendVoiceCode() {
            alert('语音验证码即将拨打，请接听来电');
        }

        function onCodeInput(input) {
            var val = input.value.replace(/\D/g, '').slice(0, 6);
            input.value = val;
            codeValue = val;
            updateCodeBoxes();
            checkVerifyBtn();
        }

        function updateCodeBoxes() {
            for (var i = 0; i < 6; i++) {
                var box = document.getElementById('box' + i);
                box.textContent = codeValue[i] || '';
                box.className = 'code-box' + (codeValue.length > i ? ' filled' : '');
            }
        }

        function checkVerifyBtn() {
            var btn = document.getElementById('verifyBtn');
            btn.disabled = codeValue.length !== 6;
        }

        function doVerify() {
            if (!document.getElementById('agreeCheckbox').classList.contains('checked')) {
                alert('请先阅读并同意隐私政策'); return;
            }
            if (codeValue.length !== 6) {
                alert('请输入6位验证码'); return;
            }
            alert('验证成功！');
        }
        
        function toggleAgree() {
            const checkbox = document.getElementById('agreeCheckbox');
            checkbox.classList.toggle('checked');
            const icon = checkbox.querySelector('i');
            if (checkbox.classList.contains('checked')) {
                icon.style.display = 'block';
            } else {
                icon.style.display = 'none';
            }
        }
    </script>
</body>
</html>
