<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>接单课堂 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .phone-frame {
            width: 390px;
            height: 844px;
            background: #f5f5f5;
            overflow: hidden;
            position: relative;
            border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            border: 10px solid #1a1a1a;
        }
        .dynamic-island {
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 35px;
            background: #000;
            border-radius: 20px;
            z-index: 50;
        }
        .status-bar {
            height: 47px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 28px;
            font-size: 15px;
            font-weight: 600;
            color: #333;
            background: #fff;
        }
        .top-nav {
            padding: 8px 16px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            border-bottom: 1px solid #f0f0f0;
            position: absolute;
            top: 47px;
            left: 0;
            right: 0;
            height: 52px;
            z-index: 10;
        }
        .nav-back {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .nav-title {
            font-size: 17px;
            font-weight: 600;
            color: #333;
        }
        .nav-right {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 4px 6px;
            gap: 2px;
        }
        .nav-btn {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .content-area {
            position: absolute;
            top: 99px;
            left: 0;
            right: 0;
            bottom: 34px;
            overflow-y: auto;
            background: #f5f5f5;
        }
        /* 顶部横幅 */
        .hero-banner {
            background: linear-gradient(135deg, #FFF4E6, #FFE4B5);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .hero-title {
            font-size: 28px;
            font-weight: 700;
            color: #8B4513;
            margin-bottom: 8px;
        }
        .hero-subtitle {
            font-size: 14px;
            color: #A0522D;
        }
        .hero-illustration {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 100px;
            height: 100px;
            opacity: 0.8;
        }
        /* 新人任务卡片 */
        .task-card {
            background: #fff;
            margin: 16px 16px 16px;
            border-radius: 16px;
            padding: 16px 20px;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        .task-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }
        .task-badge {
            background: linear-gradient(135deg, #FF6B35, #FF8C42);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 12px;
            margin-right: 8px;
        }
        .task-title {
            font-size: 14px;
            color: #666;
        }
        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .task-item:last-child {
            border-bottom: none;
        }
        .task-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .task-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .icon-blue {
            background: #E6F4FF;
            color: #1890FF;
        }
        .icon-green {
            background: #E6FFE6;
            color: #52C41A;
        }
        .icon-orange {
            background: #FFF0E6;
            color: #FF6B35;
        }
        .icon-purple {
            background: #F3E6FF;
            color: #722ED1;
        }
        .task-name {
            font-size: 15px;
            color: #333;
            font-weight: 500;
        }
        .task-btn {
            background: linear-gradient(135deg, #FF6B35, #FF8C42);
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            padding: 6px 16px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
        }
        .task-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .task-completed {
            background: #F5F5F5;
            color: #999;
            font-size: 13px;
            padding: 6px 16px;
            border-radius: 16px;
        }
        /* 学习入口 */
        .learn-entry {
            display: flex;
            gap: 12px;
            padding: 0 16px;
            margin-bottom: 20px;
        }
        .entry-card {
            flex: 1;
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .entry-card:active {
            transform: scale(0.98);
        }
        .entry-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .entry-title {
            font-size: 15px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }
        .entry-status {
            font-size: 12px;
            color: #FF6B35;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .entry-status.completed {
            color: #52C41A;
        }
        /* 课程区域 */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            margin-bottom: 12px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }
        .section-more {
            font-size: 13px;
            color: #999;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }
        .course-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 16px;
            margin-bottom: 20px;
        }
        .course-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s;
        }
        .course-card:active {
            transform: scale(0.98);
        }
        .course-cover {
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .course-cover-1 {
            background: linear-gradient(135deg, #4A90E2, #357ABD);
        }
        .course-cover-2 {
            background: linear-gradient(135deg, #F5A623, #E8941A);
        }
        .course-cover-3 {
            background: linear-gradient(135deg, #52C41A, #389E0D);
        }
        .course-cover-4 {
            background: linear-gradient(135deg, #FF6B35, #E55A2B);
        }
        .course-emoji {
            font-size: 36px;
        }
        .course-play {
            position: absolute;
            right: 8px;
            bottom: 8px;
            width: 28px;
            height: 28px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 10px;
        }
        .course-info {
            padding: 12px;
        }
        .course-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .course-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #999;
        }
        .course-duration {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        /* 热门标签 */
        .hot-tags {
            padding: 0 16px;
            margin-bottom: 20px;
        }
        .tag-item {
            display: inline-block;
            background: #fff;
            border: 1px solid #FFE4D6;
            color: #FF6B35;
            font-size: 12px;
            padding: 6px 12px;
            border-radius: 14px;
            margin-right: 8px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .tag-item:hover {
            background: #FFF4E6;
        }
        .page-indicator {
            height: 5px;
            background: #000;
            border-radius: 3px;
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 134px;
        }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>

        <!-- 状态栏 -->
        <div class="status-bar">
            <span>19:48</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>

        <!-- 顶部导航 -->
        <div class="top-nav">
            <div class="nav-back" onclick="goBack()">
                <i class="fas fa-chevron-left text-gray-700 text-lg"></i>
            </div>
            <div class="nav-title">接单课堂</div>
            <div class="nav-right">
                <div class="nav-btn">
                    <i class="fas fa-ellipsis text-gray-700" style="font-size: 13px;"></i>
                </div>
                <div style="width: 1px; height: 14px; background: #ddd; margin: 0 2px;"></div>
                <div class="nav-btn">
                    <i class="fas fa-circle text-gray-700" style="font-size: 11px;"></i>
                </div>
            </div>
        </div>

        <!-- 内容区 -->
        <div class="content-area">
            <!-- 顶部横幅 -->
            <div class="hero-banner">
                <div class="hero-title">新手必学</div>
                <div class="hero-subtitle">帮你快速上手找活</div>
                <div class="hero-illustration">
                    <div style="font-size: 80px; text-align: center;">📚</div>
                </div>
            </div>

            <!-- 新人任务卡片 -->
            <div class="task-card">
                <div class="task-header">
                    <span class="task-badge">新人任务</span>
                    <span class="task-title">完成任务，获取接单资格</span>
                </div>
                <div class="task-item">
                    <div class="task-info">
                        <div class="task-icon icon-blue">
                            <i class="fas fa-clipboard-list"></i>
                        </div>
                        <span class="task-name">模拟接单-体验全流程</span>
                    </div>
                    <button class="task-btn" onclick="completeTask(this)">去完成</button>
                </div>
                <div class="task-item">
                    <div class="task-info">
                        <div class="task-icon icon-green">
                            <i class="fas fa-book"></i>
                        </div>
                        <span class="task-name">学习平台规则</span>
                    </div>
                    <button class="task-btn" onclick="goToRule()">去完成</button>
                </div>
                <div class="task-item">
                    <div class="task-info">
                        <div class="task-icon icon-orange">
                            <i class="fas fa-edit"></i>
                        </div>
                        <span class="task-name">答题测试</span>
                    </div>
                    <button class="task-btn" onclick="completeTask(this)">去完成</button>
                </div>
            </div>

            <!-- 学习入口 -->
            <div class="learn-entry">
                <div class="entry-card" onclick="navigateTo('course-order')">
                    <div class="entry-icon icon-blue">
                        <i class="fas fa-clipboard-list"></i>
                    </div>
                    <div class="entry-title">如何接单</div>
                    <div class="entry-status">未学习 ›</div>
                </div>
                <div class="entry-card" onclick="navigateTo('course-rule')">
                    <div class="entry-icon icon-green">
                        <i class="fas fa-book"></i>
                    </div>
                    <div class="entry-title">平台规则</div>
                    <div class="entry-status">未学习 ›</div>
                </div>
            </div>

            <!-- 赚钱接单攻略 -->
            <div class="section-header">
                <div class="section-title">赚钱接单攻略</div>
            </div>
            <div class="course-grid">
                <div class="course-card" onclick="navigateTo('course-video')">
                    <div class="course-cover course-cover-1">
                        <span class="course-emoji">⚡</span>
                        <div class="course-play">
                            <i class="fas fa-play"></i>
                        </div>
                    </div>
                    <div class="course-info">
                        <div class="course-title">抢日结操作流程</div>
                        <div class="course-meta">
                            <span class="course-duration">
                                <i class="fas fa-clock"></i> 3:20
                            </span>
                            <span>1.2万学习</span>
                        </div>
                    </div>
                </div>
                <div class="course-card" onclick="navigateTo('course-video')">
                    <div class="course-cover course-cover-2">
                        <span class="course-emoji">💰</span>
                        <div class="course-play">
                            <i class="fas fa-play"></i>
                        </div>
                    </div>
                    <div class="course-info">
                        <div class="course-title">1分钟让你学会多赚钱</div>
                        <div class="course-meta">
                            <span class="course-duration">
                                <i class="fas fa-clock"></i> 1:00
                            </span>
                            <span>8500学习</span>
                        </div>
                    </div>
                </div>
                <div class="course-card" onclick="navigateTo('course-video')">
                    <div class="course-cover course-cover-3">
                        <span class="course-emoji">📱</span>
                        <div class="course-play">
                            <i class="fas fa-play"></i>
                        </div>
                    </div>
                    <div class="course-info">
                        <div class="course-title">手机接单技巧</div>
                        <div class="course-meta">
                            <span class="course-duration">
                                <i class="fas fa-clock"></i> 5:30
                            </span>
                            <span>6200学习</span>
                        </div>
                    </div>
                </div>
                <div class="course-card" onclick="navigateTo('course-video')">
                    <div class="course-cover course-cover-4">
                        <span class="course-emoji">🎯</span>
                        <div class="course-play">
                            <i class="fas fa-play"></i>
                        </div>
                    </div>
                    <div class="course-info">
                        <div class="course-title">提高接单成功率</div>
                        <div class="course-meta">
                            <span class="course-duration">
                                <i class="fas fa-clock"></i> 4:15
                            </span>
                            <span>4300学习</span>
                        </div>
                    </div>
                </div>
            </div>

            <div style="height: 20px;"></div>
        </div>

        <!-- 底部指示条 -->
        <div class="page-indicator"></div>
    </div>

    <script>
        function goBack() {
            window.history.back();
        }

        function navigateTo(page) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance"];
            var path = page + '.html';
            if (workerPages.indexOf(page) < 0 && bossPages.indexOf(page) >= 0) {
                path = '../boss/' + path;
            } else if (workerPages.indexOf(page) < 0 && bossPages.indexOf(page) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }

        function completeTask(btn) {
            btn.textContent = '已完成';
            btn.className = 'task-completed';
            btn.disabled = true;
        }

        function goToRule() {
            navigateTo('rule');
        }

        function learnCourse(type) {
            const titles = {
                order: '如何接单',
                rule: '平台规则',
                skill1: '抢日结操作流程',
                skill2: '1分钟让你学会多赚钱',
                skill3: '手机接单技巧',
                skill4: '提高接单成功率'
            };
            alert('学习课程：' + titles[type]);
        }

        function showMore() {
            alert('查看更多课程');
        }
    </script>
</body>
</html>
