<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工种徽章 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame {
            width: 390px; height: 844px; background: #1a1a1a; overflow: hidden;
            position: relative; border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3); border: 10px solid #1a1a1a;
        }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #fff; background: #1a1a1a; }
        .content-area { position: absolute; top: 47px; left: 0; right: 0; bottom: 34px; overflow-y: auto; background: #1a1a1a; }
        .content-area::-webkit-scrollbar { display: none; }
        .page-indicator { height: 5px; background: #fff; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
        
        /* 导航栏 */
        .nav-bar { padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; background: #1a1a1a; }
        .nav-back { display: flex; align-items: center; cursor: pointer; width: 32px; height: 32px; }
        .nav-back i { color: #fff; }
        .nav-right { display: flex; align-items: center; background: rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 4px 6px; gap: 2px; }
        .nav-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
        .nav-btn i { color: #fff; }
        .nav-title { font-size: 17px; font-weight: 600; color: #fff; }
        
        /* 徽章统计 */
        .badge-header { text-align: center; padding: 30px 20px 20px; }
        .badge-count { font-size: 28px; font-weight: 700; color: #fff; }
        .badge-count span { font-size: 16px; color: #999; font-weight: 400; }
        .badge-tip { font-size: 13px; color: #666; margin-top: 8px; }
        
        /* 徽章展示区 */
        .badge-showcase { 
            display: flex; justify-content: center; align-items: center; 
            padding: 40px 20px; 
        }
        .badge-placeholder {
            width: 200px; height: 240px; position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .badge-icon {
            width: 160px; height: 160px; position: relative;
        }
        .badge-silhouette {
            width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,140,0,0.1));
            border-radius: 20px;
            border: 2px dashed rgba(255,215,0,0.3);
        }
        .badge-question { font-size: 36px; color: rgba(255,215,0,0.4); font-weight: 700; letter-spacing: 8px; }
        .badge-brand { font-size: 16px; color: rgba(255,215,0,0.5); font-weight: 600; letter-spacing: 4px; margin-top: 8px; }
        .badge-ribbon {
            width: 40px; height: 60px; background: linear-gradient(180deg, rgba(255,215,0,0.3), rgba(255,140,0,0.2));
            margin-top: -10px;
            clip-path: polygon(50% 100%, 0 0, 100% 0);
        }
        
        /* 空状态文字 */
        .empty-text { text-align: center; font-size: 14px; color: #666; margin-top: 20px; }
        
        /* 底部按钮 */
        .action-btn {
            margin: 40px 20px 20px;
            background: linear-gradient(135deg, #B8860B, #8B6914);
            color: white; padding: 16px; border-radius: 28px;
            text-align: center; font-size: 16px; font-weight: 600;
            cursor: pointer; letter-spacing: 2px;
        }
        
        /* 已获得徽章列表（预留） */
        .badge-list { padding: 20px 16px; }
        .badge-list-title { font-size: 16px; color: #fff; font-weight: 600; margin-bottom: 16px; }
        .badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .badge-item {
            aspect-ratio: 1; background: linear-gradient(135deg, #FFD700, #FFA500);
            border-radius: 12px; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .badge-item-locked {
            aspect-ratio: 1; background: rgba(255,255,255,0.05);
            border-radius: 12px; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            border: 1px dashed rgba(255,255,255,0.1);
        }
        .badge-item-icon { font-size: 24px; margin-bottom: 6px; }
        .badge-item-name { font-size: 11px; color: #fff; text-align: center; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-900 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>

        <div class="status-bar">
            <span>19:48</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>

        <div class="content-area">
            <!-- 导航栏 -->
            <div class="nav-bar">
                <div class="nav-back" onclick="goBack()">
                    <i class="fas fa-chevron-left"></i>
                </div>
                <div class="nav-title">工种徽章</div>
                <div class="nav-right">
                    <div class="nav-btn">
                        <i class="fas fa-ellipsis" style="font-size: 13px;"></i>
                    </div>
                    <div style="width: 1px; height: 14px; background: rgba(255,255,255,0.3); margin: 0 2px;"></div>
                    <div class="nav-btn">
                        <i class="fas fa-circle" style="font-size: 11px;"></i>
                    </div>
                </div>
            </div>

            <!-- 徽章统计 -->
            <div class="badge-header">
                <div class="badge-count">我的徽章 <span>0枚</span></div>
                <div class="badge-tip">点亮更多徽章，享受更多接单权益</div>
            </div>

            <!-- 徽章展示区 -->
            <div class="badge-showcase">
                <div class="badge-placeholder">
                    <div class="badge-icon">
                        <div class="badge-silhouette">
                            <div class="badge-question">???</div>
                            <div class="badge-brand">KUAIMA</div>
                        </div>
                    </div>
                    <div class="badge-ribbon"></div>
                </div>
            </div>

            <!-- 空状态文字 -->
            <div class="empty-text">暂未点亮任何徽章</div>

            <!-- 底部按钮 -->
            <div class="action-btn" onclick="navigateTo('home')">去接点亮</div>

            <!-- 已获得徽章列表（预留） -->
            <div class="badge-list" id="badgeList" style="display: none;">
                <div class="badge-list-title">已获得徽章</div>
                <div class="badge-grid">
                    <div class="badge-item">
                        <div class="badge-item-icon"><i class="fas fa-fire"></i></div>
                        <div class="badge-item-name">餐饮达人</div>
                    </div>
                    <div class="badge-item">
                        <div class="badge-item-icon"><i class="fas fa-truck"></i></div>
                        <div class="badge-item-name">物流先锋</div>
                    </div>
                    <div class="badge-item-locked">
                        <div class="badge-item-icon" style="color: rgba(255,255,255,0.2);">
                            <i class="fas fa-question"></i>
                        </div>
                        <div class="badge-item-name" style="color: rgba(255,255,255,0.3);">未解锁</div>
                    </div>
                </div>
            </div>

            <div style="height: 20px;"></div>
        </div>

        <div class="page-indicator"></div>
    </div>

    <script>
        function navigateTo(pageName) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance"];
            var path = pageName + '.html';
            if (workerPages.indexOf(pageName) < 0 && bossPages.indexOf(pageName) >= 0) {
                path = '../boss/' + path;
            } else if (workerPages.indexOf(pageName) < 0 && bossPages.indexOf(pageName) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }


        function goBack() { window.history.back(); }
    </script>
</body>
</html>
