<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>完善找活意向 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame {
            width: 390px; height: 844px; background: #fff; overflow: hidden;
            position: relative; border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
        }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }
        .nav-bar { padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; background: #fff; }
        .nav-back { display: flex; align-items: center; cursor: pointer; width: 32px; height: 32px; }
        .nav-right { display: flex; align-items: center; background: rgba(255, 255, 255, 0.9); border-radius: 20px; padding: 4px 6px; gap: 2px; }
        .nav-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
        .content-area { position: absolute; top: 47px; left: 0; right: 0; bottom: 34px; overflow-y: auto; background: #f5f5f5; }
        .content-area::-webkit-scrollbar { display: none; }
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
        
        /* 顶部区域 */
        .top-section {
            background: linear-gradient(135deg, #FFE4B5 0%, #FFD59E 100%);
            padding: 16px 20px 24px; position: relative;
        }
        .top-tag {
            position: absolute; top: 16px; right: 16px;
            background: linear-gradient(135deg, #FF6B35, #FF8C5A);
            color: white; padding: 4px 12px; border-radius: 12px;
            font-size: 11px; font-weight: 500;
        }
        .page-title { font-size: 22px; font-weight: 700; color: #333; margin-top: 8px; }
        .tip-text { font-size: 14px; color: #FF6B35; margin-top: 8px; font-weight: 500; }
        
        /* 图表区域 */
        .chart-section {
            margin: -12px 16px 16px; background: white; border-radius: 12px;
            padding: 20px; position: relative; overflow: hidden;
        }
        .chart-visual {
            height: 80px; position: relative; margin-bottom: 12px;
        }
        .chart-line {
            position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
            background: #f0f0f0;
        }
        .chart-path {
            position: absolute; bottom: 0; left: 20px;
            width: calc(100% - 40px); height: 100%;
        }
        .node {
            position: absolute; width: 12px; height: 12px; border-radius: 50%;
            background: #FF6B35; border: 3px solid #FFE4B5;
        }
        .node-start { left: 0; bottom: 2px; }
        .node-end { right: 0; top: 0; }
        .chart-arrow {
            position: absolute; right: 4px; top: 0;
            color: #FF6B35; font-size: 14px;
        }
        .chart-label {
            display: flex; justify-content: space-between; align-items: center;
        }
        .label-before { font-size: 13px; color: #999; }
        .label-after { font-size: 13px; color: #FF6B35; font-weight: 500; }
        .label-after span { color: #FF6B35; font-weight: 700; }
        
        /* 列表项 */
        .form-list { background: white; margin: 0 16px; border-radius: 12px; overflow: hidden; }
        .form-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px; border-bottom: 1px solid #f5f5f5; cursor: pointer;
        }
        .form-item:last-child { border-bottom: none; }
        .form-item-title { font-size: 15px; color: #333; font-weight: 500; }
        .form-item-status { font-size: 13px; color: #FF6B35; display: flex; align-items: center; gap: 4px; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>

        <div class="status-bar">
            <span>19:48</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>

        <div class="content-area">
            <!-- 导航栏 -->
            <div class="nav-bar" style="background: linear-gradient(135deg, #FFE4B5 0%, #FFD59E 100%);">
                <div class="nav-back" onclick="goBack()">
                    <i class="fas fa-chevron-left text-gray-700"></i>
                </div>
                <div class="nav-title" style="font-size: 17px; font-weight: 600; color: #333; position: absolute; left: 50%; transform: translateX(-50%);">完善找活意向</div>
                <div class="nav-right">
                    <div class="nav-btn">
                        <i class="fas fa-ellipsis text-gray-700" style="font-size: 13px;"></i>
                    </div>
                    <div style="width: 1px; height: 14px; background: #ddd; margin: 0 2px;"></div>
                    <div class="nav-btn">
                        <i class="fas fa-circle text-gray-700" style="font-size: 11px;"></i>
                    </div>
                </div>
            </div>

            <!-- 顶部区域 -->
            <div class="top-section">
                <div class="top-tag">填写后</div>
                <div class="page-title">完善找活意向</div>
                <div class="tip-text">找活成功率提升200%</div>
            </div>

            <!-- 图表区域 -->
            <div class="chart-section">
                <div class="chart-visual">
                    <svg viewBox="0 0 300 80" style="width: 100%; height: 100%;" preserveAspectRatio="none">
                        <!-- 背景线 -->
                        <line x1="0" y1="75" x2="300" y2="75" stroke="#f0f0f0" stroke-width="2" />
                        <!-- 增长曲线 -->
                        <path d="M 10 75 Q 80 65, 120 50 T 200 25 T 290 5" 
                              fill="none" stroke="#FF6B35" stroke-width="2.5" stroke-linecap="round"/>
                        <!-- 起点圆 -->
                        <circle cx="10" cy="75" r="6" fill="#FF6B35" stroke="#FFE4B5" stroke-width="3"/>
                        <!-- 终点圆 -->
                        <circle cx="290" cy="5" r="6" fill="#FF6B35" stroke="#FFE4B5" stroke-width="3"/>
                        <!-- 箭头 -->
                        <polygon points="286,0 294,0 290,-6" fill="#FF6B35" transform="rotate(45 290 0)"/>
                    </svg>
                </div>
                <div class="chart-label">
                    <div class="label-before">填写前</div>
                    <div class="label-after">成功率 <span>+200%</span></div>
                </div>
            </div>

            <!-- 表单列表 -->
            <div class="form-list">
                <div class="form-item" onclick="navigateTo('intent-personal')">
                    <div class="form-item-title">个人信息</div>
                    <div class="form-item-status">
                        待完善 <i class="fas fa-chevron-right" style="font-size:10px;"></i>
                    </div>
                </div>
                <div class="form-item" onclick="navigateTo('intent-job')">
                    <div class="form-item-title">找活意向</div>
                    <div class="form-item-status">
                        待完善 <i class="fas fa-chevron-right" style="font-size:10px;"></i>
                    </div>
                </div>
                <div class="form-item" onclick="navigateTo('intent-preference')">
                    <div class="form-item-title">找活偏好</div>
                    <div class="form-item-status">
                        待完善 <i class="fas fa-chevron-right" style="font-size:10px;"></i>
                    </div>
                </div>
            </div>

            <div style="height: 20px;"></div>
        </div>

        <div class="page-indicator"></div>
    </div>

    <script>
        function navigateTo(pageName) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "follow-qrcode", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "intent-personal", "intent-job", "intent-preference", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance"];
            var path = pageName + '.html';
            if (workerPages.indexOf(pageName) < 0 && bossPages.indexOf(pageName) >= 0) {
                path = '../boss/' + path;
            } else if (workerPages.indexOf(pageName) < 0 && bossPages.indexOf(pageName) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }


        function goBack() { window.history.back(); }
    </script>
</body>
</html>
