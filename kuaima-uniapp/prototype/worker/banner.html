<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>千日结奖励 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .phone-frame {
            width: 390px;
            height: 844px;
            background: #fff;
            overflow: hidden;
            position: relative;
            border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            border: 10px solid #1a1a1a;
        }
        .dynamic-island {
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 35px;
            background: #000;
            border-radius: 20px;
            z-index: 50;
        }
        .status-bar {
            height: 47px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 28px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            background: transparent;
        }
        .top-nav {
            padding: 8px 16px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: transparent;
            position: absolute;
            top: 47px;
            left: 0;
            right: 0;
            height: 52px;
            z-index: 10;
        }
        .nav-back {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
        }
        .nav-title {
            font-size: 17px;
            font-weight: 600;
            color: #fff;
        }
        .nav-right {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 4px 6px;
            gap: 2px;
        }
        .nav-btn {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero-section {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 300px;
            background: linear-gradient(180deg, #FF6B35 0%, #FF4757 100%);
            overflow: hidden;
        }
        .hero-section::after {
            content: '';
            position: absolute;
            right: -50px;
            bottom: -50px;
            width: 200px;
            height: 200px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }
        .hero-section::before {
            content: '';
            position: absolute;
            right: 100px;
            top: 50px;
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }
        .hero-badge {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: #fff;
        }
        .hero-title {
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            font-weight: 800;
            color: #fff;
            text-align: center;
        }
        .hero-amount {
            position: absolute;
            top: 165px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        .hero-amount span {
            font-size: 24px;
            font-weight: 600;
        }
        .hero-desc {
            position: absolute;
            top: 230px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
        }
        .content-area {
            position: absolute;
            top: 300px;
            left: 0;
            right: 0;
            bottom: 0;
            overflow-y: auto;
            background: #fff;
            border-radius: 24px 24px 0 0;
        }
        .content-card {
            background: #fff;
            margin: -20px 16px 16px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            position: relative;
            z-index: 10;
        }
        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .reward-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        .reward-item {
            text-align: center;
        }
        .reward-circle {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #FFF4E6, #FFE4B5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
        }
        .reward-icon {
            font-size: 20px;
        }
        .reward-days {
            font-size: 16px;
            font-weight: 700;
            color: #FF6B35;
        }
        .reward-amount {
            font-size: 12px;
            color: #999;
        }
        .rule-section {
            background: #fff;
            margin: 0 16px 16px;
            border-radius: 16px;
            padding: 20px;
        }
        .rule-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .rule-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }
        .rule-item:last-child {
            margin-bottom: 0;
        }
        .rule-dot {
            width: 20px;
            height: 20px;
            background: #FFF4E6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #FF6B35;
            flex-shrink: 0;
        }
        .participate-btn {
            background: linear-gradient(135deg, #FF6B35, #FF8C42);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            padding: 16px;
            border-radius: 28px;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(255, 107, 53, 0.3);
            width: calc(100% - 32px);
            margin: 0 16px 20px;
        }
        .page-indicator {
            height: 5px;
            background: #000;
            border-radius: 3px;
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 134px;
        }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>

        <!-- 英雄区域 -->
        <div class="hero-section">
            <!-- 状态栏 -->
            <div class="status-bar">
                <span>19:48</span>
                <div class="flex items-center gap-1">
                    <i class="fas fa-signal text-sm"></i>
                    <i class="fas fa-wifi text-sm"></i>
                    <i class="fas fa-battery-full text-sm"></i>
                </div>
            </div>

            <!-- 顶部导航 -->
            <div class="top-nav">
                <div class="nav-back" onclick="goBack()">
                    <i class="fas fa-chevron-left text-white text-lg"></i>
                </div>
                <div class="nav-title">千日结奖励</div>
                <div class="nav-right">
                    <div class="nav-btn">
                        <i class="fas fa-ellipsis text-white" style="font-size: 13px;"></i>
                    </div>
                    <div style="width: 1px; height: 14px; background: rgba(255,255,255,0.5); margin: 0 2px;"></div>
                    <div class="nav-btn">
                        <i class="fas fa-circle text-white" style="font-size: 11px;"></i>
                    </div>
                </div>
            </div>

            <div class="hero-badge">🔥 限时活动</div>
            <div class="hero-title">千日结 奖励</div>
            <div class="hero-amount"><span>额外</span>600<span>元</span></div>
            <div class="hero-desc">连续接单日结，最高奖励600元</div>
        </div>

        <!-- 内容区 -->
        <div class="content-area">
            <!-- 奖励卡片 -->
            <div class="content-card">
                <div class="card-title">
                    <i class="fas fa-gift text-orange-500"></i>
                    <span>奖励明细</span>
                </div>
                <div class="reward-grid">
                    <div class="reward-item">
                        <div class="reward-circle">
                            <i class="fas fa-1 reward-icon"></i>
                        </div>
                        <div class="reward-days">1天</div>
                        <div class="reward-amount">20元</div>
                    </div>
                    <div class="reward-item">
                        <div class="reward-circle">
                            <i class="fas-2 reward-icon"></i>
                        </div>
                        <div class="reward-days">3天</div>
                        <div class="reward-amount">80元</div>
                    </div>
                    <div class="reward-item">
                        <div class="reward-circle">
                            <i class="fas-3 reward-icon"></i>
                        </div>
                        <div class="reward-days">7天</div>
                        <div class="reward-amount">200元</div>
                    </div>
                    <div class="reward-item">
                        <div class="reward-circle">
                            <i class="fas-4 reward-icon"></i>
                        </div>
                        <div class="reward-days">15天</div>
                        <div class="reward-amount">600元</div>
                    </div>
                </div>
            </div>

            <!-- 活动规则 -->
            <div class="rule-section">
                <div class="rule-title">
                    <i class="fas fa-book text-orange-500"></i>
                    <span>活动规则</span>
                </div>
                <div class="rule-item">
                    <div class="rule-dot">1</div>
                    <span>活动期间，连续接单日结岗位并完成打卡，即可获得对应奖励</span>
                </div>
                <div class="rule-item">
                    <div class="rule-dot">2</div>
                    <span>需完成当日全部工作时长，中途离职不参与当日统计</span>
                </div>
                <div class="rule-item">
                    <div class="rule-dot">3</div>
                    <span>奖励金额将在次月10日前统一发放至您的账户</span>
                </div>
                <div class="rule-item">
                    <div class="rule-dot">4</div>
                    <span>如有违规行为（如飞单、虚假打卡等），将取消奖励资格</span>
                </div>
            </div>

            <!-- 参与按钮 -->
            <button class="participate-btn" onclick="participate()">
                立即参与
            </button>

            <div style="height: 40px;"></div>
        </div>

        <!-- 底部指示器 -->
        <div class="page-indicator"></div>
    </div>

    <script>
        function navigateTo(page) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance"];
            var path = page + '.html';
            if (workerPages.indexOf(page) < 0 && bossPages.indexOf(page) >= 0) {
                path = '../boss/' + path;
            } else if (workerPages.indexOf(page) < 0 && bossPages.indexOf(page) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }


        function goBack() {
            window.history.back();
        }

        function participate() {
            alert('🎉 恭喜您已成功参与活动！快去接单赚钱吧！');
        }
    </script>
</body>
</html>
