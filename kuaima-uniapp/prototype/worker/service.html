<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系客服 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame {
            width: 390px; height: 844px; background: #fff; overflow: hidden;
            position: relative; border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
        }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }
        .nav-bar { padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; background: #fff; }
        .nav-back { display: flex; align-items: center; cursor: pointer; width: 32px; height: 32px; }
        .nav-right { display: flex; align-items: center; background: rgba(255, 255, 255, 0.9); border-radius: 20px; padding: 4px 6px; gap: 2px; }
        .nav-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
        .content-area { position: absolute; top: 47px; left: 0; right: 0; bottom: 34px; overflow-y: auto; background: #f5f5f5; }
        .content-area::-webkit-scrollbar { display: none; }
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
        
        /* 顶部提示 */
        .top-tip {
            background: #FFF2F0; padding: 12px 16px;
            font-size: 12px; color: #FF4D4F; text-align: center;
        }
        
        /* 问题列表 */
        .question-section { background: white; margin: 12px; border-radius: 12px; overflow: hidden; }
        .question-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px; border-bottom: 1px solid #f5f5f5; cursor: pointer;
        }
        .question-item:last-child { border-bottom: none; }
        .question-text { font-size: 14px; color: #333; }

        /* 联系客服 */
        .contact-section {
            background: #fff;
            margin: 12px;
            border-radius: 12px;
            padding: 20px 16px;
            text-align: center;
        }
        .contact-tip {
            font-size: 13px;
            color: #999;
            margin-bottom: 14px;
        }
        .contact-btn-primary {
            background: linear-gradient(135deg, #FF6B35, #FF8C5A);
            color: #fff;
            border: none;
            padding: 12px 40px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>

        <div class="status-bar">
            <span>19:48</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>

        <div class="content-area">
            <!-- 导航栏 -->
            <div class="nav-bar">
                <div class="nav-back" onclick="goBack()">
                    <i class="fas fa-chevron-left text-gray-700"></i>
                </div>
                <div class="nav-title" style="font-size: 17px; font-weight: 600; color: #333; position: absolute; left: 50%; transform: translateX(-50%);">请选择咨询内容</div>
                <div class="nav-right">
                    <div class="nav-btn">
                        <i class="fas fa-ellipsis text-gray-700" style="font-size: 13px;"></i>
                    </div>
                    <div style="width: 1px; height: 14px; background: #ddd; margin: 0 2px;"></div>
                    <div class="nav-btn">
                        <i class="fas fa-circle text-gray-700" style="font-size: 11px;"></i>
                    </div>
                </div>
            </div>

            <!-- 顶部提示 -->
            <div class="top-tip">请文明沟通，禁止辱骂客服或人身攻击，否则终身封号。</div>

            <!-- 常见问题列表 -->
            <div class="question-section">
                <div class="question-item" onclick="navigateTo('faq-detail')">
                    <div class="question-text">老板还没有结算报酬</div>
                    <i class="fas fa-chevron-right text-gray-400" style="font-size: 12px;"></i>
                </div>
                <div class="question-item" onclick="navigateTo('faq-detail')">
                    <div class="question-text">这个订单有事去不了/不小心取消</div>
                    <i class="fas fa-chevron-right text-gray-400" style="font-size: 12px;"></i>
                </div>
                <div class="question-item" onclick="navigateTo('faq-detail')">
                    <div class="question-text">到达地方联系不上老板</div>
                    <i class="fas fa-chevron-right text-gray-400" style="font-size: 12px;"></i>
                </div>
                <div class="question-item" onclick="navigateTo('faq-detail')">
                    <div class="question-text">我申诉了，多久会处理？</div>
                    <i class="fas fa-chevron-right text-gray-400" style="font-size: 12px;"></i>
                </div>
                <div class="question-item" onclick="navigateTo('faq-detail')">
                    <div class="question-text">订单有没有固定的刷新时间</div>
                    <i class="fas fa-chevron-right text-gray-400" style="font-size: 12px;"></i>
                </div>
            </div>

            <!-- 联系客服 -->
            <div class="contact-section">
                <div class="contact-tip">以上内容未能解决您的问题？</div>
                <button class="contact-btn-primary" onclick="navigateTo('service-chat')">
                    <i class="fas fa-headset"></i>
                    <span>联系客服</span>
                </button>
            </div>

            <div style="height: 20px;"></div>
        </div>

        <div class="page-indicator"></div>
    </div>

    <script>
        function navigateTo(pageName) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message", "service-chat"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance"];

            var basePage = pageName;
            var queryStr = '';
            var qIdx = pageName.indexOf('?');
            if (qIdx >= 0) {
                basePage = pageName.substring(0, qIdx);
                queryStr = pageName.substring(qIdx);
            }

            var path = basePage + '.html' + queryStr;
            if (workerPages.indexOf(basePage) < 0 && bossPages.indexOf(basePage) >= 0) {
                path = '../boss/' + path;
            } else if (workerPages.indexOf(basePage) < 0 && bossPages.indexOf(basePage) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }


        function goBack() { window.history.back(); }
    </script>
</body>
</html>
