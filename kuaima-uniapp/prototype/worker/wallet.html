        /* 提现按钮 */
        .submit-btn {

        /* 提现金额 */
        .amount-input-wrap {

        /* 提示信息 */

        }
        .tip-icon { color: #FF6B35; font-size: 14px; flex-shrink: 0; margin-top: 1px; }
        .tip-text { font-size: 12px; color: #999; line-height: 1.6; }
        
        /* 空状态 */
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-icon { font-size: 80px; color: #FFD700; margin-bottom: 20px; }
        .empty-text { font-size: 14px; color: #999; }
        
        /* 明细列表 */
        .detail-list { background: white; }
        .detail-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px; border-bottom: 1px solid #f5f5f5;
        }
        .detail-left { display: flex; align-items: center; gap: 12px; }
        .detail-icon {
            width: 40px; height: 40px; border-radius: 50%;

        .detail-icon.withdraw { background: #FFF1F0; color: #FF4D4F; }
        .detail-title { font-size: 15px; color: #333; font-weight: 500; }

        .detail-amount { font-size: 16px; font-weight: 600; }
        .detail-amount.income { color: #FF6B35; }
        .detail-amount.withdraw { color: #999; }
        
        /* 提现成功弹窗 */
        .success-modal {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 300;
            display: none; justify-content: center; align-items: center;
        }
        .success-modal.show { display: flex; }
        .success-content {
            background: white; border-radius: 20px; padding: 30px 24px;
            width: 280px; text-align: center;
        }
        .success-icon {
            width: 64px; height: 64px; background: #E8F8E8; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
        }
        .success-icon i { font-size: 32px; color: #52C41A; }
        .success-title { font-size: 18px; font-weight: 600; color: #333; }
        .success-desc { font-size: 14px; color: #666; margin-top: 8px; line-height: 1.5; }
        .success-btn {
            background: linear-gradient(135deg, #FF6B35, #FF8C5A);
            color: white; padding: 12px 40px; border-radius: 20px;
            font-size: 15px; font-weight: 600; cursor: pointer; border: none;
            margin-top: 24px;
        }
    </style>

    <script>
        // 银行列表
        var bankList = [
            { name: '中国工商银行', color: '#C7000B', short: 'ICBC' },
            { name: '中国建设银行', color: '#0066B3', short: 'CCB' },
            { name: '中国农业银行', color: '#009966', short: 'ABC' },
            { name: '中国银行', color: '#C7000B', short: 'BOC' },

            { name: '招商银行', color: '#CC0000', short: 'CMB' },
            { name: '中国邮政储蓄银行', color: '#006B3C', short: 'PSBC' },
            { name: '兴业银行', color: '#006699', short: 'CIB' },
            { name: '浦发银行', color: '#003366', short: 'SPDB' },

            { name: '南京银行', color: '#7B1FA2', short: 'NJB' }
        ];

        var selectedAccountType = null;
        var selectedBank = null;
        var availableBalance = 0.00;

        function navigateTo(pageName) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance"];
            var path = pageName + '.html';
            if (workerPages.indexOf(pageName) < 0 && bossPages.indexOf(pageName) >= 0) {
                path = '../boss/' + path;
            } else if (workerPages.indexOf(pageName) < 0 && bossPages.indexOf(pageName) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }

        function goBack() { window.history.back(); }

        function scrollToWithdraw() {
            document.getElementById('withdraw-form-section').scrollIntoView({ behavior: 'smooth' });
        }

        function selectAccountType(type) {
            selectedAccountType = type;
            document.querySelectorAll('.account-type-item').forEach(function(item) {
                item.classList.toggle('active', item.dataset.type === type);
            });
            
            var accountForm = document.getElementById('account-form');
            accountForm.style.display = 'block';
            
            document.getElementById('wechat-form').style.display = type === 'wechat' ? 'block' : 'none';
            document.getElementById('alipay-form').style.display = type === 'alipay' ? 'block' : 'none';
            document.getElementById('bank-form').style.display = type === 'bank' ? 'block' : 'none';
        }

        function setMaxAmount() {
            document.getElementById('withdraw-amount').value = availableBalance.toFixed(2);
        }

        function updateWithdrawAmount() {}

        function openBankModal() {
            renderBankList('');
            document.getElementById('bank-modal').classList.add('show');
        }

        function closeBankModal(event) {
            if (event && event.target && event.target.id !== 'bank-modal' && event.type === 'click') {
                return;
            }
            if (!event || event.target.id === 'bank-modal' || !event) {
                document.getElementById('bank-modal').classList.remove('show');
            }
        }

        function renderBankList(keyword) {
            var list = document.getElementById('bank-list');
            var filtered = keyword ? bankList.filter(function(b) {
                return b.name.indexOf(keyword) >= 0 || b.short.toLowerCase().indexOf(keyword.toLowerCase()) >= 0;
            }) : bankList;
            
            list.innerHTML = filtered.map(function(bank) {
                var isSelected = selectedBank && selectedBank.name === bank.name;
                return '<div class="bank-item" onclick="selectBank(\'' + bank.name.replace(/'/g, "\\'") + '\')">' +
                    '<div class="bank-item-icon" style="background:' + bank.color + ';">' + bank.short.substring(0, 2) + '</div>' +
                    '<div class="bank-item-info"><div class="bank-item-name' + (isSelected ? ' bank-item-selected' : '') + '">' + bank.name + '</div></div>' +
                    (isSelected ? '<i class="fas fa-check" style="color:#FF6B35;"></i>' : '') +
                '</div>';
            }).join('');
        }

        function filterBanks() {
            var keyword = document.getElementById('bank-search').value.trim();
            renderBankList(keyword);
        }

        function selectBank(bankName) {
            selectedBank = bankList.find(function(b) { return b.name === bankName; });
            var display = document.getElementById('bank-display');
            display.textContent = bankName;
            display.classList.remove('placeholder');
            document.getElementById('bank-select').classList.remove('placeholder');
            document.getElementById('bank-modal').classList.remove('show');
        }

        function validateForm() {
            var amount = parseFloat(document.getElementById('withdraw-amount').value);
            if (!amount || amount <= 0) {
                alert('请输入有效的提现金额');
                return false;
            }
            if (amount > availableBalance) {
                alert('提现金额不能超过可用余额');
                return false;
            }
            if (!selectedAccountType) {
                alert('请选择提现账号类型');
                return false;
            }
            
            if (selectedAccountType === 'wechat') {
                var wechatAccount = document.getElementById('wechat-account').value.trim();
                var wechatName = document.getElementById('wechat-name').value.trim();
                if (!wechatAccount) { alert('请输入微信账号'); return false; }
                if (!wechatName) { alert('请输入真实姓名'); return false; }
            } else if (selectedAccountType === 'alipay') {
                var alipayAccount = document.getElementById('alipay-account').value.trim();
                var alipayName = document.getElementById('alipay-name').value.trim();
                if (!alipayAccount) { alert('请输入支付宝账号'); return false; }
                if (!alipayName) { alert('请输入真实姓名'); return false; }
            } else if (selectedAccountType === 'bank') {
                if (!selectedBank) { alert('请选择开户银行'); return false; }
                var bankCardNo = document.getElementById('bank-card-no').value.trim();
                var bankName = document.getElementById('bank-name').value.trim();
                if (!bankCardNo) { alert('请输入银行卡号'); return false; }
                if (!bankName) { alert('请输入持卡人姓名'); return false; }
                if (!/^\d{16,19}$/.test(bankCardNo)) { alert('请输入正确的银行卡号'); return false; }
            }
            return true;
        }

        function submitWithdraw() {
            if (availableBalance <= 0) {
                alert('当前无可提现余额');
                return;
            }
            if (!validateForm()) return;
            
            var amount = document.getElementById('withdraw-amount').value;
            var typeNames = { wechat: '微信', alipay: '支付宝', bank: '银行' };
            var desc = '提现金额 ¥' + amount + ' 将在1-3个工作日内到账';
            document.getElementById('success-desc').textContent = desc;
            document.getElementById('success-modal').classList.add('show');
        }

        function closeSuccessModal() {
            document.getElementById('success-modal').classList.remove('show');
            resetForm();
        }

        function resetForm() {
            document.getElementById('withdraw-amount').value = '';
            document.getElementById('account-form').style.display = 'none';
            document.getElementById('wechat-form').style.display = 'none';
            document.getElementById('alipay-form').style.display = 'none';
            document.getElementById('bank-form').style.display = 'none';
            document.querySelectorAll('.account-type-item').forEach(function(item) {
                item.classList.remove('active');
            });
            selectedAccountType = null;
            selectedBank = null;
            ['wechat-account', 'wechat-name', 'alipay-account', 'alipay-name', 'bank-card-no', 'bank-name', 'bank-branch'].forEach(function(id) {
                document.getElementById(id).value = '';
            });
            document.getElementById('bank-display').textContent = '请选择开户银行';
            document.getElementById('bank-display').classList.add('placeholder');
        }

        // 提现记录数据
        var withdrawRecords = [
            {
                id: 1,
                type: 'wechat',
                typeName: '微信支付',
                account: '138****8888',
                amount: 100.00,
                status: 'success',

            },
            {
                id: 3,

                icon: 'fas fa-university'

        ];

        function switchTab(tab) {
            var tabWithdraw = document.getElementById('tab-withdraw');
            var tabRecord = document.getElementById('tab-record');
            var withdrawSection = document.getElementById('withdraw-form-section');
            var recordView = document.getElementById('record-view');
            var detailList = document.querySelector('.detail-list');
            var detailTitle = document.querySelector('.content-area > div:nth-child(4)');
            
            if (tab === 'withdraw') {
                tabWithdraw.classList.add('active');
                tabRecord.classList.remove('active');
                withdrawSection.style.display = 'block';
                recordView.style.display = 'none';
                if (detailList) detailList.style.display = 'block';
                if (detailTitle) detailTitle.style.display = 'block';
            } else {
                tabWithdraw.classList.remove('active');
                tabRecord.classList.add('active');
                withdrawSection.style.display = 'none';
                recordView.style.display = 'block';
                if (detailList) detailList.style.display = 'none';
                if (detailTitle) detailTitle.style.display = 'none';
                renderWithdrawRecords();
            }
        }

        function renderWithdrawRecords() {
            var list = document.getElementById('record-list');
            if (withdrawRecords.length === 0) {
                list.innerHTML = '<div class="empty-record">' +
                    '<div class="empty-record-icon"><i class="fas fa-inbox"></i></div>' +
                    '<div class="empty-record-text">暂无提现记录</div>' +
                    '<div class="empty-record-hint">完成订单后即可申请提现</div>' +
                '</div>';
                return;
            }
            
            list.innerHTML = withdrawRecords.map(function(record) {
                var statusClass = 'status-tag ' + record.status;
                var iconClass = 'record-icon ' + record.type;
                return '<div class="record-item">' +
                    '<div class="' + iconClass + '"><i class="' + record.icon + '"></i></div>' +
                    '<div class="record-info">' +
                        '<div class="record-title">提现到' + record.typeName + '</div>' +
                        '<div class="record-account">账号：' + record.account + '</div>' +
                        '<div class="record-time">' + record.time + '</div>' +
                    '</div>' +
                    '<div class="record-right">' +
                        '<div class="record-amount">-¥' + record.amount.toFixed(2) + '</div>' +
                        '<div class="record-status"><span class="' + statusClass + '">' + record.statusText + '</span></div>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function showWithdrawHistory() {
            switchTab('record');
        }

        // 页面加载时检查URL参数
        window.addEventListener('DOMContentLoaded', function() {
            var params = new URLSearchParams(window.location.search);
            var tab = params.get('tab');
            if (tab === 'record') {
                switchTab('record');
            }
        });
    </script>
