<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关注老板 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame {
            width: 390px; height: 844px; background: #fff; overflow: hidden;
            position: relative; border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
        }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }
        .nav-bar { padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; background: #fff; }
        .nav-back { display: flex; align-items: center; cursor: pointer; width: 32px; height: 32px; }
        .nav-right { display: flex; align-items: center; background: rgba(255, 255, 255, 0.9); border-radius: 20px; padding: 4px 6px; gap: 2px; }
        .nav-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
        .nav-title { font-size: 17px; font-weight: 600; color: #333; }
        .top-nav { position: absolute; top: 47px; left: 0; right: 0; height: 52px; background: #fff; z-index: 10; }
        .content-area { position: absolute; top: 99px; left: 0; right: 0; bottom: 80px; overflow-y: auto; background: #f5f5f5; }
        .content-area::-webkit-scrollbar { display: none; }
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
        
        /* Tab切换 */
        .tabs { 
            display: flex; background: white; padding: 0 16px; 
            border-bottom: 1px solid #f0f0f0; 
            position: absolute; top: 99px; left: 0; right: 0; height: 48px;
        }
        .tab-item { 
            flex: 1; text-align: center; padding: 14px 0; font-size: 16px; 
            color: #666; cursor: pointer; position: relative;
        }
        .tab-item.active { color: #FF6B35; font-weight: 600; }
        .tab-item.active::after {
            content: ''; position: absolute; bottom: 0; left: 50%;
            transform: translateX(-50%); width: 30px; height: 3px;
            background: #FF6B35; border-radius: 2px;
        }
        
        /* 提示条 */
        .tip-banner {
            background: linear-gradient(135deg, #FFE4B5 0%, #FFD59E 100%);
            margin: 12px; border-radius: 12px; padding: 14px 16px;
        }
        .tip-text { font-size: 14px; color: #8B4513; font-weight: 500; }
        .tip-link { font-size: 13px; color: #FF6B35; margin-top: 6px; cursor: pointer; display: inline-block; }
        
        /* 空状态 */
        .empty-state { text-align: center; padding: 80px 40px; }
        .empty-icon { font-size: 100px; color: #FFE4B5; margin-bottom: 20px; }
        .empty-text { font-size: 15px; color: #999; }
        
        /* 底部按钮 */
        .bottom-btn {
            position: absolute; bottom: 34px; left: 16px; right: 16px;
            background: linear-gradient(135deg, #FFE4B5, #FFD700);
            color: #8B4513; padding: 16px; border-radius: 28px;
            text-align: center; font-size: 16px; font-weight: 600;
            cursor: pointer;
        }
        
        /* 关注老板列表 */
        .boss-list { padding: 0 12px; }
        .boss-item {
            display: flex; align-items: center; padding: 14px;
            background: white; border-radius: 12px; margin-bottom: 10px;
        }
        .boss-avatar {
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(135deg, #FFE4B5, #FFD59E);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: #FF6B35; margin-right: 12px;
        }
        .boss-info { flex: 1; }
        .boss-name { font-size: 15px; font-weight: 600; color: #333; }
        .boss-jobs { font-size: 12px; color: #999; margin-top: 4px; }
        .boss-follow-btn {
            padding: 8px 16px; border-radius: 16px; font-size: 13px;
            background: #FFF2F0; color: #FF6B35; cursor: pointer;
        }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>

        <div class="status-bar">
            <span>19:48</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>

        <div class="top-nav">
            <div class="nav-bar">
                <div class="nav-back" onclick="goBack()">
                    <i class="fas fa-chevron-left text-gray-700"></i>
                </div>
                <div class="nav-title">关注老板</div>
                <div class="nav-right">
                    <div class="nav-btn">
                        <i class="fas fa-ellipsis text-gray-700" style="font-size: 13px;"></i>
                    </div>
                    <div style="width: 1px; height: 14px; background: #ddd; margin: 0 2px;"></div>
                    <div class="nav-btn">
                        <i class="fas fa-circle text-gray-700" style="font-size: 11px;"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab切换 -->
        <div class="tabs">
            <div class="tab-item active" onclick="switchTab(this, 'follow')">关注老板</div>
            <div class="tab-item" onclick="switchTab(this, 'boss')">老雇主</div>
        </div>

        <div class="content-area" style="top: 147px; bottom: 130px;">
            <!-- 提示条 -->
            <div class="tip-banner">
                <div class="tip-text">关注老板数量已达上限，提升星级可关注更多老板</div>
                <div class="tip-link" onclick="navigateTo('star-level')">查看星级权益 ></div>
            </div>

            <!-- 空状态 -->
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">
                    <i class="fas fa-box-open"></i>
                </div>
                <div class="empty-text">暂无相关内容</div>
            </div>

            <!-- 关注老板列表（默认隐藏） -->
            <div class="boss-list" id="bossList" style="display: none;">
                <div class="boss-item">
                    <div class="boss-avatar"><i class="fas fa-store"></i></div>
                    <div class="boss-info">
                        <div class="boss-name">泗泾餐饮</div>
                        <div class="boss-jobs">发布岗位 5 个</div>
                    </div>
                    <div class="boss-follow-btn" onclick="unfollow(this)">已关注</div>
                </div>
                <div class="boss-item">
                    <div class="boss-avatar"><i class="fas fa-warehouse"></i></div>
                    <div class="boss-info">
                        <div class="boss-name">顺丰分拣中心</div>
                        <div class="boss-jobs">发布岗位 3 个</div>
                    </div>
                    <div class="boss-follow-btn" onclick="unfollow(this)">已关注</div>
                </div>
            </div>
        </div>

        <!-- 底部按钮 -->
        <div class="bottom-btn" onclick="alert('查看全部关注老板岗位')">查看全部关注老板岗位</div>

        <div class="page-indicator"></div>
    </div>

    <script>
        function navigateTo(pageName) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance"];
            var path = pageName + '.html';
            if (workerPages.indexOf(pageName) < 0 && bossPages.indexOf(pageName) >= 0) {
                path = '../boss/' + path;
            } else if (workerPages.indexOf(pageName) < 0 && bossPages.indexOf(pageName) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }


        function goBack() { window.history.back(); }
        
        function switchTab(el, type) {
            document.querySelectorAll('.tab-item').forEach(t => {
                t.classList.remove('active');
            });
            el.classList.add('active');
            
            // 切换后显示对应数据
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('bossList').style.display = 'none';
        }
        
        function unfollow(btn) {
            if (btn.textContent === '已关注') {
                if (confirm('确定取消关注？')) {
                    btn.textContent = '关注';
                    btn.style.background = '#FF6B35';
                    btn.style.color = 'white';
                }
            } else {
                btn.textContent = '已关注';
                btn.style.background = '#FFF2F0';
                btn.style.color = '#FF6B35';
            }
        }
    </script>
</body>
</html>
