        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        .nav-back { display: flex; align-items: center; cursor: pointer; width: 32px; height: 32px; }
        .nav-right { display: flex; align-items: center; background: rgba(255, 255, 255, 0.9); border-radius: 20px; padding: 4px 6px; gap: 2px; }
        .nav-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
        .content-area { position: absolute; top: 47px; left: 0; right: 0; bottom: 34px; overflow-y: auto; background: #f5f5f5; }
        .content-area::-webkit-scrollbar { display: none; }
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
        
        /* 顶部统计 */
        .stats-header {
            background: linear-gradient(135deg, #FF6B35 0%, #FF8C5A 100%);
            margin: 12px; padding: 20px; border-radius: 12px; color: white;
        }
        .stats-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
        .stats-row { display: flex; justify-content: space-between; }
        .stats-col { flex: 1; text-align: center; }
        .stats-value { font-size: 24px; font-weight: 600; }
        .stats-label { font-size: 12px; opacity: 0.9; margin-top: 4px; }
        
        /* Tab切换 */
        .tabs { display: flex; background: white; margin: 0 12px; border-radius: 12px; overflow: hidden; }
        .tab-item { flex: 1; text-align: center; padding: 12px; font-size: 14px; color: #666; cursor: pointer; }
        .tab-item.active { color: #FF6B35; font-weight: 600; border-bottom: 2px solid #FF6B35; }
        
        /* 成就勋章 */
        .section-title { font-size: 16px; font-weight: 600; color: #333; margin: 16px 16px 10px; }
        .medal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 0 16px; }
        .medal-item { text-align: center; }
        .medal-icon {
            width: 56px; height: 56px; margin: 0 auto 8px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 24px;
        }
        .medal-unlocked { background: linear-gradient(135deg, #FFD700, #FFA500); color: white; }
        .medal-locked { background: #f0f0f0; color: #ccc; }
        .medal-name { font-size: 12px; color: #333; }
        .medal-desc { font-size: 11px; color: #999; margin-top: 2px; }
        
        /* 月度报表 */
        .report-card {
            background: white; margin: 12px; border-radius: 12px; padding: 16px;
        }
        .report-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .report-title { font-size: 15px; font-weight: 600; color: #333; }
        .report-month { font-size: 13px; color: #999; }
        .report-stats { display: flex; justify-content: space-around; }
        .report-item { text-align: center; }
        .report-value { font-size: 20px; font-weight: 600; color: #FF6B35; }
        .report-label { font-size: 12px; color: #999; margin-top: 4px; }
        
        /* 战绩列表 */
        .record-list { background: white; margin: 12px; border-radius: 12px; overflow: hidden; }
        .record-item {
            padding: 14px 16px; border-bottom: 1px solid #f5f5f5;
            display: flex; justify-content: space-between; align-items: center;
        }
        .record-item:last-child { border-bottom: none; }
        .record-info { flex: 1; }
        .record-title { font-size: 14px; color: #333; font-weight: 500; }
        .record-meta { font-size: 12px; color: #999; margin-top: 4px; }
        .record-income { font-size: 16px; font-weight: 600; color: #FF6B35; }
        
        /* 空状态 */
        .empty-state { text-align: center; padding: 40px; }
        .empty-icon { font-size: 60px; color: #FFE4B5; margin-bottom: 12px; }
        .empty-text { font-size: 14px; color: #999; }
    </style>

    <script>
        function navigateTo(pageName) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance"];
            var path = pageName + '.html';
            if (workerPages.indexOf(pageName) < 0 && bossPages.indexOf(pageName) >= 0) {
                path = '../boss/' + path;
            } else if (workerPages.indexOf(pageName) < 0 && bossPages.indexOf(pageName) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }


        function goBack() { window.history.back(); }
        
        // 不同时间范围的数据
        const dataSets = {
            day: {

                report: { title: '今日战绩', month: '2026-08-21', days: '1', orders: '2', income: '¥180' },
                records: [
                    { title: '餐饮清洁工', meta: '2026-08-21 08:00-18:00 · 已完成', income: '¥180' },
                    { title: '快递分拣员', meta: '2026-08-21 14:00-18:00 · 进行中', income: '¥60' }
                ]
            },
            week: {
                stats: { orders: '5', completed: '4', income: '¥720' },
                report: { title: '本周报表', month: '2026年第34周', days: '5', orders: '4', income: '¥720' },
                records: [

                ]

                records: [
                    { title: '餐饮清洁工', meta: '2026-08-20 08:00-18:00 · 已完成', income: '¥180' },
                    { title: '快递分拣员', meta: '2026-08-19 14:00-22:00 · 已完成', income: '¥120' },

        function switchTab(el, type) {
            // 切换Tab样式
            document.querySelectorAll('.tab-item').forEach(t => {
                t.classList.remove('active');
            });
            el.classList.add('active');
            
            // 更新数据
            const data = dataSets[type];
            if (data) {
                // 更新顶部统计
                document.getElementById('statOrders').textContent = data.stats.orders;
                document.getElementById('statCompleted').textContent = data.stats.completed;
                document.getElementById('statIncome').textContent = data.stats.income;
                
                // 更新报表
                document.getElementById('reportTitle').textContent = data.report.title;
                document.getElementById('reportMonth').textContent = data.report.month;
                document.getElementById('reportDays').textContent = data.report.days;
                document.getElementById('reportOrders').textContent = data.report.orders;
                document.getElementById('reportIncome').textContent = data.report.income;
                
                // 更新战绩列表
                const recordList = document.getElementById('recordList');
                recordList.innerHTML = data.records.map(r => `
                    <div class="record-item">
                        <div class="record-info">
                            <div class="record-title">${r.title}</div>
                            <div class="record-meta">${r.meta}</div>
                        </div>
                        <div class="record-income">${r.income}</div>
                    </div>
                `).join('');
            }
        }
