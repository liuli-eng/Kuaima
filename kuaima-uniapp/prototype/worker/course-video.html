            z-index: 10;
        }
        .top-nav {

            display: flex;
            align-items: center;

        .video-subtitle {

        }
        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -80%);
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }
        .content-area {
            position: absolute;
            top: 500px;
            left: 0;
            right: 0;
            bottom: 34px;
            overflow-y: auto;
            background: #fff;
        }
        .course-info {
            padding: 20px 16px;
            border-bottom: 1px solid #f0f0f0;
        }
        .course-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .course-stats {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            color: #999;
        }
        .progress-section {
            padding: 16px;
            border-bottom: 1px solid #f0f0f0;
        }
        .progress-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .progress-title {
            font-size: 14px;
            color: #333;
        }
        .progress-count {
            font-size: 13px;
            color: #FF6B35;
        }
        .progress-bar {
            height: 4px;
            background: #f0f0f0;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FF6B35, #FF8C42);
            border-radius: 2px;
            transition: width 0.3s;
        }
        .learn-section {
            padding: 16px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }
        .step-list {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 16px;
        }
        .step-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 16px;
        }
        .step-item:last-child {
            margin-bottom: 0;
        }
        .step-number {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #FF6B35, #FF8C42);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .step-content {
            flex: 1;
        }
        .step-title {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 4px;
        }
        .step-desc {
            font-size: 12px;
            color: #999;
            line-height: 1.5;
        }
        .page-indicator {
            height: 5px;
            background: #000;
            border-radius: 3px;
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 134px;
        }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>

        <!-- 视频区域 -->
        <div class="video-container">
            <!-- 状态栏 -->
            <div class="status-bar">
                <span>19:48</span>
                <div class="flex items-center gap-1">
                    <i class="fas fa-signal text-sm"></i>
                    <i class="fas fa-wifi text-sm"></i>
                    <i class="fas fa-battery-full text-sm"></i>
                </div>
            </div>

            <!-- 顶部导航 -->
            <div class="top-nav">
                <div class="nav-back" onclick="goBack()">
                    <i class="fas fa-chevron-left text-white text-lg"></i>
                </div>
                <div class="nav-title">学习抢日结操作流程</div>
                <div class="nav-right">
                    <div class="nav-btn">
                        <i class="fas fa-ellipsis text-white" style="font-size: 13px;"></i>
                    </div>
                    <div style="width: 1px; height: 14px; background: rgba(255,255,255,0.5); margin: 0 2px;"></div>
                    <div class="nav-btn">
                        <i class="fas fa-circle text-white" style="font-size: 11px;"></i>
                    </div>
                </div>
            </div>

            <!-- 视频播放模拟 -->
            <div class="video-title">抢日结操作流程</div>
            <div class="video-subtitle">找日结 上快马</div>
            <div class="video-illustration">🐴📦</div>
            
            <!-- 播放按钮 -->
            <div class="play-btn" onclick="togglePlay(this)">
                <i class="fas fa-play" style="color: #FF6B35; font-size: 24px; margin-left: 4px;"></i>
            </div>

            <!-- 播放控制条 -->
            <div style="position: absolute; bottom: 20px; left: 16px; right: 16px;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span style="color: #fff; font-size: 12px;">0:00</span>
                    <div style="flex: 1; height: 3px; background: rgba(255,255,255,0.3); border-radius: 2px; position: relative;">
                        <div style="position: absolute; left: 0; top: 0; height: 100%; width: 30%; background: #fff; border-radius: 2px;"></div>
                        <div style="position: absolute; left: 30%; top: 50%; transform: translateY(-50%); width: 10px; height: 10px; background: #fff; border-radius: 50%; margin-left: -5px;"></div>
                    </div>
                    <span style="color: rgba(255,255,255,0.7); font-size: 12px;">1:38</span>
                    <i class="fas fa-expand text-white" style="font-size: 14px;"></i>
                </div>
            </div>
        </div>

        <!-- 内容区 -->
        <div class="content-area">
            <!-- 课程信息 -->
            <div class="course-info">
                <div class="course-name">抢日结操作流程</div>
                <div class="course-stats">
                    <span><i class="far fa-clock"></i> 1:38</span>
                    <span><i class="fas fa-users"></i> 1.2万学习</span>
                    <span><i class="fas fa-star"></i> 4.9分</span>
                </div>
            </div>

            <!-- 学习进度 -->
            <div class="progress-section">
                <div class="progress-header">
                    <div class="progress-title">学习进度</div>
                    <div class="progress-count">已完成 0/1</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 0%;"></div>
                </div>
            </div>

            <!-- 课程要点 -->
            <div class="learn-section">
                <div class="section-title">课程要点</div>
                <div class="step-list">
                    <div class="step-item">
                        <div class="step-number">1</div>
                        <div class="step-content">
                            <div class="step-title">打开快马日结APP</div>
                            <div class="step-desc">在首页查看附近的日结岗位列表</div>
                        </div>
                    </div>
                    <div class="step-item">
                        <div class="step-number">2</div>
                        <div class="step-content">
                            <div class="step-title">筛选合适岗位</div>
                            <div class="step-desc">根据地区、工种、薪资等条件筛选</div>
                        </div>
                    </div>
                    <div class="step-item">
                        <div class="step-number">3</div>
                        <div class="step-content">
                            <div class="step-title">点击「抢新单」</div>
                            <div class="step-desc">快速点击抢单按钮，第一时间报名</div>
                        </div>
                    </div>
                    <div class="step-item">
                        <div class="step-number">4</div>
                        <div class="step-content">
                            <div class="step-title">等待雇主确认</div>
                            <div class="step-desc">雇主确认后会发送面试通知</div>
                        </div>
                    </div>
                    <div class="step-item">
                        <div class="step-number">5</div>
                        <div class="step-content">
                            <div class="step-title">准时到岗上班</div>
                            <div class="step-desc">按约定时间地点到岗，完成工作</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 底部按钮 -->
            <div style="padding: 16px;">
                <button onclick="markComplete(this)" style="width: 100%; background: linear-gradient(135deg, #FF6B35, #FF8C42); color: #fff; font-size: 15px; font-weight: 500; padding: 14px; border-radius: 24px; border: none; cursor: pointer; box-shadow: 0 4px 20px rgba(255, 107, 53, 0.3);">
                    标记为已学习
                </button>
            </div>
        </div>

        <!-- 底部指示器 -->
        <div class="page-indicator"></div>
    </div>

    <script>
        function navigateTo(page) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance"];
            var path = page + '.html';
            if (workerPages.indexOf(page) < 0 && bossPages.indexOf(page) >= 0) {
                path = '../boss/' + path;
            } else if (workerPages.indexOf(page) < 0 && bossPages.indexOf(page) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }


        function goBack() {
            window.history.back();
        }

        function togglePlay(btn) {
            const icon = btn.querySelector('i');
            if (icon.classList.contains('fa-play')) {
                icon.classList.remove('fa-play');
                icon.classList.add('fa-pause');
                icon.style.marginLeft = '0';
            } else {
                icon.classList.remove('fa-pause');
                icon.classList.add('fa-play');
                icon.style.marginLeft = '4px';
            }
        }

        function markComplete(btn) {
            btn.style.background = '#f0f0f0';
            btn.style.color = '#999';
            btn.textContent = '✓ 已完成学习';
            
            // 更新进度
            const progressFill = document.querySelector('.progress-fill');
            const progressCount = document.querySelector('.progress-count');
            if (progressFill && progressCount) {
                progressFill.style.width = '100%';
                progressCount.textContent = '已完成 1/1';
                progressCount.style.color = '#52C41A';
            }
        }
    </script>
</body>
</html>
