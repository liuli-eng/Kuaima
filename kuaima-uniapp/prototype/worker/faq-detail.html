<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>问题详情 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame {
            width: 390px; height: 844px; background: #f5f5f5; overflow: hidden;
            position: relative; border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
        }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }
        .nav-bar { padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; background: #fff; border-bottom: 1px solid #f0f0f0; position: absolute; top: 47px; left: 0; right: 0; height: 52px; z-index: 10; }
        .nav-back { display: flex; align-items: center; cursor: pointer; width: 32px; height: 32px; }
        .nav-right { display: flex; align-items: center; gap: 8px; }
        .nav-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .content-area { position: absolute; top: 99px; left: 0; right: 0; bottom: 34px; overflow-y: auto; background: #f5f5f5; }
        .content-area::-webkit-scrollbar { display: none; }
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
        
        .question-card {
            background: #fff;
            margin: 12px;
            border-radius: 12px;
            padding: 16px;
        }
        .question-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            line-height: 1.5;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }
        .question-tag {
            display: inline-block;
            padding: 2px 8px;
            background: #FFF2F0;
            color: #FF4D4F;
            font-size: 11px;
            border-radius: 4px;
            margin-bottom: 12px;
        }
        .answer-content {
            font-size: 14px;
            color: #666;
            line-height: 1.8;
        }
        .answer-content p {
            margin-bottom: 10px;
        }
        .answer-content ul {
            padding-left: 20px;
            margin-bottom: 10px;
        }
        .answer-content li {
            margin-bottom: 6px;
            list-style-type: disc;
        }
        .highlight {
            background: #FFFBE6;
            padding: 2px 4px;
            border-radius: 3px;
            color: #B8860B;
        }
        
        .step-list {
            counter-reset: step;
            margin: 10px 0;
        }
        .step-item {
            position: relative;
            padding-left: 32px;
            margin-bottom: 14px;
            font-size: 14px;
            color: #666;
        }
        .step-item::before {
            counter-increment: step;
            content: counter(step);
            position: absolute;
            left: 0;
            top: 0;
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, #FF6B35, #FF8C5A);
            color: #fff;
            border-radius: 50%;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>

        <div class="status-bar">
            <span>19:48</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>

        <div class="nav-bar">
            <div class="nav-back" onclick="goBack()">
                <i class="fas fa-chevron-left text-gray-700"></i>
            </div>
            <div style="font-size: 17px; font-weight: 600; color: #333; position: absolute; left: 50%; transform: translateX(-50%);">问题详情</div>
            <div class="nav-right">
                <div class="nav-btn" onclick="alert('分享')">
                    <i class="fas fa-share-alt text-gray-500"></i>
                </div>
            </div>
        </div>

        <div class="content-area">
            <!-- 问题卡片 -->
            <div class="question-card">
                <span class="question-tag">常见问题</span>
                <div class="question-title">
                    <i class="fas fa-question-circle" style="color: #FF6B35; font-size: 18px; flex-shrink: 0;"></i>
                    <span>拨打老板电话都是空号怎么办？</span>
                </div>
                <div class="answer-content">
                    <p>很抱歉给您带来不便，针对拨打老板电话为空号的情况，请按以下步骤处理：</p>
                    <div class="step-list">
                        <div class="step-item">请先确认订单中的联系电话是否正确，可在订单详情页查看</div>
                        <div class="step-item">如确认电话有误，请点击订单页面的「<span class="highlight">申请修改联系方式</span>」按钮</div>
                        <div class="step-item">系统将在1-2小时内核实并更新正确的联系方式</div>
                        <div class="step-item">如修改后仍无法联系，可申请取消订单，不会影响您的信用分</div>
                    </div>
                    <p style="margin-top: 12px;">💡 <strong>温馨提示：</strong>为保障双方权益，建议在面试前1-2小时再次确认联系电话。如遇紧急情况，可联系平台客服协助处理。</p>
                </div>
            </div>

            <div style="height: 20px;"></div>
        </div>

        <div class="page-indicator"></div>
    </div>

    <script>
        function navigateTo(page) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance"];
            var path = page + '.html';
            if (workerPages.indexOf(page) < 0 && bossPages.indexOf(page) >= 0) {
                path = '../boss/' + path;
            } else if (workerPages.indexOf(page) < 0 && bossPages.indexOf(page) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }


        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
