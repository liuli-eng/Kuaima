<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的券包 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame {
            width: 390px; height: 844px; background: #fff; overflow: hidden;
            position: relative; border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
        }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }
        .nav-bar { padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; background: #fff; }
        .nav-back { display: flex; align-items: center; cursor: pointer; width: 32px; height: 32px; }
        .nav-right { display: flex; align-items: center; background: rgba(255, 255, 255, 0.9); border-radius: 20px; padding: 4px 6px; gap: 2px; }
        .nav-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
        .content-area { position: absolute; top: 47px; left: 0; right: 0; bottom: 34px; overflow-y: auto; background: #f5f5f5; }
        .content-area::-webkit-scrollbar { display: none; }
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
        
        /* Tab切换 */
        .tabs { 
            display: flex; background: white; padding: 0 16px; 
            border-bottom: 1px solid #f0f0f0; height: 48px;
        }
        .tab-item { 
            flex: 1; text-align: center; padding: 14px 0; font-size: 16px; 
            color: #666; cursor: pointer; position: relative;
        }
        .tab-item.active { color: #FF6B35; font-weight: 600; }
        .tab-item.active::after {
            content: ''; position: absolute; bottom: 0; left: 50%;
            transform: translateX(-50%); width: 30px; height: 3px;
            background: #FF6B35; border-radius: 2px;
        }
        
        /* 空状态 */
        .empty-state { text-align: center; padding: 80px 40px; }
        .empty-icon { 
            font-size: 120px; color: #FFE4B5; margin-bottom: 20px; 
        }
        .empty-text { font-size: 15px; color: #999; }
        
        /* 底部按钮 */
        .footer-btn {
            text-align: center; padding: 20px;
            font-size: 15px; color: #FF6B35; cursor: pointer;
        }
        
        /* 券列表 */
        .coupon-list { padding: 12px; }
        .coupon-item {
            display: flex; margin-bottom: 12px; background: white;
            border-radius: 12px; overflow: hidden; position: relative;
        }
        .coupon-left {
            width: 100px; background: linear-gradient(135deg, #FF6B35, #FF8C5A);
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; color: white; padding: 16px;
        }
        .coupon-amount { font-size: 28px; font-weight: 700; }
        .coupon-unit { font-size: 12px; margin-top: 4px; }
        .coupon-right { flex: 1; padding: 14px; }
        .coupon-title { font-size: 15px; font-weight: 600; color: #333; }
        .coupon-desc { font-size: 12px; color: #999; margin-top: 4px; }
        .coupon-expire { font-size: 11px; color: #ccc; margin-top: 8px; }
        .coupon-use-btn {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            background: linear-gradient(135deg, #FF6B35, #FF8C5A);
            color: white; padding: 6px 14px; border-radius: 14px;
            font-size: 12px; cursor: pointer;
        }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>

        <div class="status-bar">
            <span>19:48</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>

        <div class="content-area">
            <!-- 导航栏 -->
            <div class="nav-bar">
                <div class="nav-back" onclick="goBack()">
                    <i class="fas fa-chevron-left text-gray-700"></i>
                </div>
                <div class="nav-title" style="font-size: 17px; font-weight: 600; color: #333; position: absolute; left: 50%; transform: translateX(-50%);">我的券包</div>
                <div class="nav-right">
                    <div class="nav-btn">
                        <i class="fas fa-ellipsis text-gray-700" style="font-size: 13px;"></i>
                    </div>
                    <div style="width: 1px; height: 14px; background: #ddd; margin: 0 2px;"></div>
                    <div class="nav-btn">
                        <i class="fas fa-circle text-gray-700" style="font-size: 11px;"></i>
                    </div>
                </div>
            </div>

            <!-- Tab切换 -->
            <div class="tabs">
                <div class="tab-item active" onclick="switchTab(this, 'deduction')">抵扣券</div>
                <div class="tab-item" onclick="switchTab(this, 'cashback')">返现券</div>
            </div>

            <!-- 空状态 -->
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">
                    <i class="fas fa-ticket-alt"></i>
                </div>
                <div class="empty-text">暂无数据</div>
            </div>

            <!-- 券列表（默认隐藏） -->
            <div class="coupon-list" id="couponList" style="display: none;">
                <div class="coupon-item">
                    <div class="coupon-left">
                        <div class="coupon-amount">5</div>
                        <div class="coupon-unit">元抵扣券</div>
                    </div>
                    <div class="coupon-right">
                        <div class="coupon-title">满50元可用</div>
                        <div class="coupon-desc">全平台通用抵扣券</div>
                        <div class="coupon-expire">有效期至 2026-09-30</div>
                    </div>
                    <div class="coupon-use-btn" onclick="useCoupon()">去使用</div>
                </div>
                <div class="coupon-item">
                    <div class="coupon-left" style="background: linear-gradient(135deg, #1890FF, #40A9FF);">
                        <div class="coupon-amount">10</div>
                        <div class="coupon-unit">元返现券</div>
                    </div>
                    <div class="coupon-right">
                        <div class="coupon-title">完成1单可使用</div>
                        <div class="coupon-desc">完成订单后返现10元</div>
                        <div class="coupon-expire">有效期至 2026-10-15</div>
                    </div>
                    <div class="coupon-use-btn" style="background: linear-gradient(135deg, #1890FF, #40A9FF);" onclick="useCoupon()">去使用</div>
                </div>
            </div>

            <!-- 底部按钮 -->
            <div class="footer-btn">查看无效券</div>
        </div>

        <div class="page-indicator"></div>
    </div>

    <script>
        function navigateTo(pageName) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance"];
            var path = pageName + '.html';
            if (workerPages.indexOf(pageName) < 0 && bossPages.indexOf(pageName) >= 0) {
                path = '../boss/' + path;
            } else if (workerPages.indexOf(pageName) < 0 && bossPages.indexOf(pageName) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }


        function goBack() { window.history.back(); }
        
        function switchTab(el, type) {
            document.querySelectorAll('.tab-item').forEach(t => {
                t.classList.remove('active');
            });
            el.classList.add('active');
            
            // 切换后显示对应数据
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('couponList').style.display = 'none';
        }
        
        function useCoupon() {
            alert('跳转到抢日结页面使用优惠券');
            navigateTo('home');
        }
    </script>
</body>
</html>
