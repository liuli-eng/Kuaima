<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>结算详情 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame {
            width: 390px; height: 844px; background: #fff; overflow: hidden;
            position: relative; border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
        }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }
        .nav-bar { height: 50px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; background: #fff; }
        .nav-back { display: flex; align-items: center; justify-content: center; cursor: pointer; width: 32px; height: 32px; color: #333; font-size: 20px; }
        .nav-right { display: flex; align-items: center; gap: 16px; color: #333; font-size: 16px; cursor: pointer; }
        .content-area { position: absolute; top: 97px; left: 0; right: 0; bottom: 34px; overflow-y: auto; background: #f5f5f5; }
        .content-area::-webkit-scrollbar { display: none; }
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
        
        .settle-card {
            background: linear-gradient(135deg, #FF6B35 0%, #FF8C5A 100%);
            margin: 12px; padding: 20px; border-radius: 12px; color: white;
        }
        .settle-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .settle-title { font-size: 16px; font-weight: 600; }
        .settle-status { font-size: 12px; background: rgba(255,255,255,0.25); padding: 4px 10px; border-radius: 10px; }
        .settle-amount { font-size: 36px; font-weight: 700; margin: 8px 0; }
        .settle-info { font-size: 13px; opacity: 0.9; line-height: 1.8; }
        
        .info-card { background: #fff; margin: 12px; border-radius: 12px; padding: 16px; }
        .card-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .detail-row { display: flex; justify-content: space-between; font-size: 14px; color: #666; padding: 10px 0; border-bottom: 1px solid #f5f5f5; }
        .detail-row:last-child { border-bottom: none; }
        .detail-row .label { color: #999; display: flex; align-items: center; gap: 6px; }
        .detail-row .value { color: #333; font-weight: 500; }
        .detail-row .value.money { color: #FF6B35; font-weight: 600; }
        .fee-row { display: flex; justify-content: space-between; font-size: 14px; padding: 10px 0; }
        .fee-row .label { color: #666; }
        .fee-row .value { color: #333; }
        .fee-row .value.fee { color: #999; }
        .fee-row.total { border-top: 1px dashed #e0e0e0; margin-top: 8px; padding-top: 12px; }
        .fee-row.total .label { font-weight: 600; color: #333; }
        .fee-row.total .value { font-weight: 700; color: #FF6B35; font-size: 16px; }
        
        .status-timeline { display: flex; justify-content: space-between; padding: 16px 0 8px; }
        .timeline-item { flex: 1; text-align: center; position: relative; }
        .timeline-item .dot { width: 12px; height: 12px; border-radius: 50%; margin: 0 auto 6px; }
        .timeline-item .dot.active { background: #FF6B35; }
        .timeline-item .dot.inactive { background: #ddd; }
        .timeline-item .dot.current { background: #FF6B35; box-shadow: 0 0 0 4px rgba(255,107,53,0.2); }
        .timeline-item .label { font-size: 11px; color: #999; }
        .timeline-item .label.active { color: #FF6B35; font-weight: 500; }
        .timeline-item:not(:last-child)::after { content: ''; position: absolute; top: 6px; left: 60%; width: 80%; height: 2px; background: #e0e0e0; }
        .timeline-item.done:not(:last-child)::after { background: #FF6B35; }
        
        .account-card { background: #fff; margin: 12px; border-radius: 12px; padding: 16px; }
        .account-info { display: flex; align-items: center; gap: 12px; }
        .account-icon { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: white; }
        .account-icon.wechat { background: #07C160; }
        .account-icon.alipay { background: #1677FF; }
        .account-icon.bank { background: #FF6B35; }
        .account-details { flex: 1; }
        .account-name { font-size: 15px; font-weight: 600; color: #333; }
        .account-desc { font-size: 12px; color: #999; margin-top: 2px; }
        
        .action-area { padding: 16px 12px; }
        .action-btn {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #FF6B35, #FF8C5A);
            color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
        }
        .action-btn.secondary { background: #fff; color: #FF6B35; border: 1px solid #FF6B35; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>
        <div class="status-bar"><span>19:53</span><div class="flex items-center gap-1"><i class="fas fa-signal text-sm"></i><i class="fas fa-wifi text-sm"></i><i class="fas fa-battery-full text-sm"></i></div></div>
        <div class="nav-bar">
            <div class="nav-back" onclick="goBack()"><i class="fas fa-arrow-left"></i></div>
            <div class="text-base font-semibold text-gray-800">结算详情</div>
            <div class="nav-right"><i class="fas fa-ellipsis-h"></i></div>
        </div>
        <div class="content-area">
            <div class="settle-card">
                <div class="settle-header">
                    <div class="settle-title"><i class="fas fa-file-invoice-dollar mr-2"></i>餐饮服务员</div>
                    <div class="settle-status">已结算</div>
                </div>
                <div class="settle-amount">¥180.00</div>
                <div class="settle-info">结算时间：2026-08-23 18:00</div>
                <div class="settle-info">工作日期：2026-08-23</div>
            </div>

            <div class="info-card">
                <div class="card-title"><i class="fas fa-list-alt text-orange-500"></i>费用明细</div>
                <div class="fee-row">
                    <span class="label"><i class="fas fa-clock text-gray-400"></i>工作时长</span>
                    <span class="value">10小时 (10:00-20:00)</span>
                </div>
                <div class="fee-row">
                    <span class="label"><i class="fas fa-coins text-gray-400"></i>约定工资</span>
                    <span class="value">180元/天</span>
                </div>
                <div class="fee-row">
                    <span class="label"><i class="fas fa-utensils text-gray-400"></i>包餐补贴</span>
                    <span class="value fee">¥0.00</span>
                </div>
                <div class="fee-row">
                    <span class="label"><i class="fas fa-bonus text-gray-400"></i>全勤奖励</span>
                    <span class="value fee">¥0.00</span>
                </div>
                <div class="fee-row total">
                    <span class="label"><i class="fas fa-calculator"></i>应得工资</span>
                    <span class="value">¥180.00</span>
                </div>
            </div>

            <div class="info-card">
                <div class="card-title"><i class="fas fa-info-circle text-orange-500"></i>结算说明</div>
                <div class="detail-row">
                    <span class="label"><i class="fas fa-check-circle text-green-500"></i>结算状态</span>
                    <span class="value" style="color: #52c41a;">已结算</span>
                </div>
                <div class="detail-row">
                    <span class="label"><i class="fas fa-calendar text-gray-400"></i>结算周期</span>
                    <span class="value">当日结算</span>
                </div>
                <div class="detail-row">
                    <span class="label"><i class="fas fa-store text-gray-400"></i>雇主名称</span>
                    <span class="value">麦当劳食品有限公司</span>
                </div>
                <div class="detail-row">
                    <span class="label"><i class="fas fa-map-marker-alt text-gray-400"></i>工作地点</span>
                    <span class="value">松江区泗泾镇</span>
                </div>
            </div>

            <div class="account-card">
                <div class="card-title"><i class="fas fa-university text-orange-500"></i>到账账户</div>
                <div class="account-info">
                    <div class="account-icon wechat"><i class="fab fa-weixin"></i></div>
                    <div class="account-details">
                        <div class="account-name">微信钱包</div>
                        <div class="account-desc">138****8888</div>
                    </div>
                    <div style="color: #FF6B35; font-weight: 600; font-size: 15px;">¥180.00</div>
                </div>
            </div>

            <div class="action-area">
                <button class="action-btn secondary" onclick="navigateTo('wallet')">查看我的钱包</button>
            </div>
        </div>
        <div class="page-indicator"></div>
    </div>
    <script>
        function navigateTo(pageName) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message", "settlement"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance"];
            var path = pageName + '.html';
            if (bossPages.indexOf(pageName) < 0 && workerPages.indexOf(pageName) >= 0) {
                path = '../worker/' + path;
            } else if (bossPages.indexOf(pageName) < 0 && workerPages.indexOf(pageName) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }

        function goBack() { 
            window.location.href = 'order.html';
        }
    </script>
</body>
</html>
