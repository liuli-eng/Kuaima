                    { title: '及时求助', desc: '必要时拨打报警、急救电话，或向周围人求助' },
                    { title: '保留证据', desc: '事后保存相关证据，如照片、视频、证人联系方式等' },
                    { title: '上报平台', desc: '及时向快马日结平台反馈情况，申请保险理赔或协助' }
                ],
                knowledge: [
                    { icon: '🛡️', title: '人身安全第一', desc: '任何情况下人身安全最重要，不要冒险处理危险情况' },
                    { icon: '📸', title: '证据收集', desc: '用手机拍摄现场照片、视频，记录时间地点和经过' },
                    { icon: '📞', title: '求助热线', desc: '平台客服400-xxx-xxxx，保险理赔专线，24小时在线' }
                ],
                quiz: {
                    question: '遇到工作中的突发危险情况，第一步应该做什么？',
                    options: [
                        '继续工作忽略危险',
                        '保持冷静并评估情况',
                        '立即逃离现场',
                        '拍照发朋友圈'
                    ],
                    correctIndex: 1
                }
            }
        };

        const taskId = new URLSearchParams(window.location.search).get('id') || 1;
        const task = taskData[taskId] || taskData[1];
        let selectedAnswer = -1;
        let quizAnswered = false;

        function renderPage() {
            const content = document.getElementById('contentArea');
            const isCompleted = task.status === 'completed';
            const isLocked = task.status === 'locked';

            content.innerHTML = `
                <!-- 头部区域 -->
                <div class="hero-section">
                    <span class="hero-tag">${task.tag}</span>
                    <div class="hero-title">${task.title}</div>
                    <div class="hero-desc">${task.desc}</div>
                    <div class="hero-stats">
                        <div class="hero-stat">
                            <i class="fas fa-coins"></i>
                            <span>奖励 +${task.reward}经验</span>
                        </div>
                        <div class="hero-stat">
                            <span class="status-badge ${task.statusClass}">${task.statusText}</span>
                        </div>
                    </div>
                </div>

                <!-- 学习步骤 -->
                <div class="steps-section">
                    <div class="section-label">学习步骤</div>
                    ${task.steps.map((step, idx) => `
                        <div class="step-item">
                            <div class="step-number">${idx + 1}</div>
                            ${idx < task.steps.length - 1 ? '<div class="step-connector"></div>' : ''}
                            <div class="step-content">
                                <div class="step-title">${step.title}</div>
                                <div class="step-desc">${step.desc}</div>
                            </div>
                        </div>
                    `).join('')}
                </div>

                <!-- 视频演示 -->
                <div class="demo-section">
                    <div class="demo-header">
                        <div class="demo-title"><i class="fas fa-play-circle" style="color: #722ED1;"></i> 视频演示</div>
                        <div class="demo-duration">${task.videoDuration}</div>
                    </div>
                    <div class="demo-video" onclick="alert('播放视频：${task.videoCaption}')">
                        <div class="play-btn"><i class="fas fa-play"></i></div>
                        <div class="demo-caption">${task.videoCaption}</div>
                    </div>
                </div>

                <!-- 知识要点 -->
                <div class="knowledge-card">
                    <div class="demo-header" style="border-bottom: none; padding-bottom: 10px;">
                        <div class="demo-title"><i class="fas fa-lightbulb" style="color: #FA8C16;"></i> 核心知识要点</div>
                    </div>
                    ${task.knowledge.map(k => `
                        <div class="knowledge-item">
                            <div class="knowledge-icon">${k.icon}</div>
                            <div class="knowledge-content">
                                <div class="knowledge-title">${k.title}</div>
                                <div class="knowledge-desc">${k.desc}</div>
                            </div>
                        </div>
                    `).join('')}
                </div>

                <!-- 小测验 -->
                <div class="quiz-section">
                    <div class="quiz-title"><i class="fas fa-question-circle" style="color: #722ED1;"></i> 小测验</div>
                    <div class="quiz-question">${task.quiz.question}</div>
                    <div class="quiz-options" id="quizOptions">
                        ${task.quiz.options.map((opt, idx) => `
                            <div class="quiz-option" onclick="selectAnswer(${idx})" data-index="${idx}">
                                <div class="option-label">${String.fromCharCode(65 + idx)}</div>
                                <span>${opt}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- 底部按钮 -->
                <div class="bottom-section">
                    <button class="complete-btn ${isCompleted ? 'completed' : ''}" 
                            onclick="completeTask()" 
                            ${isCompleted || isLocked ? 'disabled' : ''}>
                        ${isLocked ? '🔒 完成前置任务解锁' : isCompleted ? '✓ 已完成' : '完成学习任务'}
                    </button>
                </div>
            `;
        }

        function selectAnswer(index) {
            if (quizAnswered) return;
            selectedAnswer = index;
            const options = document.querySelectorAll('.quiz-option');
            options.forEach(opt => opt.classList.remove('selected', 'correct', 'wrong'));
            options.forEach((opt, idx) => {
                if (idx === task.quiz.correctIndex) {
                    opt.classList.add('correct');
                } else if (idx === index) {
                    opt.classList.add('wrong');
                }
            });
            quizAnswered = true;
        }

        function completeTask() {
            if (task.status === 'locked') {
                alert('请先完成前置任务');
                return;
            }
            if (!quizAnswered) {
                alert('请先完成小测验');
                return;
            }
            if (selectedAnswer !== task.quiz.correctIndex) {
                alert('回答不正确，请再试一次');
                quizAnswered = false;
                selectedAnswer = -1;
                renderPage();
                return;
            }
            
            const toast = document.getElementById('toast');
            toast.querySelector('.toast-text').innerHTML = `恭喜完成任务<br>获得 +${task.reward} 经验值`;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
                window.history.back();
            }, 2000);
        }

        function goBack() {
            window.history.back();
        }

        renderPage();
    </script>
</body>
</html>
