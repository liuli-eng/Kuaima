<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邀请码 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame {
            width: 390px; height: 844px; background: #fff; overflow: hidden;
            position: relative; border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
        }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }
        .top-nav { padding: 8px 16px 12px; display: flex; align-items: center; justify-content: space-between; background: #fff; border-bottom: 1px solid #f0f0f0; position: absolute; top: 47px; left: 0; right: 0; height: 52px; z-index: 10; }
        .nav-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .nav-right { display: flex; align-items: center; background: rgba(255, 255, 255, 0.9); border-radius: 20px; padding: 4px 6px; gap: 2px; }
        .nav-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
        .content-area { position: absolute; top: 99px; left: 0; right: 0; bottom: 34px; overflow-y: auto; background: #f5f5f5; }
        .content-area::-webkit-scrollbar { display: none; }
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
        
        /* 背景遮罩 */
        .modal-mask {
            position: absolute; top: 99px; left: 0; right: 0; bottom: 34px;
            background: rgba(0, 0, 0, 0.5);
            display: flex; align-items: center; justify-content: center;
            z-index: 100;
        }
        .modal-dialog {
            width: 280px; background: white; border-radius: 16px; overflow: hidden;
        }
        .modal-header {
            padding: 24px 20px 16px; text-align: center;
        }
        .modal-title {
            font-size: 18px; font-weight: 600; color: #333;
        }
        .modal-body {
            padding: 0 20px 20px;
        }
        .modal-input {
            width: 100%; padding: 12px 16px;
            border: 1px solid #e0e0e0; border-radius: 8px;
            font-size: 15px; color: #333;
            outline: none; transition: border-color 0.2s;
        }
        .modal-input:focus { border-color: #FF6B35; }
        .modal-input::placeholder { color: #ccc; }
        .modal-footer {
            display: flex; border-top: 1px solid #f0f0f0;
        }
        .modal-btn {
            flex: 1; padding: 14px; text-align: center;
            font-size: 16px; cursor: pointer; border: none;
        }
        .modal-btn-cancel {
            color: #666; background: white;
            border-right: 1px solid #f0f0f0;
        }
        .modal-btn-confirm {
            color: white; background: #FF6B35;
        }
        .modal-btn-confirm:hover { background: #E55A2B; }
        
        /* 页面内容 */
        .reward-card {
            margin: 16px; background: linear-gradient(135deg, #FF6B35, #FFA500);
            border-radius: 16px; padding: 24px; color: white; text-align: center;
        }
        .reward-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .reward-desc { font-size: 14px; opacity: 0.9; }
        .reward-amount { font-size: 36px; font-weight: 700; margin: 16px 0; }
        
        .share-section {
            margin: 16px; background: white; border-radius: 12px; padding: 20px;
        }
        .share-title { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 16px; }
        .share-item {
            display: flex; align-items: center; padding: 12px 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .share-item:last-child { border-bottom: none; }
        .share-icon {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; margin-right: 12px;
        }
        .share-name { flex: 1; font-size: 15px; color: #333; }
        .share-arrow { color: #ccc; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>

        <div class="status-bar">
            <span>19:48</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>

        <div class="top-nav">
            <div class="nav-back" onclick="goBack()">
                <i class="fas fa-chevron-left text-gray-700"></i>
            </div>
            <div class="nav-title" style="font-size: 17px; font-weight: 600; color: #333; position: absolute; left: 50%; transform: translateX(-50%);">邀请码</div>
            <div class="nav-right">
                <div class="nav-btn">
                    <i class="fas fa-ellipsis text-gray-700" style="font-size: 13px;"></i>
                </div>
                <div style="width: 1px; height: 14px; background: #ddd; margin: 0 2px;"></div>
                <div class="nav-btn">
                    <i class="fas fa-circle text-gray-700" style="font-size: 11px;"></i>
                </div>
            </div>
        </div>

        <div class="content-area">
            <!-- 奖励卡片 -->
            <div class="reward-card">
                <div class="reward-title">邀请好友 各得奖励</div>
                <div class="reward-desc">邀请越多，奖励越多</div>
                <div class="reward-amount">¥20</div>
                <div class="reward-desc">每邀请一位好友注册成功</div>
            </div>

            <!-- 分享方式 -->
            <div class="share-section">
                <div class="share-title">分享方式</div>
                <div class="share-item" onclick="alert('复制邀请链接')">
                    <div class="share-icon" style="background: #FFF3E8; color: #FF6B35;">
                        <i class="fas fa-link"></i>
                    </div>
                    <div class="share-name">复制邀请链接</div>
                    <i class="fas fa-chevron-right share-arrow"></i>
                </div>
                <div class="share-item" onclick="alert('分享到微信')">
                    <div class="share-icon" style="background: #E8F8E8; color: #07C160;">
                        <i class="fab fa-weixin"></i>
                    </div>
                    <div class="share-name">分享到微信</div>
                    <i class="fas fa-chevron-right share-arrow"></i>
                </div>
                <div class="share-item" onclick="alert('保存邀请海报')">
                    <div class="share-icon" style="background: #E8F4FF; color: #1890FF;">
                        <i class="fas fa-image"></i>
                    </div>
                    <div class="share-name">保存邀请海报</div>
                    <i class="fas fa-chevron-right share-arrow"></i>
                </div>
            </div>

            <div style="height: 30px;"></div>
        </div>

        <!-- 弹窗 -->
        <div class="modal-mask">
            <div class="modal-dialog">
                <div class="modal-header">
                    <div class="modal-title">请输入邀请码</div>
                </div>
                <div class="modal-body">
                    <input type="text" class="modal-input" placeholder="请输入6位邀请码" maxlength="6">
                </div>
                <div class="modal-footer">
                    <button class="modal-btn modal-btn-cancel" onclick="closeDialog()">取消</button>
                    <button class="modal-btn modal-btn-confirm" onclick="submitInvite()">提交</button>
                </div>
            </div>
        </div>

        <div class="page-indicator"></div>
    </div>

    <script>
        function navigateTo(pageName) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance"];
            var path = pageName + '.html';
            if (workerPages.indexOf(pageName) < 0 && bossPages.indexOf(pageName) >= 0) {
                path = '../boss/' + path;
            } else if (workerPages.indexOf(pageName) < 0 && bossPages.indexOf(pageName) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }


        function goBack() { window.history.back(); }
        function closeDialog() { navigateTo('profile'); }
        function submitInvite() {
            alert('邀请码提交成功');
            navigateTo('profile');
        }
    </script>
</body>
</html>
