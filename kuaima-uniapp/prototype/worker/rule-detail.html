        const rulesData = {

                        <div class="content-text">
                            <p>快马平台相关规则以促成交易、保障服务为目的，属于商业运营手段，并非劳动管理手段，平台与零工存在任何雇佣关系。为规范快马日结APP（以下简称"平台"）零工服务秩序，明确平台、零工双方权利与义务，有效预防和减少服务过程中的各类纠纷，保障各方合法权益，结合平台运营规则，特发布本告示，请所有零工仔细阅读、严格遵守。</p>

                            <p><b>2、收费标准：</b>技术服务费按零工每个订单实际收入的一定比例收取，详细费率标准将在每个任务详情页面明确标注，请零工接单前务必仔细核对，确认无误后再进行接单操作。</p>
                        </div>
                    </div>
                    <div class="content-card">
                        <div class="content-title">二、接单前置要求</div>
                        <div class="content-text">
                            <p><b>1、实名认证与规则考核：</b>零工首次在平台接单前，必须完成真实、有效的实名认证（需提供本人有效身份证件，确保信息与实际一致）；同时，学习平台服务规则、纠纷处理规范、安全须知等相关内容，并通过线上测试，测试合格后方可获得接单资格。</p>
                            <p><b>2、规则确认义务：</b>零工在学习平台规则、查看服务费标准及相关协议过程中，若对任何条款存在异议、不接受相关约定，请勿进行接单操作；一旦接单，即视为已全面理解并自愿遵守平台所有规则、协议及收费标准，若因未仔细阅读规则所有规则及收费标准引发纠纷，由零工自行承担全部责任。</p>

                        </div>

        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function loadContent() {
            const type = getQueryParam('type') || 'notice';
            const data = rulesData[type];
            if (data) {
                document.getElementById('pageTitle').textContent = data.title;
                document.getElementById('contentArea').innerHTML = data.content;
            }

            window.history.back();
