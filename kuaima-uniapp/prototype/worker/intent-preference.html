<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找活偏好 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', -apple-system, 'PingFang SC', sans-serif; }
        .phone-frame {
            width: 390px; height: 844px; background: #F5F5F5; overflow: hidden;
            position: relative; border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
        }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 32px; background: #000; border-radius: 20px; z-index: 60; }
        .status-bar { position: absolute; top: 0; left: 0; right: 0; height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; z-index: 40; background: transparent; }
        .nav-bar { position: absolute; top: 47px; left: 0; right: 0; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #FFF8E6; z-index: 50; }
        .nav-back { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #333; }
        .nav-right { display: flex; align-items: center; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); border-radius: 9999px; padding: 4px 6px; gap: 2px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .nav-btn { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #555; font-size: 12px; }
        .nav-divider { width: 1px; height: 12px; background: #ddd; }
        .content-area { position: absolute; top: 99px; left: 0; right: 0; bottom: 0; overflow-y: auto; background: #F5F5F5; }
        .content-area::-webkit-scrollbar { display: none; }
        .section-title { padding: 16px 16px 8px; font-size: 13px; color: #999; font-weight: 500; }
        .tag-group { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px; }
        .tag-item { padding: 8px 16px; background: white; border: 1px solid #e8e8e8; border-radius: 20px; font-size: 13px; color: #666; cursor: pointer; transition: all 0.2s; }
        .tag-item.selected { background: linear-gradient(135deg, #FFE4B5, #FFD966); color: #D2691E; border-color: #FFD966; font-weight: 600; }
        .form-section { background: white; margin: 12px; border-radius: 12px; overflow: hidden; }
        .form-row { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid #f5f5f5; }
        .form-row:last-child { border-bottom: none; }
        .form-label { font-size: 15px; color: #333; font-weight: 500; }
        .form-value { font-size: 14px; color: #999; display: flex; align-items: center; gap: 4px; }
        .form-value.has-value { color: #333; }
        .required { color: #FF4757; margin-right: 4px; }
        .submit-btn { position: absolute; bottom: 34px; left: 16px; right: 16px; background: linear-gradient(135deg, #FF6B35, #FF8C5A); color: white; padding: 16px; border-radius: 28px; text-align: center; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 6px 16px rgba(255, 107, 53, 0.35); }
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; z-index: 60; }
        .slider-row { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid #f5f5f5; }
        .slider-row:last-child { border-bottom: none; }
        .slider-value { font-size: 14px; color: #FF6B35; font-weight: 600; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>
        <div class="status-bar">
            <span>19:48</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>
        <div class="nav-bar">
            <div class="nav-back" onclick="goBack()">
                <i class="fas fa-chevron-left"></i>
            </div>
            <div class="font-semibold text-base text-gray-800">找活偏好</div>
            <div class="nav-right">
                <div class="nav-btn"><i class="fas fa-ellipsis"></i></div>
                <div class="nav-divider"></div>
                <div class="nav-btn"><i class="fas fa-minus"></i></div>
                <div class="nav-divider"></div>
                <div class="nav-btn"><i class="fas fa-circle"></i></div>
            </div>
        </div>
        <div class="content-area">
            <div class="section-title">能做的时段</div>
            <div class="tag-group">
                <div class="tag-item selected" onclick="toggleTag(this)">早班(6-14点)</div>
                <div class="tag-item selected" onclick="toggleTag(this)">中班(14-22点)</div>
                <div class="tag-item" onclick="toggleTag(this)">夜班(22-6点)</div>
                <div class="tag-item" onclick="toggleTag(this)">全天</div>
                <div class="tag-item" onclick="toggleTag(this)">周末</div>
                <div class="tag-item" onclick="toggleTag(this)">灵活时段</div>
            </div>

            <div class="section-title">工作条件</div>
            <div class="tag-group">
                <div class="tag-item selected" onclick="toggleTag(this)">包吃</div>
                <div class="tag-item selected" onclick="toggleTag(this)">包住</div>
                <div class="tag-item" onclick="toggleTag(this)">有空调</div>
                <div class="tag-item" onclick="toggleTag(this)">提供交通</div>
                <div class="tag-item" onclick="toggleTag(this)">有加班费</div>
                <div class="tag-item" onclick="toggleTag(this)">可带手机</div>
            </div>

            <div class="section-title">其他偏好</div>
            <div class="tag-group">
                <div class="tag-item selected" onclick="toggleTag(this)">近距离(3km内)</div>
                <div class="tag-item selected" onclick="toggleTag(this)">有经验优先</div>
                <div class="tag-item" onclick="toggleTag(this)">新手可做</div>
                <div class="tag-item" onclick="toggleTag(this)">有保障岗位</div>
                <div class="tag-item" onclick="toggleTag(this)">当天结算</div>
                <div class="tag-item" onclick="toggleTag(this)">接受培训</div>
            </div>

            <div class="section-title">距离偏好</div>
            <div class="form-section">
                <div class="slider-row">
                    <div class="form-label">最远通勤距离</div>
                    <div class="slider-value">5km</div>
                </div>
                <div class="slider-row">
                    <div class="form-label">步行/骑行时间</div>
                    <div class="slider-value">30分钟内</div>
                </div>
            </div>

            <div style="height: 100px;"></div>
        </div>
        <div class="submit-btn" onclick="saveForm()">保存偏好</div>
        <div class="page-indicator"></div>
    </div>

    <script>
        function goBack() { window.history.back(); }
        function saveForm() { alert('保存成功'); window.history.back(); }
        function toggleTag(el) { el.classList.toggle('selected'); }
        function navigateTo(pageName) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "follow-qrcode", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "intent-personal", "intent-job", "intent-preference", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance"];
            var path = pageName + '.html';
            if (workerPages.indexOf(pageName) < 0 && bossPages.indexOf(pageName) >= 0) {
                path = '../boss/' + path;
            } else if (workerPages.indexOf(pageName) < 0 && bossPages.indexOf(pageName) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }
    </script>
</body>
</html>
