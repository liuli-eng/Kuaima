<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习平台规则 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .phone-frame {
            width: 390px;
            height: 844px;
            background: #fff;
            overflow: hidden;
            position: relative;
            border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            border: 10px solid #1a1a1a;
        }
        .dynamic-island {
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 35px;
            background: #000;
            border-radius: 20px;
            z-index: 50;
        }
        .status-bar {
            height: 47px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 28px;
            font-size: 15px;
            font-weight: 600;
            color: #333;
            background: #fff;
        }
        .top-nav {
            padding: 8px 16px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            border-bottom: 1px solid #f0f0f0;
            position: absolute;
            top: 47px;
            left: 0;
            right: 0;
            height: 52px;
            z-index: 10;
        }
        .nav-back {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .nav-title {
            font-size: 17px;
            font-weight: 600;
            color: #333;
        }
        .nav-right {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 4px 6px;
            gap: 2px;
        }
        .nav-btn {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .content-area {
            position: absolute;
            top: 99px;
            left: 0;
            right: 0;
            bottom: 34px;
            overflow-y: auto;
            background: #f5f5f5;
        }
        .page-indicator {
            height: 5px;
            background: #000;
            border-radius: 3px;
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 134px;
        }
        /* 页面头部 */
        .page-header {
            background: #fff;
            padding: 20px 16px;
            border-bottom: 1px solid #f0f0f0;
        }
        .page-title {
            font-size: 22px;
            font-weight: 700;
            color: #333;
            margin-bottom: 6px;
        }
        .page-subtitle {
            font-size: 14px;
            color: #999;
        }
        /* 学习进度 */
        .progress-section {
            background: #fff;
            margin: 16px;
            border-radius: 12px;
            padding: 16px;
        }
        .progress-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .progress-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        .progress-count {
            font-size: 13px;
            color: #FF6B35;
        }
        .progress-bar {
            height: 8px;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FF6B35, #FF8C42);
            border-radius: 4px;
            transition: width 0.3s;
        }
        /* 学习卡片 */
        .learn-card {
            background: #fff;
            margin-bottom: 1px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s;
        }
        .learn-card:last-child {
            margin-bottom: 0;
        }
        .learn-card:active {
            background: #f9f9f9;
        }
        .learn-info {
            flex: 1;
        }
        .learn-title {
            font-size: 15px;
            font-weight: 500;
            color: #333;
            margin-bottom: 4px;
        }
        .learn-desc {
            font-size: 12px;
            color: #999;
        }
        .learn-btn {
            background: linear-gradient(135deg, #FF6B35, #FF8C42);
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .learn-btn.completed {
            background: #f0f0f0;
            color: #999;
        }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>

        <!-- 状态栏 -->
        <div class="status-bar">
            <span>19:48</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>

        <!-- 顶部导航 -->
        <div class="top-nav">
            <div class="nav-back" onclick="goBack()">
                <i class="fas fa-chevron-left text-gray-700 text-lg"></i>
            </div>
            <div class="nav-title">学习平台规则</div>
            <div class="nav-right">
                <div class="nav-btn">
                    <i class="fas fa-ellipsis text-gray-700" style="font-size: 13px;"></i>
                </div>
                <div style="width: 1px; height: 14px; background: #ddd; margin: 0 2px;"></div>
                <div class="nav-btn">
                    <i class="fas fa-circle text-gray-700" style="font-size: 11px;"></i>
                </div>
            </div>
        </div>

        <!-- 内容区 -->
        <div class="content-area">
            <!-- 页面头部 -->
            <div class="page-header">
                <div class="page-title">学习平台规则</div>
                <div class="page-subtitle">学习平台规则，找活不踩坑</div>
            </div>

            <!-- 学习进度 -->
            <div class="progress-section">
                <div class="progress-header">
                    <div class="progress-title">学习进度</div>
                    <div class="progress-count">已学习 0/4</div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 0%;"></div>
                </div>
            </div>

            <!-- 学习内容列表 -->
            <div class="bg-white mx-4 rounded-xl overflow-hidden shadow-sm">
                <!-- 规则1 -->
                <div class="learn-card" onclick="startLearn(this)">
                    <div class="learn-info">
                        <div class="learn-title">信用分规则</div>
                        <div class="learn-desc">信用分评定标准和影响因素</div>
                    </div>
                    <button class="learn-btn">
                        <span>去学习</span>
                        <i class="fas fa-arrow-right" style="font-size: 12px;"></i>
                    </button>
                </div>

                <!-- 规则2 -->
                <div class="learn-card" onclick="startLearn(this)">
                    <div class="learn-info">
                        <div class="learn-title">交易规则</div>
                        <div class="learn-desc">接单、结算、提现等交易流程</div>
                    </div>
                    <button class="learn-btn">
                        <span>去学习</span>
                        <i class="fas fa-arrow-right" style="font-size: 12px;"></i>
                    </button>
                </div>

                <!-- 规则3 -->
                <div class="learn-card" onclick="startLearn(this)">
                    <div class="learn-info">
                        <div class="learn-title">飞单认定与处理</div>
                        <div class="learn-desc">什么是飞单，如何避免被认定</div>
                    </div>
                    <button class="learn-btn">
                        <span>去学习</span>
                        <i class="fas fa-arrow-right" style="font-size: 12px;"></i>
                    </button>
                </div>

                <!-- 规则4 -->
                <div class="learn-card" onclick="startLearn(this)">
                    <div class="learn-info">
                        <div class="learn-title">收费规则</div>
                        <div class="learn-desc">平台服务费、保障费说明</div>
                    </div>
                    <button class="learn-btn">
                        <span>去学习</span>
                        <i class="fas fa-arrow-right" style="font-size: 12px;"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- 底部指示器 -->
        <div class="page-indicator"></div>
    </div>

    <script>
        function navigateTo(page) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance"];
            var path = page + '.html';
            if (workerPages.indexOf(page) < 0 && bossPages.indexOf(page) >= 0) {
                path = '../boss/' + path;
            } else if (workerPages.indexOf(page) < 0 && bossPages.indexOf(page) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }


        function goBack() {
            window.history.back();
        }

        function startLearn(element) {
            const btn = element.querySelector('.learn-btn');
            btn.classList.add('completed');
            btn.innerHTML = '<i class="fas fa-check"></i><span>已学习</span>';
            
            // 更新进度
            const cards = document.querySelectorAll('.learn-card');
            let completed = 0;
            cards.forEach(card => {
                const btn = card.querySelector('.learn-btn');
                if (btn.innerText.includes('已学习')) {
                    completed++;
                }
            });
            
            const progressBar = document.querySelector('.progress-fill');
            const progressCount = document.querySelector('.progress-count');
            if (progressBar && progressCount) {
                progressBar.style.width = (completed / 4 * 100) + '%';
                progressCount.textContent = `已学习 ${completed}/4`;
            }
        }
    </script>
</body>
</html>
