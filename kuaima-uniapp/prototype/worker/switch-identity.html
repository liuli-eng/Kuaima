<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>切换身份 - 快马日结</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .phone-frame {
            width: 390px; height: 844px; background: #fff; overflow: hidden;
            position: relative; border-radius: 44px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15); border: 10px solid #1a1a1a;
        }
        .dynamic-island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: #000; border-radius: 20px; z-index: 50; }
        .status-bar { height: 47px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 15px; font-weight: 600; color: #333; background: #fff; }
        .nav-bar { padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; background: #fff; }
        .nav-back { display: flex; align-items: center; cursor: pointer; width: 32px; height: 32px; }
        .nav-right { display: flex; align-items: center; background: rgba(255, 255, 255, 0.9); border-radius: 20px; padding: 4px 6px; gap: 2px; }
        .nav-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
        .content-area { position: absolute; top: 99px; left: 0; right: 0; bottom: 34px; overflow-y: auto; background: #fff; }
        .avatar-section { display: flex; justify-content: center; padding: 60px 0 30px; }
        .avatar-circle { width: 120px; height: 120px; border-radius: 50%; background: #FFE4B5; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
        .identity-text { text-align: center; font-size: 22px; font-weight: 600; color: #333; margin-bottom: 60px; }
        .btn-section { padding: 0 24px; }
        .btn-primary { background: linear-gradient(135deg, #FFD700, #FFA500); color: white; padding: 18px; border-radius: 28px; text-align: center; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 16px; }
        .btn-secondary { background: #fff; color: #666; padding: 18px; border-radius: 28px; text-align: center; font-size: 16px; font-weight: 500; cursor: pointer; border: 1px solid #eee; }
        .page-indicator { height: 5px; background: #000; border-radius: 3px; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; }
    </style>
<script src="/prototype-runtime.js?v=20260825-12"></script></head>
<body class="bg-gray-100 flex justify-center items-start py-8">
    <div class="phone-frame">
        <div class="dynamic-island"></div>

        <div class="status-bar">
            <span>19:48</span>
            <div class="flex items-center gap-1">
                <i class="fas fa-signal text-sm"></i>
                <i class="fas fa-wifi text-sm"></i>
                <i class="fas fa-battery-full text-sm"></i>
            </div>
        </div>

        <div class="nav-bar">
            <div class="nav-back" onclick="goBack()">
                <i class="fas fa-chevron-left text-gray-700"></i>
            </div>
            <div style="font-size: 17px; font-weight: 600; color: #333;">切换身份</div>
            <div class="nav-right">
                <div class="nav-btn">
                    <i class="fas fa-ellipsis text-gray-700" style="font-size: 13px;"></i>
                </div>
                <div style="width: 1px; height: 14px; background: #ddd; margin: 0 2px;"></div>
                <div class="nav-btn">
                    <i class="fas fa-circle text-gray-700" style="font-size: 11px;"></i>
                </div>
            </div>
        </div>

        <div class="content-area">
            <div class="avatar-section">
                <div class="avatar-circle">
                    <img src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?w=400&h=400&fit=crop" alt="avatar">
                </div>
            </div>

            <div class="identity-text" id="identityText">你当前身份是零工</div>

            <div class="btn-section">
                <div class="btn-primary" id="switchBtn" onclick="doSwitch()">切换为老板身份</div>
                <div class="btn-secondary" onclick="notSwitch()">暂不切换</div>
            </div>
        </div>

        <div class="page-indicator"></div>
    </div>

    <script>
        function navigateTo(pageName) {
            var workerPages = ["home", "profile", "classroom", "credit", "monthly-order", "monthly-salary", "order", "message", "press-order", "press-salary", "task-detail", "task-training", "coupon", "deposit", "wallet", "service", "switch-identity", "user-info", "follow", "record", "badge", "star-level", "banner", "filter", "search", "job-detail", "simulate-order", "course-order", "course-rule", "course-video", "download", "faq-detail", "intent", "invite", "join-group", "notification", "privacy", "realname", "rule", "rule-detail", "copyright", "user-agreement", "appeal", "appeal-submit", "report", "history-message"];
            var bossPages = ["boss-employer", "boss-home", "boss-message", "boss-order", "boss-profile", "boss-publish", "search-worker", "select-job", "publish-info", "schedule-stats", "enterprise-cert", "enterprise-cert-form", "creditor-score", "talent-list", "expense-detail", "payment-detail", "recruit-manager", "recruit-address", "sub-account", "suspend-settle", "switch-account", "invite-code", "blacklist", "all-jobs", "boss-filter", "settlement", "contract", "system-notice", "missed-call", "signup-notice", "invite-friend", "service-chat", "insurance"];
            var query = '';
            var qIndex = pageName.indexOf('?');
            if (qIndex >= 0) {
                query = pageName.substring(qIndex);
                pageName = pageName.substring(0, qIndex);
            }
            var path = pageName + '.html' + query;
            if (workerPages.indexOf(pageName) < 0 && bossPages.indexOf(pageName) >= 0) {
                path = '../boss/' + path;
            } else if (workerPages.indexOf(pageName) < 0 && bossPages.indexOf(pageName) < 0) {
                path = '../' + path;
            }
            if (window.top !== window.self) { window.open(new URL(path, window.location.href).href, '_blank'); } else { window.location.href = path; }
        }


        function goBack() { window.history.back(); }
        function doSwitch() {
            if (currentRole === 'worker') {
                navigateTo('boss-home');
            } else {
                navigateTo('home');
            }
        }
        function notSwitch() {
            if (currentRole === 'worker') {
                navigateTo('profile');
            } else {
                navigateTo('boss-profile');
            }
        }

        const params = new URLSearchParams(window.location.search);
        const currentRole = params.get('role') || 'worker';
        if (currentRole === 'boss') {
            document.getElementById('identityText').textContent = '你当前身份是老板';
            document.getElementById('switchBtn').textContent = '切换为零工身份';
        }
    </script>
</body>
</html>
